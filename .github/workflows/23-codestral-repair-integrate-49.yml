name: 23 MILK Codestral repair and integrate exact 49

on:
  push:
    branches: [work/copernico-recovery-webapp-20260902]
    paths: ['.github/workflows/23-codestral-repair-integrate-49.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: milk-codestral-repair-integrate-49
  cancel-in-progress: false

jobs:
  repair:
    name: Codestral repair batch ${{ matrix.batch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { batch: 2, start: 8, end: 14 }
          - { batch: 6, start: 36, end: 42 }
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      START: ${{ matrix.start }}
      END: ${{ matrix.end }}
      BATCH: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/copernico-recovery-webapp-20260902
          fetch-depth: 0

      - name: Generate only the 14 missing runtimes with refreshed Codestral access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          python - <<'PY'
          import concurrent.futures,json,os,pathlib,random,re,subprocess,time,urllib.error,urllib.request
          API='https://api.mistral.ai/v1/chat/completions'; MODEL='codestral-latest'; key=os.environ['MISTRAL_API_KEY']
          start,end=int(os.environ['START']),int(os.environ['END']); batch=os.environ['BATCH']
          idx=json.loads(pathlib.Path('curatorial-factory/sensory-blueprints/00_INDEX.json').read_text(encoding='utf-8'))
          existing={p.name for p in pathlib.Path('deploy/atlas-public/experiences').glob('*.js') if p.name!='registry.js'}
          candidates=[x for x in idx['entries'] if start<=int(x['ordem'])<=end and x['id']+'.js' not in existing]
          rows=[]; blocked_unapproved=[]
          for x in candidates:
              bp=json.loads((pathlib.Path('curatorial-factory/sensory-blueprints')/x['file']).read_text(encoding='utf-8'))
              if bp.get('approved_for_code') is True: rows.append(x)
              else: blocked_unapproved.append(x['id'])
          print('AUTHORIAL_GATE_APPROVED_FOR_CODE='+','.join(x['id'] for x in rows))
          print('AUTHORIAL_GATE_BLOCKED='+','.join(blocked_unapproved))
          matrix=pathlib.Path('curatorial-factory/EXPERIENCE_RESEARCH_MATRIX_20260902.md').read_text(encoding='utf-8')
          constitution=pathlib.Path('curatorial-factory/DIGITAL_MULTISENSORY_EXPERIENCE_CONSTITUTION_20260902.md').read_text(encoding='utf-8')
          out=pathlib.Path('generated')/('repair-'+batch); out.mkdir(parents=True,exist_ok=True)
          system='''És Codestral, engenheiro de experiências digitais do Atlas Vivo MILK. Produz APENAS JavaScript ES completo. O blueprint é soberano. Implementa uma experiência browser real, específica, multissensorial e lúdica; nunca card, quiz, formulário, chatbot ou click->modal genérico. A interacção principal deve alterar estado perceptivo. Tempo, espera, gesto, silêncio, acaso e cruzamento sensorial só quando coerentes com o blueprint. Sem fetch, CDN, trackers, cookies, localStorage ou sessionStorage. Touch e teclado equivalentes; prefers-reduced-motion preserva significado. Som apenas após gesto. Não inventes factos, fotografias, áudios, memórias ou texto territorial. Não recries COPÉRNICO nem a entrada COSMICOXES. CONTRATO LITERAL: export function mountCuratorialExperience({ root, context = {}, onClose = () => {} }) { ... function destroy() { ... } ... return { destroy }; }'''
          def call(msgs):
              payload={'model':MODEL,'temperature':0.12,'max_tokens':10000,'messages':msgs}
              req=urllib.request.Request(API,data=json.dumps(payload,ensure_ascii=False).encode(),method='POST',headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=300) as r: body=json.loads(r.read())
              c=body['choices'][0]['message']['content']
              if isinstance(c,list): c=''.join(str(x.get('text','')) if isinstance(x,dict) else str(x) for x in c)
              return str(c).strip()
          def clean(t):
              t=re.sub(r'^```(?:javascript|js)?\s*','',t.strip(),flags=re.I); return re.sub(r'\s*```$','',t).strip()
          def validate(code,path):
              if not re.search(r'export\s+function\s+mountCuratorialExperience\s*\(',code): return 'missing mount'
              if not re.search(r'function\s+destroy\s*\(',code): return 'missing destroy'
              if not re.search(r'return\s*\{\s*destroy\s*\}',code): return 'missing return destroy'
              if any(x in code for x in ('fetch(','localStorage','sessionStorage')): return 'forbidden network/storage'
              tmp=path.with_suffix('.tmp.js')
              tmp.write_text(code+'\n',encoding='utf-8')
              p=subprocess.run(['node','--check',str(tmp)],capture_output=True,text=True)
              if p.returncode:
                  tmp.unlink(missing_ok=True)
                  return (p.stderr or p.stdout)[-2200:]
              tmp.replace(path)
              return None
          def build(row):
              bp=json.loads((pathlib.Path('curatorial-factory/sensory-blueprints')/row['file']).read_text(encoding='utf-8'))
              user=json.dumps({'id':row['id'],'blueprint':bp,'research_lenses':matrix,'constitution':constitution},ensure_ascii=False)
              previous=''; err='unknown'; path=out/(row['id']+'.js')
              for attempt in range(8):
                  msgs=[{'role':'system','content':system},{'role':'user','content':user}]
                  if attempt: msgs += [{'role':'assistant','content':previous[:50000]},{'role':'user','content':'Repara o módulo integralmente. Erro do validador: '+err+'. Mantém a profundidade da experiência. Devolve só JavaScript completo e cumpre literalmente mount/destroy/return.'}]
                  try:
                      previous=clean(call(msgs)); err=validate(previous,path)
                      if not err:
                          print('CODESTRAL_REPAIR_PASS='+row['id'],flush=True); return
                  except urllib.error.HTTPError as e:
                      err='HTTP '+str(e.code)
                      if e.code not in (408,409,429,500,502,503,504):
                          raise RuntimeError(row['id']+':'+err)
                  except Exception as e: err=type(e).__name__+':'+str(e)
                  time.sleep(min(30,2**attempt+random.random()*2))
              raise RuntimeError(row['id']+':'+err)
          failures=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as ex:
              futs={ex.submit(build,row):row for row in rows}
              for fut,row in futs.items():
                  try: fut.result()
                  except Exception as e: failures.append(str(e))
          status={'batch':batch,'requested':[x['id'] for x in rows],'blocked_unapproved':blocked_unapproved,'generated':sorted(p.stem for p in out.glob('*.js')),'failures':failures}
          (out/('status-'+batch+'.json')).write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if failures:
              print('\n'.join('CODESTRAL_REPAIR_FAIL='+x for x in failures))
          print('CODESTRAL_REPAIR_BATCH_CHECKPOINT='+batch+':'+str(len(status['generated']))+'/'+str(len(rows)))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: codestral-repair-batch-${{ matrix.batch }}
          path: generated/repair-${{ matrix.batch }}/
          if-no-files-found: error
          retention-days: 3

  integrate:
    name: Materialize and register exact 49
    needs: repair
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/copernico-recovery-webapp-20260902
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: codestral-repair-batch-*
          path: generated/repair
          merge-multiple: true

      - name: Merge repaired 14 into preserved 35 and build exact registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,shutil,subprocess
          idx=json.loads(pathlib.Path('curatorial-factory/sensory-blueprints/00_INDEX.json').read_text(encoding='utf-8'))
          dst=pathlib.Path('deploy/atlas-public/experiences'); dst.mkdir(parents=True,exist_ok=True)
          expected={x['id']+'.js' for x in idx['entries']}
          repair=list(pathlib.Path('generated/repair').glob('*.js'))
          for p in repair:
              assert p.name in expected, 'UNEXPECTED_RUNTIME:'+p.name
              subprocess.run(['node','--check',str(p)],check=True)
              shutil.copy2(p,dst/p.name)
          actual={p.name for p in dst.glob('*.js') if p.name!='registry.js'}
          extra=sorted(actual-expected); assert not extra,extra
          missing=sorted(expected-actual)
          pathlib.Path('generated/repair/missing_after.txt').write_text('\n'.join(missing)+('\n' if missing else ''),encoding='utf-8')
          if not missing:
              lines=['// Exact 49 Atlas Vivo MILK curatorial runtime loaders','export const CURATORIAL_EXPERIENCE_LOADERS = {']
              for x in idx['entries']: lines.append(f"  {json.dumps(x['id'])}: () => import('./{x['id']}.js'),")
              lines += ['};','','export async function loadCuratorialExperience(id) {','  const loader = CURATORIAL_EXPERIENCE_LOADERS[id];',"  if (!loader) throw new Error('CURATORIAL_RUNTIME_NOT_FOUND:'+id);",'  return loader();','}','']
              (dst/'registry.js').write_text('\n'.join(lines),encoding='utf-8')
          for p in dst.glob('*.js'): subprocess.run(['node','--check',str(p)],check=True)
          print('CODESTRAL_RUNTIME_CHECKPOINT='+str(len(actual))+'/49')
          print('CODESTRAL_MISSING='+','.join(x.removesuffix('.js') for x in missing))
          PY
          git diff --check

      - name: Commit preserved runtime checkpoint
        run: |
          set -euo pipefail
          git config user.name 'Atlas Mistral Code'
          git config user.email 'milk@associacaomilk.pt'
          git add deploy/atlas-public/experiences
          if git diff --cached --quiet; then
            echo CODESTRAL_CHECKPOINT_NO_CHANGE=1
          else
            git commit -m 'feat(experiences): preserve validated Codestral runtime checkpoint'
            git pull --rebase origin work/copernico-recovery-webapp-20260902
            git push origin HEAD:work/copernico-recovery-webapp-20260902
            echo CODESTRAL_CHECKPOINT_PUSHED=1
          fi

      - name: Enforce exact 49 runtime gate
        shell: bash
        run: |
          set -euo pipefail
          test ! -s generated/repair/missing_after.txt
          python - <<'PY'
          import json,pathlib
          idx=json.loads(pathlib.Path('curatorial-factory/sensory-blueprints/00_INDEX.json').read_text(encoding='utf-8'))
          blocked=[]
          for row in idx['entries']:
              bp=json.loads((pathlib.Path('curatorial-factory/sensory-blueprints')/row['file']).read_text(encoding='utf-8'))
              if bp.get('approved_for_code') is not True: blocked.append(row['id'])
          if blocked: raise SystemExit('AUTHORIAL_GATE_BLOCKED:'+','.join(blocked))
          print('AUTHORIAL_GATE_49_APPROVED=PASS')
          PY
          node tests/ia-milk-public-boundary.test.mjs
          if grep -RInE 'MISTRAL_API_KEY|PTSERVIDOR_.*PASSWORD|NEXTCLOUD_.*KEY|client_secret|access_token' deploy/atlas-public/experiences; then exit 31; fi
          echo CODESTRAL_49_RUNTIME_GATE=PASS

      - name: Dispatch deep refinement and private PTServidor staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for wf in 21-mistral-code-deep-curatorial-refinement.yml ptservidor-private-webapp-staging.yml; do
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/dispatches" \
              -d '{"ref":"work/copernico-recovery-webapp-20260902"}'
            echo DISPATCHED=$wf
          done

# refreshed primary MISTRAL_API_KEY validated with codestral-latest at 2026-09-02T13:31Z
