name: MILK Gmail Connector Schema Probe

on:
  workflow_dispatch:
  push:
    branches:
      - work/integral-resolution-mistral-20260825
    paths:
      - '.github/workflows/milk-gmail-tool-schema-probe.yml'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Install SDK
        run: python -m pip install --quiet mistralai==2.9.3
      - name: List Gmail tool names and input property names only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          from mistralai.client import Mistral

          def d(v):
              return v.model_dump(by_alias=True) if hasattr(v,'model_dump') else v
          with Mistral(api_key=os.environ['MISTRAL_API_KEY']) as client:
              raw=client.beta.connectors.list_tools(connector_id_or_name='gmail',page=1,page_size=100,refresh=False,pretty=False)
          obj=d(raw)
          if isinstance(obj,dict): tools=obj.get('items') or obj.get('data') or obj.get('tools') or []
          elif isinstance(obj,list): tools=obj
          else:
              try: tools=[d(x) for x in raw]
              except Exception: tools=[]
          safe=[]
          for item in tools:
              item=d(item)
              if not isinstance(item,dict): continue
              name=str(item.get('name',''))
              schema=item.get('inputSchema') or item.get('input_schema') or {}
              props=sorted((schema.get('properties') or {}).keys()) if isinstance(schema,dict) else []
              required=sorted(schema.get('required') or []) if isinstance(schema,dict) else []
              safe.append({'name':name,'properties':props,'required':required})
              print('GMAIL_TOOL_SCHEMA name='+name+' properties='+','.join(props)+' required='+','.join(required))
          body=f"MILK_GMAIL_SCHEMA_PROBE run={os.environ['RUN_ID']} tools={len(safe)} content_read=0 secrets_disclosed=0 model_involved=0"
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/issues/35/comments",data=json.dumps({'body':body}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
          urllib.request.urlopen(req,timeout=45).read()
          PY
