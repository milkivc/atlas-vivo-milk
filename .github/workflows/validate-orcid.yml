name: Validate ORCIDs

on:
  push:
    paths:
      - '**.json'
      - '**.md'
      - '**.yml'
      - '**.yaml'
  pull_request:
    paths:
      - '**.json'
      - '**.md'
      - '**.yml'
      - '**.yaml'

jobs:
  validate-orcids:
    name: Validate ORCIDs in repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate ORCIDs and reject placeholders
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const allowedExtensions = new Set(['.json', '.md', '.yml', '.yaml']);
          const ignoredDirectories = new Set(['.git', 'node_modules']);
          const orcidRegex = /\b\d{4}-\d{4}-\d{4}-[\dX]\b/g;
          const zeroPlaceholder = ['0000', '0000', '0000', '0000'].join('-');

          function scanFiles(dir, out = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.isDirectory() && ignoredDirectories.has(entry.name)) continue;
              const filePath = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                scanFiles(filePath, out);
              } else if (allowedExtensions.has(path.extname(entry.name).toLowerCase())) {
                out.push(filePath);
              }
            }
            return out;
          }

          function validChecksum(orcid) {
            const compact = orcid.replace(/-/g, '').toUpperCase();
            if (!/^\d{15}[\dX]$/.test(compact)) return false;
            let total = 0;
            for (let i = 0; i < 15; i++) total = (total + Number(compact[i])) * 2;
            const remainder = total % 11;
            const result = (12 - remainder) % 11;
            const expected = result === 10 ? 'X' : String(result);
            return compact[15] === expected;
          }

          const files = scanFiles('.');
          const findings = [];
          let count = 0;

          for (const filePath of files) {
            const text = fs.readFileSync(filePath, 'utf8');
            const matches = text.match(orcidRegex) || [];
            for (const orcid of matches) {
              count += 1;
              if (orcid === zeroPlaceholder) {
                findings.push(`${filePath}: placeholder ${orcid}`);
              } else if (!validChecksum(orcid)) {
                findings.push(`${filePath}: checksum inválido ${orcid}`);
              }
            }
          }

          console.log(`ORCIDs encontrados: ${count}`);
          console.log(`Ficheiros verificados: ${files.length}`);

          if (findings.length) {
            console.error('Falhas de ORCID:');
            for (const finding of findings) console.error(`- ${finding}`);
            process.exit(1);
          }

          if (count === 0) {
            console.error('Nenhum ORCID encontrado nos ficheiros de metadados/documentação.');
            process.exit(1);
          }

          console.log('ORCIDs válidos e sem placeholders.');
          NODE

      - name: Verify Eduardo Mauer authorship metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f metadata/territorial-reader/AUTHORSHIP_AND_RIGHTS.json
          jq -e '.authorialSignature.orcidId == "0009-0007-6892-6570"' metadata/territorial-reader/AUTHORSHIP_AND_RIGHTS.json >/dev/null
          jq -e '.work.soleAuthor == "Eduardo Maurício Vieira Cabral e Araujo"' metadata/territorial-reader/AUTHORSHIP_AND_RIGHTS.json >/dev/null
          jq -e '.work.authorialName == "Eduardo Mauer"' metadata/territorial-reader/AUTHORSHIP_AND_RIGHTS.json >/dev/null
          echo "Metadados autorais verificados."
