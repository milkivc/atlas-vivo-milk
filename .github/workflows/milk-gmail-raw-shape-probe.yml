name: MILK Gmail Raw Shape Probe

on:
  workflow_dispatch:
  push:
    branches:
      - work/integral-resolution-mistral-20260825
    paths:
      - '.github/workflows/milk-gmail-raw-shape-probe.yml'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - run: python -m pip install --quiet mistralai==2.9.3
      - name: Probe response shapes and secret-phrase flags only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,re,urllib.request
          from mistralai.client import Mistral

          def dump(v):
              if hasattr(v,'model_dump'):return v.model_dump(by_alias=True)
              if isinstance(v,(dict,list,str,int,float,bool)) or v is None:return v
              try:return dict(v)
              except Exception:return str(v)

          def shape(v,path='$',depth=0,out=None):
              if out is None:out=[]
              if depth>8:return out
              v=dump(v)
              if isinstance(v,dict):
                  out.append((path,'dict',len(v),False,False))
                  for k,x in v.items():shape(x,f'{path}.{k}',depth+1,out)
              elif isinstance(v,list):
                  out.append((path,'list',len(v),False,False))
                  for i,x in enumerate(v[:20]):shape(x,f'{path}[{i}]',depth+1,out)
              elif isinstance(v,str):
                  low=v.lower()
                  direct=('password' in low or 'ptservidor' in low)
                  decoded_flag=False
                  t=v.strip()
                  if len(t)>=16 and re.fullmatch(r'[A-Za-z0-9_=/+-]+',t):
                      for decoder in ('urlsafe','standard'):
                          try:
                              b=(base64.urlsafe_b64decode if decoder=='urlsafe' else base64.b64decode)(t+'='*((4-len(t)%4)%4))
                              s=b.decode('utf-8','ignore').lower()
                              if 'password' in s or 'ptservidor' in s:decoded_flag=True
                          except Exception:pass
                  out.append((path,'str',len(v),direct,decoded_flag))
              else:out.append((path,type(v).__name__,0,False,False))
              return out

          results=[]
          with Mistral(api_key=os.environ['MISTRAL_API_KEY']) as client:
              for fmt in ('full','raw','metadata','minimal'):
                  try:
                      r=client.beta.connectors.call_tool(tool_name='get_thread',connector_id_or_name='gmail',arguments={'threadId':'1a02a62ca0e3cfa7','messageFormat':fmt})
                      rows=shape(r)
                      print(f'GMAIL_SHAPE format={fmt} status=ok paths={len(rows)} direct_phrase_paths={sum(1 for x in rows if x[3])} decoded_phrase_paths={sum(1 for x in rows if x[4])}')
                      for p,t,n,d,b in rows[:120]:
                          print(f'GMAIL_FIELD format={fmt} path={p} type={t} length={n} direct_phrase={int(d)} decoded_phrase={int(b)}')
                      results.append((fmt,'ok',len(rows),sum(1 for x in rows if x[3]),sum(1 for x in rows if x[4])))
                  except Exception as exc:
                      print(f'GMAIL_SHAPE format={fmt} status=failed error_type={type(exc).__name__}')
                      results.append((fmt,'failed',0,0,0))
          summary=';'.join(f'{a}:{b}:paths={c}:direct={d}:decoded={e}' for a,b,c,d,e in results)
          msg=f'MILK_GMAIL_RAW_SHAPE_PROBE run={os.environ["RUN_ID"]} {summary} content_disclosed=0 secrets_disclosed=0 model_involved=0'
          req=urllib.request.Request(f'https://api.github.com/repos/{os.environ["REPO"]}/issues/35/comments',data=json.dumps({'body':msg}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
          urllib.request.urlopen(req,timeout=45).read()
          PY
