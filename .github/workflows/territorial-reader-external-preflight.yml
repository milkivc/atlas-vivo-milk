name: MILK Territorial Reader — preflight de preservação externa

on:
  push:
    branches:
      - 'work/territorial-reader-saneado-20260822'
    paths:
      - '.github/workflows/territorial-reader-external-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      ZENODO_GENERIC: ${{ secrets.ZENODO_TOKEN }}
      ZENODO_EDUARDO: ${{ secrets.EDU_ZEN_MILK }}
      ZENODO_MILK: ${{ secrets.MILK_ZENODO }}
      ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
      ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
      ORCID_TOKEN: ${{ secrets.ORCID_TOKEN }}
      DATACITE_REPOSITORY_ID: ${{ secrets.DATACITE_REPOSITORY_ID }}
      DATACITE_PASSWORD: ${{ secrets.DATACITE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Probe actual credential routes without disclosing values
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, json, urllib.request, urllib.error, base64, pathlib

          def http(url, headers=None, timeout=30):
              req=urllib.request.Request(url, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read(2_000_000)
              except urllib.error.HTTPError as e:
                  return e.code, e.read(2_000_000)
              except Exception:
                  return 0, b''

          def zenodo_probe(token):
              if not token: return {'configured': False, 'status': 0}
              s,_=http('https://zenodo.org/api/deposit/depositions?size=1', {'Authorization':'Bearer '+token,'Accept':'application/json'})
              return {'configured': True, 'status': s, 'authenticated': s==200}

          result={
            'codeberg': {'configured': bool(os.getenv('CODEBERG_TOKEN'))},
            'zenodo': {
              'generic': zenodo_probe(os.getenv('ZENODO_GENERIC')),
              'eduardo': zenodo_probe(os.getenv('ZENODO_EDUARDO')),
              'milk': zenodo_probe(os.getenv('ZENODO_MILK')),
            },
            'orcid': {
              'clientIdConfigured': bool(os.getenv('ORCID_CLIENT_ID')),
              'clientSecretConfigured': bool(os.getenv('ORCID_CLIENT_SECRET')),
              'tokenConfigured': bool(os.getenv('ORCID_TOKEN')),
            },
            'datacite': {'configured': bool(os.getenv('DATACITE_REPOSITORY_ID') and os.getenv('DATACITE_PASSWORD'))},
            'softwareHeritage': {}
          }

          if result['codeberg']['configured']:
              h={'Authorization':'token '+os.environ['CODEBERG_TOKEN'],'Accept':'application/json'}
              s,b=http('https://codeberg.org/api/v1/user',h)
              result['codeberg']['authStatus']=s
              try: result['codeberg']['account']=json.loads(b).get('login') if s==200 else None
              except Exception: result['codeberg']['account']=None
              s2,_=http('https://codeberg.org/api/v1/repos/associacaomilk/atlas-vivo-milk',h)
              result['codeberg']['repoStatus']=s2

          if result['orcid']['tokenConfigured']:
              h={'Authorization':'Bearer '+os.environ['ORCID_TOKEN'],'Accept':'application/vnd.orcid+json'}
              s,_=http('https://api.orcid.org/v3.0/0009-0007-6892-6570/record',h)
              result['orcid']['authenticatedRecordStatus']=s
          else:
              result['orcid']['authenticatedRecordStatus']=0

          if result['datacite']['configured']:
              rid=os.environ['DATACITE_REPOSITORY_ID']
              auth=base64.b64encode((rid+':'+os.environ['DATACITE_PASSWORD']).encode()).decode()
              s,_=http('https://api.datacite.org/repositories/'+rid,{'Authorization':'Basic '+auth,'Accept':'application/vnd.api+json'})
              result['datacite']['repositoryAuthStatus']=s
          else:
              result['datacite']['repositoryAuthStatus']=0

          s,_=http('https://archive.softwareheritage.org/api/1/stat/counters/',{'Accept':'application/json'})
          result['softwareHeritage']['apiStatus']=s

          pathlib.Path(os.environ['RUNNER_TEMP'],'external-preflight.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              pairs={
                'codeberg': result['codeberg'].get('authStatus',0),
                'codeberg_repo': result['codeberg'].get('repoStatus',0),
                'zen_generic_cfg': int(result['zenodo']['generic']['configured']),
                'zen_generic': result['zenodo']['generic']['status'],
                'zen_edu_cfg': int(result['zenodo']['eduardo']['configured']),
                'zen_edu': result['zenodo']['eduardo']['status'],
                'zen_milk_cfg': int(result['zenodo']['milk']['configured']),
                'zen_milk': result['zenodo']['milk']['status'],
                'orcid_client_id': int(result['orcid']['clientIdConfigured']),
                'orcid_client_secret': int(result['orcid']['clientSecretConfigured']),
                'orcid_token': int(result['orcid']['tokenConfigured']),
                'orcid_status': result['orcid']['authenticatedRecordStatus'],
                'datacite_cfg': int(result['datacite']['configured']),
                'datacite_status': result['datacite']['repositoryAuthStatus'],
                'swh': result['softwareHeritage']['apiStatus'],
              }
              for k,v in pairs.items(): out.write(f'{k}={v}\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: territorial-reader-external-preflight
          path: ${{ runner.temp }}/external-preflight.json
          retention-days: 7

      - name: Publish sanitized receipt
        if: always()
        shell: bash
        env:
          CBG: ${{ steps.probe.outputs.codeberg }}
          CBG_REPO: ${{ steps.probe.outputs.codeberg_repo }}
          ZGCFG: ${{ steps.probe.outputs.zen_generic_cfg }}
          ZG: ${{ steps.probe.outputs.zen_generic }}
          ZECFG: ${{ steps.probe.outputs.zen_edu_cfg }}
          ZE: ${{ steps.probe.outputs.zen_edu }}
          ZMCFG: ${{ steps.probe.outputs.zen_milk_cfg }}
          ZM: ${{ steps.probe.outputs.zen_milk }}
          OCID: ${{ steps.probe.outputs.orcid_client_id }}
          OCS: ${{ steps.probe.outputs.orcid_client_secret }}
          OT: ${{ steps.probe.outputs.orcid_token }}
          OS: ${{ steps.probe.outputs.orcid_status }}
          DCCFG: ${{ steps.probe.outputs.datacite_cfg }}
          DCS: ${{ steps.probe.outputs.datacite_status }}
          SWH: ${{ steps.probe.outputs.swh }}
        run: |
          body="TERRITORIAL_EXTERNAL_PREFLIGHT_V2 run=${GITHUB_RUN_ID} codeberg_auth=${CBG:-0} codeberg_repo=${CBG_REPO:-0} zenodo_generic_configured=${ZGCFG:-0} zenodo_generic_api=${ZG:-0} edu_zen_milk_configured=${ZECFG:-0} edu_zen_milk_api=${ZE:-0} milk_zenodo_configured=${ZMCFG:-0} milk_zenodo_api=${ZM:-0} orcid_client_id_configured=${OCID:-0} orcid_client_secret_configured=${OCS:-0} orcid_token_configured=${OT:-0} orcid_auth_read=${OS:-0} datacite_configured=${DCCFG:-0} datacite_repo=${DCS:-0} swh_api=${SWH:-0} secret_values_disclosed=0 external_writes=0"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' \
            "https://api.github.com/repos/$GH_REPOSITORY/issues/35/comments" \
            -d "$(jq -n --arg body "$body" '{body:$body}')" >/dev/null
