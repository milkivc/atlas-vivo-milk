name: MILK Territorial Reader — preflight de preservação externa

on:
  push:
    branches:
      - 'work/territorial-reader-saneado-20260822'
    paths:
      - '.github/workflows/territorial-reader-external-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
      ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
      ORCID_TOKEN: ${{ secrets.ORCID_TOKEN }}
      DATACITE_REPOSITORY_ID: ${{ secrets.DATACITE_REPOSITORY_ID }}
      DATACITE_PASSWORD: ${{ secrets.DATACITE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Probe routes without disclosing credentials
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error, base64, pathlib

          def http(url, headers=None, method='GET', data=None, timeout=30):
              req=urllib.request.Request(url, data=data, method=method, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      body=r.read(2_000_000)
                      return r.status, body
              except urllib.error.HTTPError as e:
                  return e.code, e.read(2_000_000)
              except Exception:
                  return 0, b''

          result={
            'codeberg': {'configured': bool(os.getenv('CODEBERG_TOKEN'))},
            'zenodo': {'configured': bool(os.getenv('ZENODO_TOKEN'))},
            'orcid': {
              'clientConfigured': bool(os.getenv('ORCID_CLIENT_ID') and os.getenv('ORCID_CLIENT_SECRET')),
              'tokenConfigured': bool(os.getenv('ORCID_TOKEN')),
            },
            'datacite': {'configured': bool(os.getenv('DATACITE_REPOSITORY_ID') and os.getenv('DATACITE_PASSWORD'))},
            'softwareHeritage': {},
          }

          if result['codeberg']['configured']:
              h={'Authorization':'token '+os.environ['CODEBERG_TOKEN'], 'Accept':'application/json'}
              s,b=http('https://codeberg.org/api/v1/user',h)
              result['codeberg']['authStatus']=s
              try: result['codeberg']['account']=json.loads(b).get('login') if s==200 else None
              except Exception: result['codeberg']['account']=None
              s2,_=http('https://codeberg.org/api/v1/repos/associacaomilk/atlas-vivo-milk',h)
              result['codeberg']['repoStatus']=s2
              s3,_=http('https://codeberg.org/api/swagger')
              result['codeberg']['swaggerStatus']=s3

          if result['zenodo']['configured']:
              h={'Authorization':'Bearer '+os.environ['ZENODO_TOKEN'], 'Accept':'application/json'}
              s,b=http('https://zenodo.org/api/deposit/depositions?size=1',h)
              result['zenodo']['depositApiStatus']=s
              result['zenodo']['writeRouteAuthenticated']=s==200

          if result['orcid']['tokenConfigured']:
              h={'Authorization':'Bearer '+os.environ['ORCID_TOKEN'], 'Accept':'application/vnd.orcid+json'}
              s,_=http('https://pub.orcid.org/v3.0/0009-0007-6892-6570/record',h)
              if s in (401,403,0):
                  s,_=http('https://api.orcid.org/v3.0/0009-0007-6892-6570/record',h)
              result['orcid']['recordReadStatus']=s

          if result['datacite']['configured']:
              rid=os.environ['DATACITE_REPOSITORY_ID']
              auth=base64.b64encode((rid+':'+os.environ['DATACITE_PASSWORD']).encode()).decode()
              h={'Authorization':'Basic '+auth, 'Accept':'application/vnd.api+json'}
              s,_=http('https://api.datacite.org/repositories/'+rid,h)
              result['datacite']['repositoryAuthStatus']=s

          s,b=http('https://archive.softwareheritage.org/api/1/stat/counters/', {'Accept':'application/json'})
          result['softwareHeritage']['apiStatus']=s
          result['softwareHeritage']['saveCodeNowRoute']='https://archive.softwareheritage.org/api/1/origin/save/?visit_type=git&origin_url=...'

          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'external-preflight.json'
          p.write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              for key,val in [
                ('codeberg', result['codeberg'].get('authStatus',0)),
                ('codeberg_repo', result['codeberg'].get('repoStatus',0)),
                ('zenodo', result['zenodo'].get('depositApiStatus',0)),
                ('orcid', result['orcid'].get('recordReadStatus',0)),
                ('datacite', result['datacite'].get('repositoryAuthStatus',0)),
                ('swh', result['softwareHeritage'].get('apiStatus',0)),
                ('zenodo_configured', int(result['zenodo']['configured'])),
                ('orcid_token', int(result['orcid']['tokenConfigured'])),
                ('datacite_configured', int(result['datacite']['configured'])),
              ]: out.write(f'{key}={val}\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: territorial-reader-external-preflight
          path: ${{ runner.temp }}/external-preflight.json
          retention-days: 7

      - name: Publish sanitized receipt
        if: always()
        shell: bash
        env:
          CBG: ${{ steps.probe.outputs.codeberg }}
          CBG_REPO: ${{ steps.probe.outputs.codeberg_repo }}
          ZEN: ${{ steps.probe.outputs.zenodo }}
          ORCID: ${{ steps.probe.outputs.orcid }}
          DC: ${{ steps.probe.outputs.datacite }}
          SWH: ${{ steps.probe.outputs.swh }}
          ZEN_CFG: ${{ steps.probe.outputs.zenodo_configured }}
          ORCID_TOKEN_CFG: ${{ steps.probe.outputs.orcid_token }}
          DC_CFG: ${{ steps.probe.outputs.datacite_configured }}
        run: |
          body="TERRITORIAL_EXTERNAL_PREFLIGHT run=${GITHUB_RUN_ID} codeberg_auth=${CBG:-0} codeberg_repo=${CBG_REPO:-0} zenodo_configured=${ZEN_CFG:-0} zenodo_api=${ZEN:-0} orcid_token_configured=${ORCID_TOKEN_CFG:-0} orcid_read=${ORCID:-0} datacite_configured=${DC_CFG:-0} datacite_repo=${DC:-0} swh_api=${SWH:-0} secret_values_disclosed=0 external_writes=0"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' \
            "https://api.github.com/repos/$GH_REPOSITORY/issues/35/comments" \
            -d "$(jq -n --arg body "$body" '{body:$body}')" >/dev/null
