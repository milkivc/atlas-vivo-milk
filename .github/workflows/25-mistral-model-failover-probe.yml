name: 25 MILK Mistral in-account model failover probe

on:
  push:
    branches: [work/copernico-recovery-webapp-20260902]
    paths: ['.github/workflows/25-mistral-model-failover-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      KEY_A: ${{ secrets.MISTRAL_API_KEY }}
      KEY_B: ${{ secrets.MISTRALAPI_KEY }}
    steps:
      - name: Discover and probe available Mistral code-capable models
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.error,urllib.request
          keys=[]
          for label,name in [('A','KEY_A'),('B','KEY_B')]:
              v=os.environ.get(name,'').strip()
              if v and all(v!=x[1] for x in keys): keys.append((label,v))
          if not keys: raise SystemExit('NO_MISTRAL_KEYS')
          preferred=['codestral-latest','devstral-latest','devstral-small-latest','mistral-small-latest','ministral-8b-latest','ministral-3b-latest','open-mistral-nemo']
          results=[]; chosen=None
          for label,key in keys:
              models=[]
              try:
                  req=urllib.request.Request('https://api.mistral.ai/v1/models',headers={'Authorization':'Bearer '+key})
                  with urllib.request.urlopen(req,timeout=45) as r: body=json.loads(r.read())
                  models=[m.get('id') for m in body.get('data',[]) if m.get('id')]
                  print(f'MISTRAL_KEY_{label}_MODEL_LIST=PASS count={len(models)}')
              except urllib.error.HTTPError as e:
                  print(f'MISTRAL_KEY_{label}_MODEL_LIST=HTTP_{e.code}')
              candidates=[]
              for p in preferred:
                  if p in models or not models: candidates.append(p)
              for m in models:
                  low=m.lower()
                  if any(k in low for k in ('code','devstral','ministral','mistral-small')) and m not in candidates: candidates.append(m)
              for model in candidates[:18]:
                  payload={'model':model,'temperature':0,'max_tokens':32,'messages':[{'role':'user','content':'Return only: export function ok(){return 1}'}]}
                  req=urllib.request.Request('https://api.mistral.ai/v1/chat/completions',data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})
                  try:
                      with urllib.request.urlopen(req,timeout=60) as r:
                          body=json.loads(r.read()); text=str(body['choices'][0]['message']['content'])
                      print(f'MISTRAL_MODEL_PROBE=PASS key={label} model={model}')
                      chosen=(label,model); break
                  except urllib.error.HTTPError as e:
                      print(f'MISTRAL_MODEL_PROBE=FAIL key={label} model={model} http={e.code}')
                      results.append((label,model,e.code))
                  except Exception as e:
                      print(f'MISTRAL_MODEL_PROBE=FAIL key={label} model={model} error={type(e).__name__}')
                  if chosen: break
              if chosen: break
          if not chosen:
              codes={r[2] for r in results}
              print('MISTRAL_IN_ACCOUNT_MODEL_FAILOVER=NONE')
              print('HTTP_CODES='+','.join(map(str,sorted(codes))))
              raise SystemExit(42)
          print('MISTRAL_IN_ACCOUNT_MODEL_FAILOVER=PASS')
          print('SELECTED_KEY_SLOT='+chosen[0])
          print('SELECTED_MODEL='+chosen[1])
          PY
