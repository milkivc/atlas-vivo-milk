name: 25 MILK validate refreshed MISTRAL_API_KEY

on:
  push:
    branches: [work/copernico-recovery-webapp-20260902]
    paths: ['.github/workflows/25-mistral-model-failover-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - name: Validate refreshed primary Mistral credential
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,urllib.error,urllib.request
          key=os.environ.get('MISTRAL_API_KEY','').strip()
          if not key: raise SystemExit('MISTRAL_API_KEY_MISSING')
          models=['codestral-latest','devstral-small-latest','mistral-small-latest']
          for model in models:
              payload={'model':model,'temperature':0,'max_tokens':24,'messages':[{'role':'user','content':'Return only OK'}]}
              req=urllib.request.Request('https://api.mistral.ai/v1/chat/completions',data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=45) as r: r.read()
                  print('MISTRAL_REFRESHED_KEY=PASS')
                  print('MISTRAL_MODEL='+model)
                  raise SystemExit(0)
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')[:800]
                  try:
                      obj=json.loads(raw); reason=str(obj.get('message') or obj.get('detail') or obj.get('error') or raw)
                  except Exception: reason=raw
                  reason=re.sub(r'(sk-[A-Za-z0-9_-]+|Bearer\s+\S+)','[REDACTED]',reason)
                  print(f'MISTRAL_MODEL_FAIL={model}:HTTP_{e.code}:{" ".join(reason.split())[:300]}')
          raise SystemExit('MISTRAL_REFRESHED_KEY_NO_USABLE_MODEL')
          PY
