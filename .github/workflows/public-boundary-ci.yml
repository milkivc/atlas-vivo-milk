name: Atlas — fronteira pública e não-regressão

on:
  push:
    branches:
      - work/atlas-canonical-surface-20260827
    paths:
      - "deploy/atlas-public/**"
      - "tests/ia-milk-public-boundary.test.mjs"
      - ".github/workflows/public-boundary-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-public-boundary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Provar fronteira pública da IA MILK
        run: node tests/ia-milk-public-boundary.test.mjs
      - name: Impedir referências invisíveis no pacote público
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'src/territorial-reader|evidence-graph|raw_evidence|source_private|mistral_prompt|CPANEL_|FTPS_|ZENODO_|ORCID_|CODEBERG_|secret|token' deploy/atlas-public --exclude='ia-milk-public-boundary.js'; then
            echo "MILK_PUBLIC_BOUNDARY_FORBIDDEN_REFERENCE"
            exit 1
          fi
          echo "MILK_PUBLIC_PACKAGE_ISOLATED"
      - name: Confirmar manifesto e validação humana
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import manifest from "./deploy/atlas-public/public-manifest.json" with { type: "json" };
          if (manifest.layer !== "public") throw new Error("layer inválida");
          if (manifest.human_validation?.status !== "approved") throw new Error("gate humano em falta");
          if (manifest.reverse_link_to_private !== false) throw new Error("ligação reversa proibida");
          if (manifest.public_contract?.requirements_total !== 540) throw new Error("matriz 540 incompleta");
          console.log("ATLAS_PUBLIC_MANIFEST_OK");
          NODE
