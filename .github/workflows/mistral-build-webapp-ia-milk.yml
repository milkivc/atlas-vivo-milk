name: Mistral build Web App and IA MILK

on:
  push:
    branches: [codex/safety-gate-2026-08-10]
    paths:
      - 'ops/mistral_build_execute.py'
      - '.github/workflows/mistral-build-webapp-ia-milk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/safety-gate-2026-08-10
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute Mistral code builders
        run: python ops/mistral_build_execute.py
      - name: Test IA MILK
        shell: bash
        run: |
          set -euo pipefail
          test -d ia-milk
          python -m compileall -q ia-milk
          python -m pip install --quiet pytest
          python -m pytest -q ia-milk
      - name: Test and build Web App
        shell: bash
        run: |
          set -euo pipefail
          test -f webapp/package.json
          cd webapp
          npm install --ignore-scripts
          npm test -- --run
          npm run build
      - name: Guard generated tree
        shell: bash
        run: |
          set -euo pipefail
          test -d webapp
          test -d ia-milk
          ! grep -RIlE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|sk-[A-Za-z0-9_-]{20,}|password[[:space:]]*=[[:space:]]*[^$])' webapp ia-milk
      - name: Commit tested agent output to safety branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MILK Mistral Executor'
          git config user.email 'milk@associacaomilk.pt'
          git add webapp ia-milk artifacts/mistral-build-receipt.json
          if git diff --cached --quiet; then
            echo 'no_generated_changes=true'
          else
            git commit -m 'Mistral: build Atlas Web App and IA MILK RAG'
            git push origin HEAD:codex/safety-gate-2026-08-10
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-mistral-webapp-ia-milk-build
          path: |
            artifacts/mistral-build-receipt.json
            webapp
            ia-milk
          if-no-files-found: ignore
