name: MILK Nextcloud Public Probe
on:
  push:
    branches: [codex/safety-gate-2026-08-10]
    paths: ['.github/workflows/milk-nextcloud-public-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Nextcloud status and WebDAV without credentials
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, urllib.error
          base='https://associacaomilk.pt/nextcloud'
          r=urllib.request.urlopen(base+'/status.php',timeout=30)
          body=r.read(); d=json.loads(body)
          safe={k:d.get(k) for k in ['installed','maintenance','needsDbUpgrade','version','versionstring','edition','productname','extendedSupport'] if k in d}
          print('NEXTCLOUD_STATUS='+json.dumps(safe,sort_keys=True))
          for path in ['/remote.php/dav/','/remote.php/webdav/']:
              req=urllib.request.Request(base+path,method='PROPFIND',headers={'Depth':'0'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as x: print('DAV',path,x.status)
              except urllib.error.HTTPError as e: print('DAV',path,e.code)
          atlas=urllib.request.urlopen('https://atlas.associacaomilk.pt/',timeout=30).read().decode('utf-8','replace')
          markers={m:(m.lower() in atlas.lower()) for m in ['Atlas Vivo MILK','COSMICOXES','Galeria Diletante','Fucô','Nuno']}
          print('ATLAS_MARKERS='+json.dumps(markers,sort_keys=True))
          print('ATLAS_BYTES='+str(len(atlas.encode())))
          PY
