name: Mistral audit — Atlas public Web App

on:
  workflow_dispatch:
  push:
    branches:
      - work/atlas-webapp-20260902
    paths:
      - "deploy/atlas-public/**"
      - ".github/workflows/mistral-atlas-production-audit.yml"
  pull_request:
    paths:
      - "deploy/atlas-public/**"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Deterministic package gate
        working-directory: deploy/atlas-public
        run: |
          set -euo pipefail
          sha256sum -c manifest.sha256
          node --check app.js
          node --check curadorias.js
          node -e "const c=require('./catalogo-curatorial.json'); if(c.entradas.length!==49) process.exit(1)"
          for motor in "Inventário do Meu Mundo" "Catástrofe Produtiva" "O Ponto de Kusama" "O Corpo que Percebe" "Escutar o Silêncio" "O Rizoma Interior" "O Cubo Interior"; do grep -Fq "$motor" app.js; done
          grep -Fq "Galeria Diletante" catalogo-curatorial.json
          grep -Fq "Crónicas Cãotadas por Fucô" catalogo-curatorial.json
          grep -Fq "COSMICOXES" catalogo-curatorial.json
          ! grep -RIE '(password|api[_-]?key|private[_-]?key|authorization:[[:space:]]*(bearer|token))' index.html styles.css app.js curadorias.js
          ! grep -E '(XMLHttpRequest|WebSocket|sendBeacon|localStorage|sessionStorage)' app.js curadorias.js
          grep -Fq 'id="allow-sound"' app.js
          grep -Fq 'id="listen" disabled' app.js

      - name: Mistral curatorial audit
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          python - <<'PY'
          import json, os, pathlib, urllib.request
          root = pathlib.Path('deploy/atlas-public')
          source = '\n\n'.join((root/n).read_text(encoding='utf-8') for n in ('index.html','app.js','curadorias.js','catalogo-curatorial.json'))
          prompt = '''Revê este frontend lúdico do Atlas Vivo MILK como agente curatorial e técnico. Responde exclusivamente JSON com public_boundary_ok (boolean), three_public_portals (boolean), catalogue_49 (boolean) e findings (array). Cada finding deve conter exact_snippet, mechanism e impact. Só regista um problema quando exact_snippet existir literalmente no código e mechanism demonstrar envio remoto indevido, vigilância sem consentimento, promessa clínica explícita, decisão curatorial automática ou exposição da camada invisível. O carregamento local de catalogo-curatorial.json é permitido. Interacção, animação, frequências sonoras, palavras artísticas e escolhas pré-definidas não são por si mesmas promessa clínica, vigilância ou decisão automática.''' + source
          req = urllib.request.Request(
              'https://api.mistral.ai/v1/chat/completions',
              data=json.dumps({
                  'model':'mistral-small-latest',
                  'temperature':0,
                  'response_format':{'type':'json_object'},
                  'messages':[{'role':'user','content':prompt}]
              }).encode(),
              headers={'Authorization':'Bearer '+os.environ['MISTRAL_API_KEY'],'Content-Type':'application/json'},
              method='POST'
          )
          with urllib.request.urlopen(req, timeout=60) as r:
              result = json.loads(json.loads(r.read())['choices'][0]['message']['content'])
          print(json.dumps(result, ensure_ascii=False))
          assert result.get('public_boundary_ok') is True, result
          assert result.get('catalogue_49') is True, result
          assert isinstance(result.get('findings'), list), result
          PY
