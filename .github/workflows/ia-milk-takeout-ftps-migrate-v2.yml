name: IA MILK Phase1 FTPS Migration v3 — Mistral Orchestrated

on:
  push:
    branches: [codex/safety-gate-2026-08-10]
    paths: ['.github/workflows/ia-milk-takeout-ftps-migrate-v2.yml']

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      MISTRAL_API_KEY_RAW: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mistral sovereign multi-agent gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          raw=os.environ.get('MISTRAL_API_KEY_RAW','').strip()
          if raw.startswith('MISTRAL_API_KEY='): raw=raw.split('=',1)[1].strip()
          if len(raw)>=2 and raw[0]==raw[-1] and raw[0] in "'\"": raw=raw[1:-1].strip()
          if not raw: raise SystemExit('MISTRAL_API_KEY missing')
          API='https://api.mistral.ai/v1'; H={'Authorization':f'Bearer {raw}','Content-Type':'application/json','Accept':'application/json'}
          def req(method,path,payload=None):
              data=None if payload is None else json.dumps(payload,ensure_ascii=False).encode()
              r=urllib.request.Request(API+path,data=data,headers=H,method=method)
              try:
                  with urllib.request.urlopen(r,timeout=60) as x:
                      b=x.read().decode(); return json.loads(b) if b else None
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f'{method} {path} HTTP {e.code}: '+e.read().decode('utf-8','replace')[:1200])
          agents=req('GET','/agents')
          if isinstance(agents,dict): agents=agents.get('data') or agents.get('items') or []
          by={a.get('name'):a for a in agents if isinstance(a,dict)}
          specialists=[
            ('MILK — Migração Preservativa','Confirma os gates operacionais para copiar um lote de 12 objetos prioritários do Google Drive, somente leitura, para PTServidor privado por FTPS, com SHA-256 local/remoto, sem apagar origem, sem pedir ou receber segredos, e sem declarar a migração integral concluída.'),
            ('MILK — Testes e Validação','Define a validação mínima obrigatória deste lote: contagem, bytes, SHA-256 após leitura remota, falha fechada e recibo sanitizado. Não uses nem solicites segredos.'),
            ('MILK — Conformidade RGPD e Soberania','Valida que a execução preservativa deste lote mantém origem intacta, destino privado, minimização de exposição, nenhum segredo em prompts/logs e nenhuma publicação. Não uses nem solicites segredos.'),
            ('MILK — Documentação e Memória','Define os campos factuais do recibo do lote: IDs de origem, nomes, bytes, hashes local/remoto, verificado/falhou, sem qualquer segredo e sem transformar lote parcial em conclusão integral.')]
          missing=[n for n,_ in specialists if n not in by]
          if missing: raise SystemExit('Missing canonical Mistral agents: '+','.join(missing))
          results=[]
          for name,prompt in specialists:
              resp=req('POST','/conversations',{'agent_id':by[name]['id'],'inputs':prompt,'store':False})
              outputs=resp.get('outputs',[]) if isinstance(resp,dict) else []
              text=[]
              for o in outputs:
                  c=o.get('content') if isinstance(o,dict) else None
                  if isinstance(c,str): text.append(c)
                  elif isinstance(c,list):
                      for p in c:
                          if isinstance(p,dict) and isinstance(p.get('text'),str): text.append(p['text'])
              excerpt='\n'.join(text)[:700]
              if not excerpt: raise SystemExit('Empty Mistral specialist response: '+name)
              results.append({'agent':name,'ok':True,'answer_excerpt':excerpt})
          receipt={'state':'MISTRAL_MULTI_AGENT_MIGRATION_GATE_PASSED','agents_expected':len(specialists),'agents_verified':len(results),'source_read_only':True,'sha256_required':True,'secrets_sent_to_mistral':False,'conversation_stored':False,'results':results}
          open('mistral-migration-orchestration.json','w').write(json.dumps(receipt,ensure_ascii=False,indent=2))
          print(json.dumps({'state':receipt['state'],'agents_verified':len(results),'secrets_sent_to_mistral':False},ensure_ascii=False))
          PY

      - name: Preserve Mistral orchestration receipt
        uses: actions/upload-artifact@v4
        with:
          name: mistral-migration-orchestration
          path: mistral-migration-orchestration.json
          retention-days: 30
          if-no-files-found: error

      - name: Install migration dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input pynacl requests selenium
          command -v google-chrome || command -v chromium || command -v chromium-browser

      - name: Generate ephemeral receiving key
        run: |
          python - <<'PY'
          from nacl.public import PrivateKey
          import base64, hashlib, json, pathlib
          key=PrivateKey.generate(); pathlib.Path('/tmp/ia_milk_takeout_v2.key').write_bytes(bytes(key)); pathlib.Path('/tmp/ia_milk_takeout_v2.key').chmod(0o600)
          pub=bytes(key.public_key); data={'public_key_b64':base64.urlsafe_b64encode(pub).decode(),'fingerprint':hashlib.sha256(pub).hexdigest()}
          pathlib.Path('ia-milk-takeout-public-key.json').write_text(json.dumps(data)); print('IA_MILK_TAKEOUT_V3_KEY_READY fingerprint='+data['fingerprint'])
          PY

      - name: Publish public key only
        uses: actions/upload-artifact@v4
        with:
          name: ia-milk-takeout-v3-public-key
          path: ia-milk-takeout-public-key.json
          retention-days: 1

      - name: Wait for sealed migration payload
        shell: bash
        env:
          BRANCH: codex/safety-gate-2026-08-10
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            git fetch -q origin "$BRANCH" || true
            if git show "origin/$BRANCH:ia_milk/ftps_migration_payload_v2.sealed.b64" >/tmp/ftps_migration_payload_v2.sealed.b64 2>/dev/null; then echo 'SEALED_MIGRATION_PAYLOAD_RECEIVED'; break; fi
            sleep 5
          done
          test -s /tmp/ftps_migration_payload_v2.sealed.b64 || { echo '::error::sealed migration payload not received'; exit 2; }

      - name: Execute migration
        run: python ia_milk/sovereign/takeout_ftps_migrate.py

      - name: Preserve sanitised migration receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia-milk-phase1-ftps-migration-receipt
          path: ia-milk-takeout-ftps-receipt.json
          retention-days: 30
          if-no-files-found: warn
