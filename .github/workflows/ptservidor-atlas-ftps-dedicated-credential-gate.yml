name: MILK PTServidor dedicated Atlas FTPS credential gate

on:
  workflow_dispatch:
  push:
    branches:
      - work/copernico-recovery-webapp-20260902
    paths:
      - '.github/workflows/ptservidor-atlas-ftps-dedicated-credential-gate.yml'

permissions:
  contents: read

jobs:
  atlas-ftps-readonly-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PTSERVIDOR_ATLAS_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_ATLAS_FTPS_PASSWORD }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Dedicated Atlas secret presence — value never printed
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PTSERVIDOR_ATLAS_FTPS_PASSWORD"
          echo 'PTSERVIDOR_ATLAS_FTPS_PASSWORD=PRESENT'
          echo 'SECRET_VALUE_DISCLOSED=0'

      - name: Read-only FTPS authentication probe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ftplib, os, ssl
          password=os.environ['PTSERVIDOR_ATLAS_FTPS_PASSWORD'].strip()
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=60)
          ftp.connect('troi.ptservidor.net', 21)
          ftp.login('atlas@associacaomilk.pt', password)
          ftp.prot_p()
          ftp.pwd()
          entries=ftp.nlst()
          ftp.quit()
          print('ATLAS_FTPS_AUTH=PASS')
          print('ATLAS_FTPS_READONLY_PROBE=PASS')
          print('ATLAS_FTPS_VISIBLE_ENTRIES_COUNT='+str(len(entries)))
          print('PRODUCTION_WRITES=0')
          PY

      - name: Mistral separation review — no credential values sent
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          python - <<'PY'
          import json, os, urllib.request
          policy={
            'migration_account':'migration@associacaomilk.pt',
            'migration_secret_id':'PTSERVIDOR_FTPS_PASSWORD',
            'atlas_account':'atlas@associacaomilk.pt',
            'atlas_secret_id':'PTSERVIDOR_ATLAS_FTPS_PASSWORD',
            'rules':['never reuse one secret id for both accounts','never print secret values','Atlas credential only after release gates']
          }
          payload={'model':'mistral-medium-latest','temperature':0,'response_format':{'type':'json_object'},'messages':[{'role':'system','content':'És auditor de segurança operacional do Atlas Vivo MILK. Valida apenas separação de credenciais. Nunca peças nem infiras valores secretos. Responde JSON com pass:boolean e blockers:array.'},{'role':'user','content':json.dumps(policy)}]}
          req=urllib.request.Request('https://api.mistral.ai/v1/chat/completions',data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['MISTRAL_API_KEY'],'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=120) as r:
              body=json.loads(r.read())
          review=json.loads(body['choices'][0]['message']['content'])
          print('MISTRAL_CREDENTIAL_SEPARATION_REVIEW='+json.dumps(review,ensure_ascii=False))
          if review.get('pass') is not True or review.get('blockers'):
              raise SystemExit('MISTRAL_CREDENTIAL_SEPARATION=BLOCKED')
          print('MISTRAL_CREDENTIAL_SEPARATION=PASS')
          print('SECRET_VALUES_SENT_TO_MISTRAL=0')
          PY
