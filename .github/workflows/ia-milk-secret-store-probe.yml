name: IA MILK Secret Store Probe

on:
  push:
    branches: [codex/safety-gate-2026-08-10]
    paths: ['.github/workflows/ia-milk-secret-store-probe.yml']
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe repository Actions Secret write with disposable random value
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input pynacl requests >/dev/null
          python - <<'PY'
          import base64,json,os,secrets,requests
          from nacl.public import PublicKey,SealedBox
          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']
          h={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10'}
          pk=requests.get(f'https://api.github.com/repos/{repo}/actions/secrets/public-key',headers=h,timeout=20)
          if pk.status_code!=200:
              print(json.dumps({'state':'SECRET_STORE_PROBE_BLOCKED','phase':'public_key','http':pk.status_code})); raise SystemExit(2)
          j=pk.json(); raw=base64.b64decode(j['key']); value=secrets.token_urlsafe(48).encode()
          enc=base64.b64encode(SealedBox(PublicKey(raw)).encrypt(value)).decode()
          name='IA_MILK_SECRET_STORE_PROBE'
          r=requests.put(f'https://api.github.com/repos/{repo}/actions/secrets/{name}',headers={**h,'Content-Type':'application/json'},json={'encrypted_value':enc,'key_id':j['key_id']},timeout=20)
          state='SECRET_STORE_WRITE_OK' if r.status_code in (201,204) else 'SECRET_STORE_WRITE_BLOCKED'
          print(json.dumps({'state':state,'http':r.status_code,'secret_value_exposed':False}))
          if r.status_code not in (201,204): raise SystemExit(3)
          # Clean disposable probe. A successful delete confirms write authority too.
          d=requests.delete(f'https://api.github.com/repos/{repo}/actions/secrets/{name}',headers=h,timeout=20)
          print(json.dumps({'state':'SECRET_STORE_PROBE_CLEANED' if d.status_code==204 else 'SECRET_STORE_PROBE_CLEANUP_BLOCKED','http':d.status_code}))
          if d.status_code!=204: raise SystemExit(4)
          PY
