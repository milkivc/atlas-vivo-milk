name: IA MILK PTServidor Secret-Blind Canary

on:
  push:
    branches: [codex/safety-gate-2026-08-10]
    paths:
      - 'ia_milk/sovereign/sealed/ptservidor-ftps-bootstrap.b64'
      - '.github/workflows/ia-milk-ptservidor-secret-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      PT_HOST: associacaomilk.pt
      PT_USER: migration@associacaomilk.pt
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install broker dependency
        run: python -m pip install --disable-pip-version-check --no-input 'PyNaCl==1.5.0'

      - name: Unseal one-time bootstrap URL into owner-only runtime file
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, pathlib
          src=pathlib.Path('ia_milk/sovereign/sealed/ptservidor-ftps-bootstrap.b64').read_text().strip()
          pathlib.Path('/tmp/pt-bootstrap.sealed').write_bytes(base64.urlsafe_b64decode(src))
          PY
          python ia_milk/sovereign/secret_broker.py unseal --input /tmp/pt-bootstrap.sealed --output /tmp/paste.url
          test "$(stat -c '%a' /tmp/paste.url)" = 600
          echo 'BOOTSTRAP_URL_UNSEALED_IN_MEMORY_BOUNDARY_OK'

      - name: Install pinned PrivateBin client and validate checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/privatebin-cli
          curl --proto '=https' --tlsv1.2 -fsSL \
            'https://github.com/gearnode/privatebin/releases/download/v2.2.1/privatebin_Linux_x86_64.tar.gz' \
            -o /tmp/privatebin-cli/privatebin.tar.gz
          echo 'ad83bd5319317aee7c0682e1839da13d0ab7a2494323914103a842899c0ef1ad  /tmp/privatebin-cli/privatebin.tar.gz' | sha256sum -c -
          tar -xzf /tmp/privatebin-cli/privatebin.tar.gz -C /tmp/privatebin-cli
          PB="$(find /tmp/privatebin-cli -type f -name privatebin -perm -u+x | head -n1)"
          test -n "$PB"
          "$PB" --version >/dev/null
          printf '%s' "$PB" > /tmp/privatebin.binary
          chmod 600 /tmp/privatebin.binary
          echo 'PRIVATEBIN_CLIENT_PINNED_AND_VERIFIED'

      - name: Protocol test on PTServidor PrivateBin before consuming real bootstrap
        shell: bash
        run: |
          set -euo pipefail
          PB="$(cat /tmp/privatebin.binary)"
          cat >/tmp/privatebin-config.json <<'JSON'
          {"bin":[{"name":"","host":"https://pastebin.ptservidor.net"}],"formatter":"plaintext","gzip":true}
          JSON
          chmod 600 /tmp/privatebin-config.json
          EXPECT='ATLAS_MILK_PRIVATEBIN_PROTOCOL_TEST_20260817'
          TEST_URL="$(printf '%s' "$EXPECT" | "$PB" --config /tmp/privatebin-config.json create --burn-after-reading)"
          test -n "$TEST_URL"
          echo "::add-mask::$TEST_URL"
          GOT="$("$PB" --config /tmp/privatebin-config.json show "$TEST_URL")"
          test "$GOT" = "$EXPECT"
          echo 'PTSERVIDOR_PRIVATEBIN_PROTOCOL_TEST_OK'

      - name: Consume one-time bootstrap without exposing password
        shell: bash
        run: |
          set -euo pipefail
          PB="$(cat /tmp/privatebin.binary)"
          PASTE_URL="$(cat /tmp/paste.url)"
          PASSWORD="$("$PB" --config /tmp/privatebin-config.json show "$PASTE_URL")"
          test -n "$PASSWORD"
          case "$PASSWORD" in *$'\n'*|*$'\r'*) echo 'PASSWORD_FORMAT_REJECTED'; exit 21;; esac
          echo "::add-mask::$PASSWORD"
          umask 077
          printf '%s' "$PASSWORD" > /tmp/pt-password
          chmod 600 /tmp/pt-password
          echo 'PTSERVIDOR_PASSWORD_ACQUIRED_SECRET_BLIND'

      - name: Re-seal password for recovery without plaintext persistence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          PUB="$(python ia_milk/sovereign/secret_broker.py public | python -c 'import json,sys; print(json.load(sys.stdin)["public_key_b64"])')"
          python ia_milk/sovereign/secret_broker.py seal --public-key "$PUB" --input /tmp/pt-password --output /tmp/pt-password.sealed
          python - <<'PY'
          import base64,pathlib,hashlib,json
          raw=pathlib.Path('/tmp/pt-password.sealed').read_bytes()
          pathlib.Path('artifacts/ptservidor-password.sealed.b64').write_text(base64.urlsafe_b64encode(raw).decode()+'\n')
          pathlib.Path('artifacts/ptservidor-password-seal-receipt.json').write_text(json.dumps({
              'state':'PASSWORD_SEALED_FOR_RUNTIME_RECOVERY',
              'scheme':'sealedbox-x25519-v1',
              'ciphertext_sha256':hashlib.sha256(raw).hexdigest(),
              'plaintext_persisted':False,
              'agent_secret_access':False
          },indent=2)+'\n')
          PY
          echo 'PTSERVIDOR_PASSWORD_RESEALED_OK'

      - name: FTPS explicit TLS upload download-back SHA-256 canary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime,ftplib,hashlib,io,json,os,pathlib,ssl
          host=os.environ['PT_HOST']; user=os.environ['PT_USER']
          password=pathlib.Path('/tmp/pt-password').read_text()
          payload={
            'kind':'ATLAS_VIVO_MILK_PRESERVATION_CANARY',
            'branch':'codex/safety-gate-2026-08-10',
            'source_drive_writes':0,
            'production_web_writes':0,
            'secret_access_by_mistral':False,
          }
          data=(json.dumps(payload,sort_keys=True,separators=(',',':'))+'\n').encode()
          local_hash=hashlib.sha256(data).hexdigest()
          ctx=ssl.create_default_context()
          ftp=ftplib.FTP_TLS(context=ctx,timeout=40)
          ftp.connect(host,21); ftp.auth(); ftp.prot_p(); ftp.login(user,password)
          try:
              ftp.mkd('canary')
          except ftplib.error_perm as exc:
              if not str(exc).startswith('550'): raise
          remote='canary/atlas-drive-canary-secret-blind.json'
          ftp.storbinary('STOR '+remote,io.BytesIO(data))
          size=ftp.size(remote)
          out=io.BytesIO(); ftp.retrbinary('RETR '+remote,out.write)
          ftp.quit()
          remote_data=out.getvalue(); remote_hash=hashlib.sha256(remote_data).hexdigest()
          verified=(size==len(data) and remote_data==data and remote_hash==local_hash)
          receipt={
            'state':'CANARY_VERIFIED' if verified else 'CANARY_FAILED',
            'connector':'connector://ptservidor-ftps',
            'transport':'FTPS_EXPLICIT_TLS',
            'tls_verified':True,
            'host':host,
            'remote_path':remote,
            'bytes':len(data),
            'remote_size':size,
            'local_sha256':local_hash,
            'remote_sha256':remote_hash,
            'verified':verified,
            'source_drive_writes':0,
            'production_web_writes':0,
            'agent_secret_access':False,
            'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          pathlib.Path('artifacts').mkdir(exist_ok=True)
          pathlib.Path('artifacts/ptservidor-ftps-secret-blind-canary-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          if not verified: raise SystemExit(31)
          PY

      - name: Destroy plaintext runtime material
        if: always()
        shell: bash
        run: |
          set +e
          shred -u /tmp/pt-password /tmp/paste.url /tmp/privatebin-config.json /tmp/pt-bootstrap.sealed 2>/dev/null || true
          echo 'PLAINTEXT_RUNTIME_MATERIAL_DESTROYED'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ia-milk-ptservidor-secret-blind-receipts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
