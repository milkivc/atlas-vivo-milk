name: MILK integral Drive resume — Mistral FTPS

on:
  push:
    branches: [ops/ftps-fallback-probe-20260822]
    paths: ['.github/workflows/milk-drive-integral-resume-secret.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: milk-drive-integral-mistral-ftps
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      PTSERVIDOR_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_FTPS_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ftps-fallback-probe-20260822

      - name: Validate opaque execution secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          test -n "$PTSERVIDOR_FTPS_PASSWORD"
          echo 'MILK_DRIVE_RESUME_SECRETS_PRESENT mistral=yes ftps=yes values_disclosed=0'

      - name: Resume preservative migration from per-file receipts
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          passfile="$RUNNER_TEMP/milk-ftps-pass"
          trap 'rm -f "$passfile"' EXIT
          printf '%s' "$PTSERVIDOR_FTPS_PASSWORD" > "$passfile"
          chmod 600 "$passfile"
          export MILK_FTPS_PASSWORD_FILE="$passfile"
          python ops/milk_drive_mistral_to_ftps.py
