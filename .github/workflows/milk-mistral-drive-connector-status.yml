name: MILK Mistral Drive connector status

on:
  push:
    branches: [ops/ftps-fallback-probe-20260822]
    paths:
      - '.github/workflows/milk-mistral-drive-connector-status.yml'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Probe connector safely
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          key=os.environ['MISTRAL_API_KEY']
          base='https://api.mistral.ai/v1/connectors/google_drive_mcp'
          headers={'Authorization':'Bearer '+key,'Accept':'application/json'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try: body=json.loads(e.read().decode())
                  except Exception: body={}
                  return e.code,body
          status,obj=get(base+'?fetch_user_data=true&fetch_customer_data=false')
          tools_status,tools=get(base+'/tools')
          creds=obj.get('connection_credentials') if isinstance(obj,dict) else None
          config=obj.get('connection_config') if isinstance(obj,dict) else None
          active=obj.get('active') if isinstance(obj,dict) else None
          cred_count=len(creds) if isinstance(creds,list) else (1 if creds else 0)
          tool_count=len(tools) if isinstance(tools,list) else 0
          msg=(f"MILK_MISTRAL_DRIVE_CONNECTOR_STATUS run={os.environ['RUN_ID']} http={status} "
               f"active={str(active).lower()} credential_count={cred_count} config_present={str(bool(config)).lower()} "
               f"tools_http={tools_status} tool_count={tool_count} secret_values_logged=0")
          print(msg,flush=True)
          body=json.dumps({'body':msg}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/issues/35/comments",data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as r:r.read()
          PY
