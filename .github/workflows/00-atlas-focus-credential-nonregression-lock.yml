name: 00 MILK Atlas focus + credential + non-regression lock

on:
  push:
    branches:
      - work/copernico-recovery-webapp-20260902
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-global-governance-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NEXTCLOUD_ATLAS: ${{ secrets.NEXTCLOUD_ATLAS }}
      NEXTCLOUD_KEY: ${{ secrets.NEXTCLOUD_KEY }}
      PTSERVIDOR_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_FTPS_PASSWORD }}
      PTSERVIDOR_ATLAS_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_ATLAS_FTPS_PASSWORD }}
      PTSERVIDOR_FTP_WEBDAV: ${{ secrets.PTSERVIDOR_FTP_WEBDAV }}
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      PTSERVIDOR_CPANEL_TOKEN: ${{ secrets.PTSERVIDOR_CPANEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Critical credential presence lock — FIRST GATE, values never printed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,sys
          critical=['MISTRAL_API_KEY','NEXTCLOUD_ATLAS','NEXTCLOUD_KEY','PTSERVIDOR_FTPS_PASSWORD','PTSERVIDOR_ATLAS_FTPS_PASSWORD','PTSERVIDOR_FTP_WEBDAV']
          missing=[]
          for name in critical:
              ok=bool(os.environ.get(name,'').strip())
              print(f'CREDENTIAL_PRESENCE {name}=' + ('PRESENT' if ok else 'MISSING'))
              if not ok: missing.append(name)
          if missing:
              print('CREDENTIAL_LOSS_LOCK=BLOCKED missing='+','.join(missing))
              sys.exit(42)
          if os.environ['PTSERVIDOR_FTPS_PASSWORD'] == os.environ['PTSERVIDOR_ATLAS_FTPS_PASSWORD']:
              print('ATLAS_MIGRATION_SECRET_ISOLATION=BLOCKED')
              sys.exit(44)
          print('ATLAS_MIGRATION_SECRET_ISOLATION=PASS')
          cpanel=any(os.environ.get(x,'').strip() for x in ('CPANEL_API_TOKEN','CPANEL_TOKEN','PTSERVIDOR_CPANEL_TOKEN'))
          print('CPANEL_SITEJET_TOKEN=' + ('PRESENT' if cpanel else 'NOT_YET_AVAILABLE'))
          print('SECRET_VALUES_DISCLOSED=0')
          print('CREDENTIAL_LOSS_LOCK=PASS')
          PY

      - name: Executable anti-regression guard
        run: python scripts/atlas_factory_guard.py

      - name: Focus lock
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Nextcloud = fonte operacional' AGENTS.md
          grep -Fq 'PTServidor = destino operacional' AGENTS.md
          grep -Fq 'Mistral Agents + Mistral Studio + Mistral Code/Vibe Code' AGENTS.md
          grep -Fq 'O globo COPÉRNICO já existe' AGENTS.md
          grep -Fq 'Gate final: 49/49' AGENTS.md
          echo 'ATLAS_FOCUS_LOCK=PASS'
          echo 'PIPELINE=NEXTCLOUD_TO_MISTRAL_TO_VIBE_TO_PTSERVIDOR'

      - name: Credential mutation prohibition
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(gh secret (delete|remove)|actions/secrets.*DELETE|delete.*secret|rotate.*secret)' .github scripts ops --exclude='00-atlas-focus-credential-nonregression-lock.yml'; then
            echo 'AUTOMATED_SECRET_MUTATION=BLOCKED'
            exit 43
          fi
          echo 'AUTOMATED_SECRET_MUTATION=ABSENT'

      - name: Governance receipt
        run: |
          echo 'ATLAS_GLOBAL_LOCK=PASS'
          echo 'NON_REGRESSION=ENFORCED'
          echo 'CREDENTIAL_RECOVERABILITY=INDEXED'
          echo 'FORDIST_FACTORY_FOCUS=ENFORCED'
