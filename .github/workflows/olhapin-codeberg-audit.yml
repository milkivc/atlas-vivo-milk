name: MILK OlHAPIN — auditoria determinística Codeberg

on:
  push:
    branches:
      - 'ops/olhapin-codeberg-audit-20260822'
    paths:
      - '.github/workflows/olhapin-codeberg-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover Atlas repositories on Codeberg
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CODEBERG_TOKEN"
          mkdir -p "$RUNNER_TEMP/olhapin-audit/repos" "$RUNNER_TEMP/olhapin-audit/evidence"
          auth_status=$(curl --silent --show-error -o "$RUNNER_TEMP/codeberg-user.json" -w '%{http_code}' \
            -H "Authorization: token $CODEBERG_TOKEN" https://codeberg.org/api/v1/user || true)
          test "$auth_status" = 200
          auth_user=$(jq -r '.login // "unknown"' "$RUNNER_TEMP/codeberg-user.json")
          curl --fail --silent --show-error -H "Authorization: token $CODEBERG_TOKEN" \
            'https://codeberg.org/api/v1/user/repos?limit=100' > "$RUNNER_TEMP/codeberg-user-repos.json"
          curl --fail --silent --show-error \
            'https://codeberg.org/api/v1/users/associacaomilk/repos?limit=100' > "$RUNNER_TEMP/codeberg-associacaomilk-repos.json" || printf '[]' > "$RUNNER_TEMP/codeberg-associacaomilk-repos.json"
          curl --fail --silent --show-error \
            'https://codeberg.org/api/v1/orgs/milkivc/repos?limit=100' > "$RUNNER_TEMP/codeberg-milkivc-repos.json" || printf '[]' > "$RUNNER_TEMP/codeberg-milkivc-repos.json"
          jq -s '[.[][] | select((.name // "" | ascii_downcase | contains("atlas")) or (.full_name // "" | ascii_downcase | contains("atlas"))) | {full_name,clone_url,html_url,default_branch,private}] | unique_by(.full_name)' \
            "$RUNNER_TEMP/codeberg-user-repos.json" "$RUNNER_TEMP/codeberg-associacaomilk-repos.json" "$RUNNER_TEMP/codeberg-milkivc-repos.json" \
            > "$RUNNER_TEMP/olhapin-audit/repos.json"
          count=$(jq 'length' "$RUNNER_TEMP/olhapin-audit/repos.json")
          echo "auth_user=$auth_user" >> "$GITHUB_OUTPUT"
          echo "repo_count=$count" >> "$GITHUB_OUTPUT"
          test "$count" -gt 0

      - name: Clone read-only and scan content
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          credential_file="$RUNNER_TEMP/codeberg-credentials"
          trap 'rm -f "$credential_file"' EXIT
          printf 'protocol=https\nhost=codeberg.org\nusername=%s\npassword=%s\n\n' "${{ steps.discover.outputs.auth_user }}" "$CODEBERG_TOKEN" | \
            git -c credential.helper="store --file=$credential_file" credential approve
          chmod 600 "$credential_file"

          python - <<'PY'
          import json, os, pathlib, re, subprocess, hashlib, shutil

          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'olhapin-audit'
          repos_dir = root / 'repos'
          evidence_dir = root / 'evidence'
          repos = json.loads((root / 'repos.json').read_text(encoding='utf-8'))
          cred = pathlib.Path(os.environ['RUNNER_TEMP']) / 'codeberg-credentials'

          terms = {
              'olhapin': re.compile(r'ol\s*ha?pin|olho\s+do\s+atlas', re.I),
              'nulometria': re.compile(r'nulometria', re.I),
              'batimetria': re.compile(r'batimetria', re.I),
              'bimetria': re.compile(r'\bbimetria\b', re.I),
              'assimetria': re.compile(r'assimetria', re.I),
              'minometria': re.compile(r'minometria', re.I),
              'duametria': re.compile(r'duametria', re.I),
              'auditarRealidade': re.compile(r'auditarRealidade'),
              'iniciarEscavacao': re.compile(r'iniciarEscava[cç][aã]o', re.I),
              'SteganographyEngine': re.compile(r'SteganographyEngine'),
              'ShmitaYovel': re.compile(r'Shmita|Yovel', re.I),
              'forno_comunitario': re.compile(r'forno\s+comunit[aá]rio', re.I),
              'assinatura_invisivel': re.compile(r'assinatura\s+invis[ií]vel', re.I),
              'swhid': re.compile(r'\bSWHID\b|swh:1:', re.I),
              'mistral': re.compile(r'\bMistral\b', re.I),
          }
          text_ext = {'.ts','.tsx','.js','.mjs','.cjs','.py','.md','.txt','.json','.yaml','.yml','.html','.css','.sh','.toml','.xml','.csv'}
          matches=[]
          all_findings=[]
          repos_scanned=[]
          codeberg_secret_patterns=[
              re.compile(r'(?i)(?:token|password|secret|api[_-]?key)\s*[:=]\s*["\']?[A-Za-z0-9_\-]{16,}'),
              re.compile(r'(?i)authorization:\s*(?:bearer|token)\s+[A-Za-z0-9._\-]{16,}'),
          ]

          for repo in repos:
              full = repo.get('full_name') or ''
              if not full: continue
              dest = repos_dir / full.replace('/','__')
              url = repo.get('clone_url') or f'https://codeberg.org/{full}.git'
              cmd=['git','-c',f'credential.helper=store --file={cred}','clone','--depth','1','--no-tags',url,str(dest)]
              p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
              if p.returncode:
                  all_findings.append({'repo':full,'type':'clone_error','detail':p.stderr[-500:]})
                  continue
              head=subprocess.check_output(['git','-C',str(dest),'rev-parse','HEAD'],text=True).strip()
              repos_scanned.append({'repo':full,'head':head,'default_branch':repo.get('default_branch')})
              for path in dest.rglob('*'):
                  if not path.is_file() or '.git' in path.parts: continue
                  rel=path.relative_to(dest).as_posix()
                  if path.stat().st_size > 2_000_000 or path.suffix.lower() not in text_ext: continue
                  try:
                      raw=path.read_bytes()
                      text=raw.decode('utf-8')
                  except Exception:
                      continue
                  hit_terms=[k for k,rx in terms.items() if rx.search(text)]
                  zero_width=any(ch in text for ch in ('\u200b','\u200c','\u200d','\ufeff'))
                  secret_like=any(rx.search(text) for rx in codeberg_secret_patterns)
                  if hit_terms or zero_width or secret_like:
                      sha=hashlib.sha256(raw).hexdigest()
                      rec={'repo':full,'path':rel,'sha256':sha,'bytes':len(raw),'terms':hit_terms,'zero_width':zero_width,'secret_like':secret_like}
                      all_findings.append(rec)
                      if any(t in hit_terms for t in ('olhapin','nulometria','batimetria','bimetria','assimetria','minometria','duametria','auditarRealidade','iniciarEscavacao','SteganographyEngine','ShmitaYovel','forno_comunitario')):
                          matches.append(rec)
                          safe_name=(full+'__'+rel).replace('/','__')
                          shutil.copy2(path,evidence_dir/safe_name)

          (root/'repos-scanned.json').write_text(json.dumps(repos_scanned,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'findings.json').write_text(json.dumps(all_findings,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'olhapin-matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          print(f'repos_scanned={len(repos_scanned)}')
          print(f'findings={len(all_findings)}')
          print(f'olhapin_matches={len(matches)}')
          PY

          echo "match_count=$(jq 'length' "$RUNNER_TEMP/olhapin-audit/olhapin-matches.json")" >> "$GITHUB_OUTPUT"
          echo "finding_count=$(jq 'length' "$RUNNER_TEMP/olhapin-audit/findings.json")" >> "$GITHUB_OUTPUT"

      - name: Static TypeScript validation of matched sources
        id: typescript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/olhapin-audit/ts-results"
          npm --silent --prefix "$RUNNER_TEMP/olhapin-ts" init -y >/dev/null 2>&1
          npm --silent --prefix "$RUNNER_TEMP/olhapin-ts" install --no-audit --no-fund typescript@5.8.3 @types/node@22 >/dev/null 2>&1
          python - <<'PY'
          import json, os, pathlib, subprocess, hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'olhapin-audit'
          results=[]
          for f in (root/'evidence').iterdir():
              if f.suffix.lower() not in {'.ts','.tsx'}: continue
              out=root/'ts-results'/f.stem
              out.mkdir(parents=True,exist_ok=True)
              cmd=[str(pathlib.Path(os.environ['RUNNER_TEMP'])/'olhapin-ts/node_modules/.bin/tsc'),
                   '--pretty','false','--noEmit','--strict','false','--skipLibCheck','true',
                   '--target','ES2022','--module','commonjs','--moduleResolution','node',
                   '--types','node',str(f)]
              p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              results.append({'file':f.name,'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'tsc_exit':p.returncode,'diagnostics':p.stdout[-4000:]})
          (root/'typescript-validation.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          echo "ts_count=$(jq 'length' "$RUNNER_TEMP/olhapin-audit/typescript-validation.json")" >> "$GITHUB_OUTPUT"
          echo "ts_fail=$(jq '[.[]|select(.tsc_exit != 0)]|length' "$RUNNER_TEMP/olhapin-audit/typescript-validation.json")" >> "$GITHUB_OUTPUT"

      - name: Build sanitized factual summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'olhapin-audit'
          repos=json.loads((root/'repos-scanned.json').read_text())
          matches=json.loads((root/'olhapin-matches.json').read_text())
          ts=json.loads((root/'typescript-validation.json').read_text())
          lines=['# OlHAPIN Codeberg audit','',f'Repositories scanned: {len(repos)}',f'OlHAPIN/metrology source matches: {len(matches)}',f'TypeScript files checked: {len(ts)}','']
          for r in repos: lines.append(f"- repo `{r['repo']}` @ `{r['head']}`")
          lines += ['','## Matches']
          for m in matches:
              lines.append(f"- `{m['repo']}:{m['path']}` sha256=`{m['sha256']}` terms={','.join(m['terms']) or '-'} zero_width={str(m['zero_width']).lower()} secret_like={str(m['secret_like']).lower()}")
          lines += ['','## TypeScript validation']
          for t in ts: lines.append(f"- `{t['file']}` tsc_exit={t['tsc_exit']} sha256=`{t['sha256']}`")
          lines += ['','No repository contents were modified. No secret values are included in this report.']
          (root/'SUMMARY.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          cat "$RUNNER_TEMP/olhapin-audit/SUMMARY.md"

      - uses: actions/upload-artifact@v4
        with:
          name: olhapin-codeberg-evidence
          path: |
            ${{ runner.temp }}/olhapin-audit/SUMMARY.md
            ${{ runner.temp }}/olhapin-audit/repos.json
            ${{ runner.temp }}/olhapin-audit/repos-scanned.json
            ${{ runner.temp }}/olhapin-audit/olhapin-matches.json
            ${{ runner.temp }}/olhapin-audit/typescript-validation.json
            ${{ runner.temp }}/olhapin-audit/evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Publish sanitized receipt
        if: always()
        shell: bash
        env:
          REPOS: ${{ steps.discover.outputs.repo_count }}
          MATCHES: ${{ steps.scan.outputs.match_count }}
          FINDINGS: ${{ steps.scan.outputs.finding_count }}
          TS_COUNT: ${{ steps.typescript.outputs.ts_count }}
          TS_FAIL: ${{ steps.typescript.outputs.ts_fail }}
        run: |
          set -euo pipefail
          body="OLHAPIN_CODEBERG_AUDIT run=${GITHUB_RUN_ID} repos=${REPOS:-unknown} metrology_matches=${MATCHES:-unknown} hygiene_findings=${FINDINGS:-unknown} ts_checked=${TS_COUNT:-unknown} ts_failed=${TS_FAIL:-unknown} codeberg_writes=0 github_master_writes=0 secret_values_disclosed=0 artifact=olhapin-codeberg-evidence"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            "https://api.github.com/repos/$GH_REPOSITORY/issues/35/comments" \
            -d "$(jq -n --arg body "$body" '{body:$body}')" >/dev/null
