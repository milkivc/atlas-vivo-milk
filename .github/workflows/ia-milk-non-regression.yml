name: IA MILK non-regression

on:
  push:
    branches: [codex/safety-gate-2026-08-10]
    paths:
      - 'integrations/ia-milk/**'
      - '.github/workflows/ia-milk-non-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: pytest -q integrations/ia-milk/test_ia_milk.py
