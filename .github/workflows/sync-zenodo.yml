name: Validate Zenodo deposit package

on:
  workflow_dispatch:
    inputs:
      manifest_sha256:
        description: SHA-256 do manifesto público aprovado
        required: true
      approval_id:
        description: Identificador da aprovação humana
        required: true

permissions:
  contents: read

jobs:
  validate-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify reviewed package
        shell: bash
        run: |
          set -euo pipefail
          test -f PUBLICATION_MANIFEST.sha256
          grep -F -- "${{ inputs.manifest_sha256 }}" PUBLICATION_MANIFEST.sha256
          test -n "${{ inputs.approval_id }}"
      - name: Confirm no external publication
        run: echo "Pacote validado localmente; o workflow não contacta Zenodo nem publica DOI."
