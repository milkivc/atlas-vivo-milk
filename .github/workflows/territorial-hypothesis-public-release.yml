name: MILK Territorial Hypothesis — external release gate

on:
  workflow_dispatch:
    inputs:
      human_validation_receipt:
        description: 'Receipt de validação humana externa à automação; não colocar dados pessoais ou segredos.'
        required: true
        type: string
      release_reason:
        description: 'Motivo da preparação do release.'
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: milk-territorial-hypothesis-external-release-gate
  cancel-in-progress: false

jobs:
  gate-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce human gate before any external publication
        env:
          HUMAN_VALIDATION_RECEIPT: ${{ inputs.human_validation_receipt }}
          RELEASE_REASON: ${{ inputs.release_reason }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HUMAN_VALIDATION_RECEIPT"
          test -n "$RELEASE_REASON"
          echo 'EXTERNAL_RELEASE_GATE_ACCEPTED preparation_only=1 external_writes=0 secrets_disclosed=0'
          echo 'No Codeberg, Zenodo, ORCID, DataCite or Software Heritage write is performed by this workflow.'

      - name: Verify current territorial-reader tests only
        shell: bash
        run: |
          set -euo pipefail
          find src/territorial-reader -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          node --test src/territorial-reader/tests/*.test.js

      - name: Record non-publication receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          body="TERRITORIAL_EXTERNAL_RELEASE_GATE run=${RUN_ID} commit=${COMMIT_SHA} preparation_only=1 external_writes=0 human_gate_present=1 master_writes=0 secret_values_disclosed=0"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            "https://api.github.com/repos/$REPO/issues/35/comments" \
            -d "$(jq -n --arg body "$body" '{body:$body}')" >/dev/null
