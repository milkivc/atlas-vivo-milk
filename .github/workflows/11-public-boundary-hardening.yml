name: 11 MILK public boundary hardening

on:
  push:
    branches:
      - work/copernico-recovery-webapp-20260902
    paths:
      - '.github/workflows/11-public-boundary-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reusable public boundary hardener
        run: python scripts/harden_public_boundary.py

      - name: Verify hardened public boundary
        shell: bash
        run: |
          set -euo pipefail
          node tests/ia-milk-public-boundary.test.mjs
          node --check deploy/atlas-public/ia-milk-public-boundary.js
          node --check deploy/atlas-public/experience-machine.js
          python -m json.tool deploy/atlas-public/catalogo-curatorial.json >/dev/null
          python -m json.tool deploy/atlas-public/public-manifest.json >/dev/null
          python scripts/atlas_factory_guard.py
          echo 'PUBLIC_BOUNDARY_HARDENING=PASS'

      - name: Commit hardened public boundary
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'NO_CHANGES_NEEDED=1'
            exit 0
          fi
          git config user.name 'Associação MILK - Movimento de Intervenções e Linguagens Kulturais e Arte'
          git config user.email 'milk@associacaomilk.pt'
          git add deploy/atlas-public/ia-milk-public-boundary.js deploy/atlas-public/experience-machine.js deploy/atlas-public/catalogo-curatorial.json deploy/atlas-public/public-manifest.json tests/ia-milk-public-boundary.test.mjs
          git commit -m 'fix(public): harden public boundary by positive contract'
          git push origin HEAD:work/copernico-recovery-webapp-20260902
