name: MILK ephemeral FTPS Takeout resume

on:
  push:
    branches: [ops/ftps-fallback-probe-20260822]
    paths:
      - '.github/workflows/milk-ephemeral-ftps-takeout-resume.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: milk-ephemeral-ftps-takeout-resume
  cancel-in-progress: true

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ftps-fallback-probe-20260822

      - name: Create one-run RSA bridge
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/milk-ftps.key >/dev/null 2>&1
          openssl pkey -in /tmp/milk-ftps.key -pubout -out /tmp/milk-ftps.pub >/dev/null 2>&1

          python - <<'PY'
          import base64, json, os, urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']; run=os.environ['RUN_ID']
          pub=base64.b64encode(open('/tmp/milk-ftps.pub','rb').read()).decode()
          body=f"MILK_FTPS_EPHEMERAL_PUBLIC_KEY run={run} alg=RSA-OAEP-SHA256 data={pub}"
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/35/comments",
              data=json.dumps({'body':body}).encode(),method='POST',
              headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=60) as r:r.read()
          print(f"MILK_FTPS_EPHEMERAL_BRIDGE_READY run={run} secret_persisted=0")
          PY

      - name: Receive ciphertext, decrypt in memory, and resume verified Takeout
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f /tmp/milk-ftps.key /tmp/milk-ftps.pub /tmp/milk-ftps.cipher /tmp/milk-ftps.pass /tmp/milk-cipher.b64' EXIT

          test -s /tmp/milk-ftps.key

          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone
          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']; run=os.environ['RUN_ID']
          marker=f"MILK_FTPS_CIPHERTEXT run={run} data="
          since=(datetime.now(timezone.utc)-timedelta(hours=1)).isoformat().replace('+00:00','Z')
          query=urllib.parse.urlencode({'per_page':100,'since':since})
          deadline=time.time()+900
          while time.time()<deadline:
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/issues/35/comments?{query}",
                  headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=60) as r:comments=json.loads(r.read())
              for item in reversed(comments):
                  body=item.get('body','')
                  if body.startswith(marker):
                      data=body[len(marker):].strip()
                      if data:
                          open('/tmp/milk-cipher.b64','w',encoding='utf-8').write(data)
                          print(f"MILK_FTPS_CIPHERTEXT_RECEIVED run={run}")
                          raise SystemExit(0)
              time.sleep(5)
          print(f"MILK_FTPS_EPHEMERAL_BLOCKED run={run} cause=CIPHERTEXT_TIMEOUT")
          raise SystemExit(2)
          PY

          base64 -d /tmp/milk-cipher.b64 > /tmp/milk-ftps.cipher
          openssl pkeyutl -decrypt -inkey /tmp/milk-ftps.key -in /tmp/milk-ftps.cipher \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -out /tmp/milk-ftps.pass

          FTPS_PASS="$(cat /tmp/milk-ftps.pass)"
          echo "::add-mask::$FTPS_PASS"
          test -n "$FTPS_PASS"

          export MILK_FTPS_PASSWORD_FILE=/tmp/milk-ftps.pass
          python ops/milk_takeout_resume.py
