name: 19 MILK 49 digital multisensory curatorial blueprints

on:
  workflow_dispatch:
  push:
    branches: [work/copernico-recovery-webapp-20260902]
    paths:
      - 'curatorial-factory/DIGITAL_MULTISENSORY_EXPERIENCE_CONSTITUTION_20260902.md'
      - 'curatorial-factory/SOURCE_CORPUS_20260902.md'
      - 'specs/digital-multisensory-curatorial-blueprint.schema.json'
      - 'scripts/generate_49_multisensory_blueprints.py'
      - '.github/workflows/19-mistral-49-digital-multisensory-blueprints.yml'

permissions:
  contents: write

concurrency:
  group: milk-49-digital-multisensory-blueprints
  cancel-in-progress: false

jobs:
  blueprints:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/copernico-recovery-webapp-20260902
          fetch-depth: 0

      - name: Generate 49 distinct multisensory experience blueprints
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          python scripts/generate_49_multisensory_blueprints.py

      - name: Validate exact 49-blueprint gate
        shell: bash
        run: |
          set -euo pipefail
          test -s curatorial-factory/sensory-blueprints/00_INDEX.json
          test -s curatorial-factory/sensory-blueprints/00_SENSORY_COUNCIL.json
          test ! -e curatorial-factory/sensory-blueprints/FAILURES.txt
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('curatorial-factory/sensory-blueprints')
          index=json.loads((p/'00_INDEX.json').read_text(encoding='utf-8'))
          expected={entry['file'] for entry in index['entries']}
          actual={f.name for f in p.glob('[0-9][0-9]_*.json') if not f.name.startswith('00_')}
          assert index['count']==49
          assert index['unique_sensory_signatures']==49
          assert actual==expected, (len(actual), len(expected), sorted(actual ^ expected))
          sig=[]
          for name in sorted(expected):
              x=json.loads((p/name).read_text(encoding='utf-8'))
              assert x['generic_fallback_allowed'] is False
              assert x['approved_for_code'] is False
              assert 3 <= len(x['participant_verbs']) <= 7
              assert len(x['session_variation']) >= 4
              sig.append(x['sensory_signature_id'])
          assert len(sig)==49 and len(set(sig))==49
          print('FORTY_NINE_BLUEPRINT_GATE=PASS')
          print('AUTHOR_REVIEW_REQUIRED=1')
          PY

      - name: Commit multisensory blueprints for author review
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Atlas Mistral Sensory Foundry'
          git config user.email 'milk@associacaomilk.pt'
          git add curatorial-factory/sensory-blueprints
          if git diff --cached --quiet; then
            echo BLUEPRINTS_ALREADY_CURRENT=1
            exit 0
          fi
          git commit -m 'feat(curadoria): compose 49 multisensory digital experience blueprints'
          git pull --rebase origin work/copernico-recovery-webapp-20260902
          git push origin HEAD:work/copernico-recovery-webapp-20260902
          echo MULTISENSORY_BLUEPRINTS_COMMITTED=1

