name: MILK — PTServidor FTPS secret probe

on:
  push:
    branches: [ops/ftps-fallback-probe-20260822]
    paths: ['.github/workflows/ptservidor-ftps-secret-probe.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PTSERVIDOR_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_FTPS_PASSWORD }}
      PTSERVIDOR_FTP_WEBDAV: ${{ secrets.PTSERVIDOR_FTP_WEBDAV }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Probe only documented migration account with opaque secrets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ftplib, json, os, ssl, urllib.request

          host='troi.ptservidor.net'
          user='migration@associacaomilk.pt'
          candidates=[
              ('PTSERVIDOR_FTPS_PASSWORD',(os.environ.get('PTSERVIDOR_FTPS_PASSWORD') or '').strip()),
              ('PTSERVIDOR_FTP_WEBDAV',(os.environ.get('PTSERVIDOR_FTP_WEBDAV') or '').strip()),
          ]
          results=[]
          winner=None
          for name,password in candidates:
              if not password:
                  results.append((name,'absent'))
                  continue
              status='rejected'
              ftp=None
              try:
                  ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=30)
                  ftp.connect(host,21,timeout=30)
                  ftp.login(user,password)
                  ftp.prot_p()
                  ftp.voidcmd('TYPE I')
                  ftp.pwd()
                  status='accepted'
                  winner=name
              except ftplib.error_perm:
                  status='rejected'
              except Exception as exc:
                  status='connection_error_'+type(exc).__name__
              finally:
                  if ftp:
                      try: ftp.quit()
                      except Exception: pass
              results.append((name,status))
              if winner: break
          compact=','.join(f'{name}:{status}' for name,status in results)
          body=(f'PTSERVIDOR_FTPS_SECRET_PROBE run={os.environ["RUN_ID"]} '
                f'auth_ok={1 if winner else 0} winner={winner or "none"} results={compact} '
                'files_written=0 secret_values_disclosed=0')
          print(body)
          req=urllib.request.Request(
              f'https://api.github.com/repos/{os.environ["REPO"]}/issues/35/comments',
              data=json.dumps({'body':body}).encode(),method='POST',headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Content-Type':'application/json','Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=45) as r: r.read()
          if not winner: raise SystemExit(2)
          PY
