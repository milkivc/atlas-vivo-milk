name: MILK Nextcloud current credential probe v2

on:
  workflow_dispatch:
  push:
    branches:
      - work/copernico-recovery-webapp-20260902
    paths:
      - '.github/workflows/nextcloud-current-credential-probe-v2.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXTCLOUD_ATLAS: ${{ secrets.NEXTCLOUD_ATLAS }}
      NEXTCLOUD_KEY: ${{ secrets.NEXTCLOUD_KEY }}
    steps:
      - name: Probe Nextcloud routes read-only without secret disclosure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,os,ssl,urllib.parse,urllib.request,urllib.error
          bases=['https://nuvem.associacaomilk.pt','https://associacaomilk.pt/nextcloud']
          users=['admin','milk','associ16','migration@associacaomilk.pt']
          routes=[]
          for label in ('NEXTCLOUD_ATLAS','NEXTCLOUD_KEY'):
              value=os.environ.get(label,'').strip()
              if value and value not in [v for _,v in routes]: routes.append((label,value))
          if not routes: raise SystemExit('NEXTCLOUD_SECRETS_MISSING')
          ctx=ssl.create_default_context(); results=[]; winner=None
          for base in bases:
              for label,password in routes:
                  for user in users:
                      endpoint=base.rstrip('/')+'/remote.php/dav/files/'+urllib.parse.quote(user,safe='')+'/'
                      raw=base64.b64encode((user+':'+password).encode()).decode()
                      req=urllib.request.Request(endpoint,method='PROPFIND',headers={'Authorization':'Basic '+raw,'Depth':'0','Accept':'application/xml'})
                      try:
                          with urllib.request.urlopen(req,timeout=20,context=ctx) as r: status=r.status
                      except urllib.error.HTTPError as e: status=e.code
                      except Exception: status='error'
                      results.append((base,label,user,status))
                      if status in (200,207): winner=(base,label,user,status); break
                  if winner: break
              if winner: break
          if not winner:
              compact=';'.join(f'{b}|{l}|{u}|{s}' for b,l,u,s in results)
              print('NEXTCLOUD_READONLY_PROBE=BLOCKED '+compact)
              print('SECRET_VALUES_DISCLOSED=0')
              raise SystemExit(1)
          base,label,user,status=winner
          print(f'NEXTCLOUD_READONLY_PROBE=PASS base={base} route={label} user={user} http={status}')
          print('NEXTCLOUD_CORPUS_ACCESS=READY')
          print('SECRET_VALUES_DISCLOSED=0')
          PY
