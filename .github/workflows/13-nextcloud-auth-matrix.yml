name: 13 MILK Nextcloud admin authentication

on:
  workflow_dispatch:
  push:
    branches: [work/copernico-recovery-webapp-20260902]
    paths: ['.github/workflows/13-nextcloud-auth-matrix.yml']

permissions:
  contents: read

env:
  ADMIN_NEXTCLOUD: ${{ secrets.ADMIN_NEXTCLOUD }}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify dedicated admin secret without disclosure
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_NEXTCLOUD"
          python - <<'PY'
          import base64,os,ssl,time,urllib.error,urllib.parse,urllib.request
          base='https://associacaomilk.pt/nextcloud'
          user='admin'
          password=os.environ['ADMIN_NEXTCLOUD'].strip()
          print('ADMIN_NEXTCLOUD_PRESENT=YES')
          print('ADMIN_NEXTCLOUD_SHAPE=' + ('URL' if password.lower().startswith(('http://','https://')) else 'PASSWORD_VALUE'))
          print('SECRET_VALUES_DISCLOSED=0')
          if password.lower().startswith(('http://','https://')):
              raise SystemExit('ADMIN_NEXTCLOUD_CONTAINS_URL_NOT_PASSWORD')
          auth=base64.b64encode((user+':'+password).encode()).decode()
          ctx=ssl.create_default_context()
          body=b'<?xml version="1.0"?><d:propfind xmlns:d="DAV:"><d:prop><d:resourcetype/><d:getetag/></d:prop></d:propfind>'
          tests=[
              ('DAV_CURRENT',base+'/remote.php/dav/files/'+urllib.parse.quote(user,safe='')+'/', 'PROPFIND', body, {'Depth':'0','Content-Type':'application/xml; charset=utf-8'}),
              ('OCS_USER',base+'/ocs/v2.php/cloud/user?format=json','GET',None,{'OCS-APIRequest':'true','Accept':'application/json'}),
              ('DAV_LEGACY',base+'/remote.php/webdav/','PROPFIND',body,{'Depth':'0','Content-Type':'application/xml; charset=utf-8'})
          ]
          statuses=[]
          for i,(label,url,method,data,extra) in enumerate(tests):
              if i: time.sleep(8)
              headers={'Authorization':'Basic '+auth,'User-Agent':'MILK-Nextcloud-Admin-Probe/3.0'}; headers.update(extra)
              req=urllib.request.Request(url,data=data,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=45,context=ctx) as r:
                      status=r.status; r.read(512)
              except urllib.error.HTTPError as e:
                  status=e.code
              except Exception:
                  status='ERR'
              statuses.append((label,status))
              print(label+'_HTTP='+str(status))
              if status in (200,207):
                  print('NEXTCLOUD_ADMIN_AUTH=PASS')
                  print('NEXTCLOUD_AUTH_ENDPOINT='+label)
                  print('NEXTCLOUD_WRITES=0')
                  print('SECRET_VALUES_DISCLOSED=0')
                  raise SystemExit(0)
          print('NEXTCLOUD_ADMIN_AUTH=BLOCKED')
          print('NEXTCLOUD_WRITES=0')
          print('SECRET_VALUES_DISCLOSED=0')
          raise SystemExit(41)
          PY
