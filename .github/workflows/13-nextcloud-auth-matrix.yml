name: 13 MILK Nextcloud authentication matrix

on:
  workflow_dispatch:
  push:
    branches: [work/copernico-recovery-webapp-20260902]
    paths: ['.github/workflows/13-nextcloud-auth-matrix.yml']

permissions:
  contents: read

env:
  NEXTCLOUD_ATLAS: ${{ secrets.NEXTCLOUD_ATLAS }}
  NEXTCLOUD_KEY: ${{ secrets.NEXTCLOUD_KEY }}
  PTSERVIDOR_FTP_WEBDAV: ${{ secrets.PTSERVIDOR_FTP_WEBDAV }}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe all existing credential aliases read-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,ssl,urllib.error,urllib.parse,urllib.request
          base='https://associacaomilk.pt/nextcloud'
          users=('admin','milk','associ16','migration@associacaomilk.pt')
          candidates=[]
          def add(label,value):
              value=(value or '').strip()
              if not value or value.startswith('http') or any(value==v for _,v in candidates): return
              candidates.append((label,value))
          add('NEXTCLOUD_KEY',os.environ.get('NEXTCLOUD_KEY'))
          add('NEXTCLOUD_ATLAS',os.environ.get('NEXTCLOUD_ATLAS'))
          raw=(os.environ.get('PTSERVIDOR_FTP_WEBDAV') or '').strip()
          if raw:
              try:
                  obj=json.loads(raw)
                  if isinstance(obj,dict):
                      for key in ('nextcloud_password','webdav_password','password','key'):
                          add('PTSERVIDOR_FTP_WEBDAV:'+key,str(obj.get(key) or ''))
              except Exception:
                  for line in raw.splitlines():
                      if '=' in line:
                          k,v=line.split('=',1)
                          if 'PASS' in k.upper() or 'KEY' in k.upper(): add('PTSERVIDOR_FTP_WEBDAV:'+k.strip(),v)
                  if '\n' not in raw and '=' not in raw and len(raw)<512: add('PTSERVIDOR_FTP_WEBDAV',raw)
          if not candidates: raise SystemExit('NO_CREDENTIAL_CANDIDATES')
          winner=None; results=[]
          for label,password in candidates:
              for user in users:
                  path='/remote.php/dav/files/'+urllib.parse.quote(user,safe='')+'/'
                  auth=base64.b64encode((user+':'+password).encode()).decode()
                  req=urllib.request.Request(base+path,data=b'<?xml version="1.0"?><d:propfind xmlns:d="DAV:"><d:prop><d:resourcetype/></d:prop></d:propfind>',method='PROPFIND',headers={'Authorization':'Basic '+auth,'Depth':'0','Content-Type':'application/xml','User-Agent':'MILK-Nextcloud-Auth-Matrix/1.0'})
                  try:
                      with urllib.request.urlopen(req,timeout=30,context=ssl.create_default_context()) as r: status=r.status
                  except urllib.error.HTTPError as e: status=e.code
                  except Exception: status='ERR'
                  results.append((label,user,status))
                  if status in (200,207): winner=(label,user,status); break
              if winner: break
          print('NEXTCLOUD_AUTH_CANDIDATES='+str(len(candidates)))
          print('NEXTCLOUD_AUTH_ATTEMPTS='+str(len(results)))
          if winner:
              print('NEXTCLOUD_AUTH_MATRIX=PASS')
              print('NEXTCLOUD_AUTH_ALIAS='+winner[0])
              print('NEXTCLOUD_AUTH_USER='+winner[1])
              print('NEXTCLOUD_AUTH_HTTP='+str(winner[2]))
          else:
              print('NEXTCLOUD_AUTH_MATRIX=BLOCKED')
              print('NEXTCLOUD_STATUS_SET='+','.join(sorted({str(x[2]) for x in results})))
              raise SystemExit(41)
          print('NEXTCLOUD_WRITES=0')
          print('SECRET_VALUES_DISCLOSED=0')
          PY
