name: 13 MILK Nextcloud admin authentication

on:
  workflow_dispatch:
  push:
    branches: [work/copernico-recovery-webapp-20260902]
    paths: ['.github/workflows/13-nextcloud-auth-matrix.yml']

permissions:
  contents: read

env:
  ADMIN_NEXTCLOUD: ${{ secrets.ADMIN_NEXTCLOUD }}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Authenticate admin read-only using dedicated secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_NEXTCLOUD"
          python - <<'PY'
          import base64,os,ssl,time,urllib.error,urllib.parse,urllib.request
          base='https://associacaomilk.pt/nextcloud'
          user='admin'
          password=os.environ['ADMIN_NEXTCLOUD'].strip()
          endpoint=base+'/remote.php/dav/files/'+urllib.parse.quote(user,safe='')+'/'
          auth=base64.b64encode((user+':'+password).encode()).decode()
          body=b'<?xml version="1.0"?><d:propfind xmlns:d="DAV:"><d:prop><d:resourcetype/><d:getetag/></d:prop></d:propfind>'
          def attempt():
              req=urllib.request.Request(endpoint,data=body,method='PROPFIND',headers={
                  'Authorization':'Basic '+auth,
                  'Depth':'1',
                  'Content-Type':'application/xml; charset=utf-8',
                  'Accept':'application/xml',
                  'User-Agent':'MILK-Nextcloud-Admin-Probe/2.0'})
              try:
                  with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:
                      data=r.read()
                      return r.status,len(data),None
              except urllib.error.HTTPError as e:
                  return e.code,0,e.headers.get('Retry-After')
          status,size,retry=attempt()
          if status==429:
              delay=60
              try: delay=max(30,min(180,int(retry or '60')))
              except Exception: pass
              print('NEXTCLOUD_RATE_LIMIT_RETRY_SECONDS='+str(delay))
              time.sleep(delay)
              status,size,retry=attempt()
          print('NEXTCLOUD_ADMIN_HTTP='+str(status))
          if status not in (200,207): raise SystemExit('NEXTCLOUD_ADMIN_AUTH_BLOCKED')
          print('NEXTCLOUD_ADMIN_AUTH=PASS')
          print('NEXTCLOUD_ADMIN_RESPONSE_BYTES='+str(size))
          print('NEXTCLOUD_WRITES=0')
          print('SECRET_VALUES_DISCLOSED=0')
          PY
