name: IA MILK Secret Broker Bootstrap

on:
  push:
    branches: [codex/safety-gate-2026-08-10]
    paths:
      - 'ia_milk/sovereign/secret_broker.py'
      - 'ia_milk/sovereign/connector_runtime.py'
      - 'ia_milk/sovereign/test_secret_boundary.py'
      - '.github/workflows/ia-milk-secret-broker-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install broker crypto dependency
        run: python -m pip install --disable-pip-version-check --no-input 'PyNaCl==1.5.0'
      - name: Compile secret-blind runtime
        run: |
          set -euo pipefail
          python -m py_compile ia_milk/sovereign/secret_broker.py ia_milk/sovereign/connector_runtime.py ia_milk/sovereign/test_secret_boundary.py
      - name: Prove trainer/connector secret boundary
        working-directory: ia_milk/sovereign
        run: |
          set -euo pipefail
          python test_secret_boundary.py
          python connector_runtime.py catalog | tee /tmp/catalog.json
          ! grep -Eqi '(password|passwd|token|api[_-]?key|secret_refs|credential)' /tmp/catalog.json
          echo 'TRAINER_SECRET_BLIND_OK'
      - name: Emit public sealing key only
        run: |
          set -euo pipefail
          test -n "${MISTRAL_API_KEY:-}" || { echo 'BROKER_ROOT_SECRET_MISSING'; exit 2; }
          python ia_milk/sovereign/secret_broker.py public
          echo 'BROKER_PUBLIC_KEY_OK'
