name: IA MILK Secret Broker Bootstrap

on:
  push:
    branches: [codex/safety-gate-2026-08-10]
    paths:
      - 'ia_milk/sovereign/secret_broker.py'
      - 'ia_milk/sovereign/connector_runtime.py'
      - 'ia_milk/sovereign/test_secret_boundary.py'
      - '.github/workflows/ia-milk-secret-broker-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install broker crypto dependency
        run: python -m pip install --disable-pip-version-check --no-input 'PyNaCl==1.5.0'
      - name: Compile and test secret-blind runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ia_milk/sovereign/secret_broker.py ia_milk/sovereign/connector_runtime.py ia_milk/sovereign/test_secret_boundary.py
          python ia_milk/sovereign/test_secret_boundary.py
          python ia_milk/sovereign/connector_runtime.py catalog | tee /tmp/catalog.json
          ! grep -Eqi '(password|passwd|api[_-]?key|credential_value)' /tmp/catalog.json
          echo 'TRAINER_SECRET_BLIND_OK'
      - name: Prove broker cannot derive sovereignty from Mistral
        shell: bash
        run: |
          set -euo pipefail
          export MISTRAL_API_KEY='trainer-only-fixture-not-a-root-secret'
          if python ia_milk/sovereign/secret_broker.py public --env MISTRAL_API_KEY >/tmp/forbidden 2>&1; then
            echo '::error::Mistral was incorrectly accepted as broker root'; exit 1
          fi
          grep -q 'external trainer credential cannot be IA MILK broker root' /tmp/forbidden
          echo 'IA_MILK_BROKER_INDEPENDENCE_OK'
      - name: Exercise IA MILK-owned broker with ephemeral fixture root
        shell: bash
        run: |
          set -euo pipefail
          export IA_MILK_BROKER_ROOT_KEY="$(python - <<'PY'
          import secrets; print(secrets.token_urlsafe(48))
          PY
          )"
          python ia_milk/sovereign/secret_broker.py public | tee /tmp/public.json
          grep -q '"root_owner": "IA_MILK"' /tmp/public.json
          unset IA_MILK_BROKER_ROOT_KEY
          echo 'IA_MILK_SOVEREIGN_BROKER_OK'
