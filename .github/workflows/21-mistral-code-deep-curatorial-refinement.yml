name: 21 MILK Mistral Code deep curatorial refinement

on:
  workflow_dispatch:
  push:
    branches: [work/copernico-recovery-webapp-20260902]
    paths:
      - 'deploy/atlas-public/experiences/**'
      - 'curatorial-factory/EXPERIENCE_RESEARCH_MATRIX_20260902.md'
      - '.github/workflows/21-mistral-code-deep-curatorial-refinement.yml'

permissions:
  contents: write

concurrency:
  group: milk-mistral-code-deep-refinement
  cancel-in-progress: true

jobs:
  refine:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRALAPI_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/copernico-recovery-webapp-20260902
          fetch-depth: 0

      - name: Gate exact 49-runtime set
        id: runtime_gate
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,os
          idx=json.loads(pathlib.Path('curatorial-factory/sensory-blueprints/00_INDEX.json').read_text())
          root=pathlib.Path('deploy/atlas-public/experiences')
          present=sum((root/(x['id']+'.js')).is_file() for x in idx['entries'])
          print('RUNTIMES_PRESENT='+str(present))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('ready='+('1' if present==49 else '0')+'\n')
          PY

      - name: Probe Mistral account availability
        id: mistral_gate
        if: steps.runtime_gate.outputs.ready == '1'
        shell: bash
        run: |
          python - <<'PY'
          import os,urllib.error,urllib.request
          key=os.environ.get('MISTRAL_API_KEY','').strip(); available='0'; code='missing'
          if key:
              try:
                  req=urllib.request.Request('https://api.mistral.ai/v1/models',headers={'Authorization':'Bearer '+key})
                  with urllib.request.urlopen(req,timeout=30): pass
                  available='1'; code='200'
              except urllib.error.HTTPError as e: code=str(e.code)
              except Exception as e: code=type(e).__name__
          print('MISTRAL_DEEP_REFINEMENT_ACCOUNT_HTTP='+code)
          if code=='402': print('MISTRAL_DEEP_REFINEMENT_DEFERRED_BILLING=1')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('available='+available+'\n')
          PY

      - name: Install Mistral Vibe Code
        if: steps.runtime_gate.outputs.ready == '1' && steps.mistral_gate.outputs.available == '1'
        run: |
          python -m pip install --disable-pip-version-check --quiet 'mistral-vibe==2.24.5'
          vibe --version

      - name: Deep curatorial interaction refinement
        if: steps.runtime_gate.outputs.ready == '1' && steps.mistral_gate.outputs.available == '1'
        run: |
          set -euo pipefail
          vibe --trust --max-turns 120 --output json --prompt "EXECUÇÃO AUTORIZADA DE SEGUNDA PASSAGEM CURATORIAL. EDITA O CÓDIGO REAL, não escrevas relatório. Lê AGENTS.md, curatorial-factory/SOURCE_CORPUS_20260902.md, curatorial-factory/DIGITAL_MULTISENSORY_EXPERIENCE_CONSTITUTION_20260902.md, curatorial-factory/EXPERIENCE_RESEARCH_MATRIX_20260902.md, os 49 blueprints e os 49 runtimes. Blueprint/texto autoral > dinâmica/brincadeira > investigação > decisão técnica. Elimina template, click-modal, quiz, card, formulário e decoração sensorial rasa. Aprofunda gesto, tempo, silêncio, acaso, espaço, contaminação entre sentidos e devolução apenas quando sustentados. Preserva COPÉRNICO e COSMICOXES. Não inventes conteúdo. Sem fetch/CDN/tracker. Teclado/touch/reduced-motion têm equivalência poética. Inspecciona lifecycle e destroy() dos 49." > /tmp/vibe-deep-refinement.json

      - name: Deterministic gate after refinement
        if: steps.runtime_gate.outputs.ready == '1' && steps.mistral_gate.outputs.available == '1'
        run: |
          set -euo pipefail
          node tests/ia-milk-public-boundary.test.mjs
          for f in deploy/atlas-public/experiences/*.js deploy/atlas-public/*.js; do node --check "$f"; done
          git diff --check
          test "$(find deploy/atlas-public/experiences -maxdepth 1 -name '*.js' ! -name 'registry.js' | wc -l)" -eq 49

      - name: Commit deep refinements
        if: steps.runtime_gate.outputs.ready == '1' && steps.mistral_gate.outputs.available == '1'
        run: |
          git config user.name 'Atlas Mistral Code'
          git config user.email 'milk@associacaomilk.pt'
          git add deploy/atlas-public/experiences deploy/atlas-public/curadorias.js deploy/atlas-public/experience-machine.js deploy/atlas-public/index.html deploy/atlas-public/*.css 2>/dev/null || true
          if git diff --cached --quiet; then echo NO_DEEP_REFINEMENT_DELTA=1; exit 0; fi
          git commit -m 'feat(experiences): deepen 49 curatorial interactions with Mistral Code'
          git pull --rebase origin work/copernico-recovery-webapp-20260902
          git push origin HEAD:work/copernico-recovery-webapp-20260902
