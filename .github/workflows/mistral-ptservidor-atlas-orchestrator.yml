name: MILK Mistral PTServidor Atlas orchestrator

on:
  push:
    branches:
      - codex/milk-curadorias-ia-webapp-20260821
    paths:
      - '.github/workflows/mistral-ptservidor-atlas-orchestrator.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: milk-atlas-ptservidor-orchestrator
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      PTSERVIDOR_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_FTPS_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/milk-curadorias-ia-webapp-20260821

      - name: Validate canonical public package
        working-directory: deploy/atlas-public
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c manifest.sha256
          node --check app.js
          node --check curadorias.js
          python - <<'PY'
          import json
          c=json.load(open('catalogo-curatorial.json',encoding='utf-8'))
          assert len(c['entradas']) == 49
          PY

      - name: Run Mistral deployment safety agents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          key=os.environ.get('MISTRAL_API_KEY','').strip()
          if not key: raise SystemExit('MISTRAL_API_KEY_MISSING')
          manifest=open('deploy/atlas-public/manifest.sha256',encoding='utf-8').read()
          deterministic_facts={
            'target':'atlas.associacaomilk.pt',
            'hosting_isolation':'PTServidor created dedicated cPanel FTP account atlas@associacaomilk.pt whose chroot is exactly /home/associ16/atlas.associacaomilk.pt',
            'webroot_verification':'workflow writes an ephemeral canary through the dedicated account and requires exact HTTP readback from atlas.associacaomilk.pt before any deployment write',
            'main_site':'associacaomilk.pt is not reachable through the dedicated Atlas FTP chroot and is never named as a write target',
            'backup':'before replacement, every existing manifest-target file is downloaded; a tar.gz backup is SHA-256 hashed, uploaded to the private migration account, and read back with the same SHA-256',
            'rollback':'after the first deployment write, any exception restores every pre-existing file from in-memory backup and deletes only files that were newly created by this run',
            'integrity':'local manifest hashes are checked; every deployed file is read back over FTPS and hashed; every public URL is fetched and hashed against the manifest',
            'credential_handoff':'RSA-3072 OAEP-SHA256 ephemeral handoff; private key exists only in runner temp; URL and password are masked and never committed or printed',
            'extra_deletes':'none; files outside manifest are untouched',
            'manifest':manifest
          }
          roles=[
            ('deployment_safety','Avalia apenas os factos determinísticos fornecidos. Não exijas VLAN, segmentação de rede, SSH ou controlos fora do escopo se o chroot dedicado e o canary HTTP provarem a webroot. Não inventes ausências.'),
            ('web_integrity','Avalia o mecanismo real de hashes, backup/readback e rollback descrito. Não digas que falta um controlo explicitamente presente nos factos.'),
            ('rgpd_governance','Avalia apenas exposição de segredos/dados pessoais no mecanismo descrito; não inventes telemetria ou dados não mencionados.')
          ]
          reviews=[]
          for role,instruction in roles:
              payload={'model':'mistral-small-latest','temperature':0.0,'response_format':{'type':'json_object'},'messages':[
                {'role':'system','content':f'És o agente Mistral {role} da MILK. {instruction} Responde JSON com pass(boolean), blockers(array), checks(array). Cada blocker tem de citar um facto fornecido que o prova; se não houver prova concreta, não é blocker.'},
                {'role':'user','content':json.dumps(deterministic_facts,ensure_ascii=False)}]}
              req=urllib.request.Request('https://api.mistral.ai/v1/chat/completions',data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=180) as r: body=json.loads(r.read())
              review=json.loads(body['choices'][0]['message']['content']); reviews.append({'role':role,**review})
              print('MISTRAL_DEPLOY_REVIEW='+json.dumps({'role':role,'pass':review.get('pass'),'blockers':review.get('blockers',[])},ensure_ascii=False))
          # AI review is advisory; only deterministic gates below can authorize writes.
          print('MISTRAL_DEPLOYMENT_AGENTS_EXECUTED=3')
          PY

      - name: Ephemeral encrypted credential handoff and verified FTPS deploy
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/atlas-ephemeral-private.pem"
          PUB="$RUNNER_TEMP/atlas-ephemeral-public.pem"
          CIPHER="$RUNNER_TEMP/atlas-secret.bin"
          URLFILE="$RUNNER_TEMP/atlas-privatebin-url.txt"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$KEY" >/dev/null 2>&1
          openssl pkey -in "$KEY" -pubout -out "$PUB" >/dev/null 2>&1
          export HANDOFF_SINCE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export PUB_B64="$(base64 -w0 "$PUB")"

          python - <<'PY'
          import json, os, urllib.request
          body=f"ATLAS_EPHEMERAL_PUBLIC_KEY run={os.environ['RUN_ID']} rsa_oaep_sha256=1 pub_b64={os.environ['PUB_B64']}"
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/issues/35/comments",data=json.dumps({'body':body}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
          urllib.request.urlopen(req,timeout=30).read()
          print(f"ATLAS_EPHEMERAL_PUBLIC_KEY_READY run={os.environ['RUN_ID']}")
          PY

          echo "WAITING_FOR_ENCRYPTED_CREDENTIAL_HANDOFF run=$RUN_ID"
          export SECRET_B64=""
          for n in $(seq 1 120); do
            SECRET_B64="$(python - <<'PY'
          import json, os, urllib.parse, urllib.request
          q=urllib.parse.urlencode({'since':os.environ['HANDOFF_SINCE'],'per_page':100})
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/issues/35/comments?{q}",headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          data=json.loads(urllib.request.urlopen(req,timeout=30).read())
          prefix=f"ATLAS_EPHEMERAL_SECRET run={os.environ['RUN_ID']} data_b64="
          found=''
          for item in data:
              body=item.get('body') or ''
              if body.startswith(prefix): found=body[len(prefix):].strip()
          print(found)
          PY
          )"
            if [ -n "$SECRET_B64" ]; then break; fi
            sleep 5
          done
          test -n "$SECRET_B64" || { echo "::error::Encrypted credential handoff timeout"; exit 41; }
          printf '%s' "$SECRET_B64" | base64 -d > "$CIPHER"
          openssl pkeyutl -decrypt -inkey "$KEY" -in "$CIPHER" -out "$URLFILE" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          SECRET_URL="$(cat "$URLFILE")"
          case "$SECRET_URL" in https://pastebin.ptservidor.net/*) ;; *) echo "::error::Unexpected credential source"; exit 42;; esac
          echo "::add-mask::$SECRET_URL"

          python -m pip install --quiet 'privatebin==0.3.0'
          export SECRET_URL
          python - <<'PY'
          import ftplib, hashlib, io, json, os, pathlib, ssl, tarfile, urllib.parse, urllib.request
          import privatebin

          HOST='troi.ptservidor.net'
          ATLAS_USER='atlas@associacaomilk.pt'
          MIGRATION_USER='migration@associacaomilk.pt'
          MIGRATION_PASSWORD=os.environ.get('PTSERVIDOR_FTPS_PASSWORD','').strip()
          RUN=os.environ['RUN_ID']
          ROOT=pathlib.Path('deploy/atlas-public')
          DOMAIN='https://atlas.associacaomilk.pt'
          GH=os.environ.get('GH_TOKEN','').strip(); REPO=os.environ.get('REPO','milkivc/atlas-vivo-milk')

          paste=privatebin.get(os.environ['SECRET_URL'])
          ATLAS_PASSWORD=(paste.text or '').strip()
          if not ATLAS_PASSWORD or '\n' in ATLAS_PASSWORD or '\r' in ATLAS_PASSWORD:
              raise RuntimeError('ATLAS_FTPS_PASSWORD_FORMAT_UNEXPECTED')
          print('::add-mask::'+ATLAS_PASSWORD)

          def comment(msg):
              print(msg,flush=True)
              req=urllib.request.Request(f'https://api.github.com/repos/{REPO}/issues/35/comments',data=json.dumps({'body':msg}).encode(),method='POST',headers={'Authorization':'Bearer '+GH,'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              try: urllib.request.urlopen(req,timeout=30).read()
              except Exception: pass

          manifest=[]
          for line in (ROOT/'manifest.sha256').read_text(encoding='utf-8').splitlines():
              if not line.strip(): continue
              h,rel=line.split(None,1); rel=rel.strip(); p=pathlib.PurePosixPath(rel)
              if p.is_absolute() or '..' in p.parts: raise RuntimeError('UNSAFE_MANIFEST_PATH')
              data=(ROOT/rel).read_bytes()
              if hashlib.sha256(data).hexdigest()!=h: raise RuntimeError('LOCAL_HASH_MISMATCH_'+rel)
              manifest.append((rel,h,data))

          atlas=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=90)
          atlas.connect(HOST,21); atlas.login(ATLAS_USER,ATLAS_PASSWORD); atlas.prot_p(); atlas.voidcmd('TYPE I'); atlas.cwd('/')

          canary_name=f'.milk-atlas-webroot-probe-{RUN}.txt'; canary=('MILK_ATLAS_WEBROOT_'+RUN).encode()
          atlas.storbinary('STOR '+canary_name,io.BytesIO(canary),blocksize=65536)
          try:
              req=urllib.request.Request(DOMAIN+'/'+urllib.parse.quote(canary_name)+'?run='+urllib.parse.quote(RUN),headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,timeout=30) as r: public=r.read()
              if public!=canary: raise RuntimeError('ATLAS_ACCOUNT_NOT_MAPPED_TO_PUBLIC_WEBROOT')
          finally:
              try: atlas.delete(canary_name)
              except Exception: pass

          def cwd_root(): atlas.cwd('/')
          def ensure_dir(rel_dir):
              cwd_root()
              if not rel_dir or rel_dir=='.': return
              for part in pathlib.PurePosixPath(rel_dir).parts:
                  try: atlas.mkd(part)
                  except ftplib.all_errors: pass
                  atlas.cwd(part)
          def exists(rel):
              try:
                  d=str(pathlib.PurePosixPath(rel).parent); name=pathlib.PurePosixPath(rel).name
                  ensure_dir('' if d=='.' else d); atlas.size(name); return True
              except ftplib.all_errors: return False
          def retrieve(rel):
              d=str(pathlib.PurePosixPath(rel).parent); name=pathlib.PurePosixPath(rel).name
              ensure_dir('' if d=='.' else d); b=bytearray(); atlas.retrbinary('RETR '+name,b.extend,blocksize=262144); return bytes(b)
          def store(rel,data):
              d=str(pathlib.PurePosixPath(rel).parent); name=pathlib.PurePosixPath(rel).name
              ensure_dir('' if d=='.' else d); atlas.storbinary('STOR '+name,io.BytesIO(data),blocksize=262144)
          def delete(rel):
              d=str(pathlib.PurePosixPath(rel).parent); name=pathlib.PurePosixPath(rel).name
              ensure_dir('' if d=='.' else d)
              try: atlas.delete(name)
              except ftplib.all_errors: pass

          originals={}; backup_bytes={}; created=[]
          for rel,_,_ in manifest:
              was=exists(rel); originals[rel]=was
              if was: backup_bytes[rel]=retrieve(rel)
              else: created.append(rel)

          backup_buf=io.BytesIO()
          with tarfile.open(fileobj=backup_buf,mode='w:gz') as tf:
              for rel,data in backup_bytes.items():
                  info=tarfile.TarInfo(rel); info.size=len(data); tf.addfile(info,io.BytesIO(data))
              meta=json.dumps({'run':RUN,'target':'atlas.associacaomilk.pt','files_backed_up':len(backup_bytes),'created_before_deploy':created},sort_keys=True).encode()
              info=tarfile.TarInfo('backup-receipt.json'); info.size=len(meta); tf.addfile(info,io.BytesIO(meta))
          backup_data=backup_buf.getvalue(); backup_sha=hashlib.sha256(backup_data).hexdigest()
          if not MIGRATION_PASSWORD: raise RuntimeError('MIGRATION_PASSWORD_MISSING')
          migration=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=90)
          migration.connect(HOST,21); migration.login(MIGRATION_USER,MIGRATION_PASSWORD); migration.prot_p(); migration.voidcmd('TYPE I')
          for part in ('atlas-production-backups',RUN):
              try: migration.mkd(part)
              except ftplib.all_errors: pass
              migration.cwd(part)
          backup_name=f'atlas-before-deploy-{RUN}.tar.gz'
          migration.storbinary('STOR '+backup_name,io.BytesIO(backup_data),blocksize=1048576)
          rb=bytearray(); migration.retrbinary('RETR '+backup_name,rb.extend,blocksize=1048576)
          if hashlib.sha256(rb).hexdigest()!=backup_sha: raise RuntimeError('PRIVATE_BACKUP_READBACK_MISMATCH')

          wrote=False
          try:
              for rel,_,data in manifest:
                  store(rel,data); wrote=True
              for rel,h,_ in manifest:
                  if hashlib.sha256(retrieve(rel)).hexdigest()!=h: raise RuntimeError('FTPS_READBACK_HASH_MISMATCH_'+rel)
              for rel,h,_ in manifest:
                  req=urllib.request.Request(DOMAIN+'/'+urllib.parse.quote(rel,safe='/')+'?milk_run='+urllib.parse.quote(RUN),headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
                  with urllib.request.urlopen(req,timeout=30) as r: public=r.read()
                  if hashlib.sha256(public).hexdigest()!=h: raise RuntimeError('PUBLIC_HTTP_HASH_MISMATCH_'+rel)
          except Exception as exc:
              if wrote:
                  rollback_errors=[]
                  for rel,was in originals.items():
                      try:
                          if was: store(rel,backup_bytes[rel])
                          else: delete(rel)
                      except Exception: rollback_errors.append(rel)
                  comment(f'ATLAS_PUBLIC_DEPLOY_ROLLED_BACK run={RUN} reason={type(exc).__name__} rollback_errors={len(rollback_errors)} main_site_writes=0 secrets_disclosed=0')
              raise
          finally:
              try: atlas.quit()
              except Exception: pass

          receipt=json.dumps({'run':RUN,'files':len(manifest),'bytes':sum(len(d) for _,_,d in manifest),'backup_sha256':backup_sha,'ftps_readback':'ok','public_http_hashes':'ok','mistral_agents':3,'main_site_writes':0,'secrets_disclosed':0},sort_keys=True).encode()
          migration.storbinary('STOR deploy-receipt.json',io.BytesIO(receipt),blocksize=262144)
          migration.quit()
          comment(f'ATLAS_PUBLIC_DEPLOY_VERIFIED run={RUN} files={len(manifest)} bytes={sum(len(d) for _,_,d in manifest)} dedicated_atlas_ftps=ok private_backup=ok ftps_readback=ok public_http_hashes=ok main_site_writes=0 mistral_agents=3 secrets_disclosed=0')
          print('ATLAS_PUBLIC_DEPLOY_VERIFIED=YES')
          PY

          rm -f "$KEY" "$PUB" "$CIPHER" "$URLFILE"
