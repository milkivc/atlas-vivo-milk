name: MILK dispatch existing Mistral Nextcloud operator

on:
  push:
    branches:
      - work/copernico-recovery-webapp-20260902
    paths:
      - '.github/workflows/dispatch-mistral-nextcloud-operator.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch existing master Mistral cPanel Nextcloud operator
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/actions/workflows/mistral-cpanel-nextcloud-operator.yml/dispatches" \
            -d '{"ref":"master"}')"
          test "$code" = '204' || { cat /tmp/dispatch.out; echo "::error::NEXTCLOUD_OPERATOR_DISPATCH_HTTP_$code"; exit 21; }
          echo 'MISTRAL_CPANEL_NEXTCLOUD_OPERATOR_DISPATCHED=YES'
