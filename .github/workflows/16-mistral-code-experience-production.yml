name: 16 MILK Mistral Code experience production

on:
  workflow_dispatch:
  push:
    branches: [work/copernico-recovery-webapp-20260902]
    paths: ['.github/workflows/16-mistral-code-experience-production.yml']

permissions:
  contents: write

concurrency:
  group: milk-mistral-code-experience-production
  cancel-in-progress: false

jobs:
  code-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/copernico-recovery-webapp-20260902
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Baseline gates
        shell: bash
        run: |
          set -euo pipefail
          node tests/ia-milk-public-boundary.test.mjs
          node --check deploy/atlas-public/authorial-portals.js
          node --check deploy/atlas-public/experience-machine.js
          git diff --check
          grep -Fq 'Escolhe sem autoridade. Aproxima duas coisas.' deploy/atlas-public/authorial-portals.js
          grep -Fq 'Apanha uma frase pelo rabo. Continua-a.' deploy/atlas-public/authorial-portals.js
          grep -Fq 'somos todos possíveis' deploy/atlas-public/authorial-portals.js
          grep -Fq 'onde arte e afeto são casa e chão' deploy/atlas-public/authorial-portals.js
          echo BASELINE_AUTHORIAL_PORTALS=PASS

      - name: Mistral Vibe Code — concrete production engineering pass
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          python -m pip install --disable-pip-version-check --quiet mistral-vibe
          vibe --version
          vibe --trust --max-turns 32 --output json --prompt "IMPLEMENTAÇÃO REAL OBRIGATÓRIA NA BRANCH ACTUAL. Lê AGENTS.md e depois deploy/atlas-public/authorial-portals.js e deploy/atlas-public/authorial-portals.css. Trabalha EXCLUSIVAMENTE nesses dois ficheiros. NÃO inventes mecânicas, NÃO alteres nenhum texto visível, NÃO alteres assets, NÃO toques COPÉRNICO, falARTE, Palavra Ritual, index.html, catálogo, manifestos ou dados. Implementa concretamente estas correcções técnicas, porque o código actual não as tem de forma completa: (1) guardar o elemento que abriu a experiência e restaurar-lhe o foco quando o dialog fecha, somente se ainda estiver ligado ao DOM; (2) garantir que o foco inicial do campo/textarea acontece depois de showModal(), nunca antes; (3) criar helpers seguros para localStorage get/set/remove com try/catch, para a experiência Fucô não quebrar quando storage estiver indisponível; (4) limitar/clamp x e y do pointer da Galeria aos limites reais do campo; (5) centralizar a limpeza de TODOS os listeners criados por cada experiência, por AbortController/signal ou cleanup explícito completo, para fechar/reabrir sem listeners órfãos; (6) manter reduced-motion e acrescentar focus-visible técnico onde faltar, sem alterar estética autoral; (7) preservar exactamente estas frases: 'Escolhe sem autoridade. Aproxima duas coisas.'; 'Apanha uma frase pelo rabo. Continua-a.'; 'somos todos possíveis'; 'onde arte e afeto são casa e chão'. A tarefa NÃO está concluída se git diff ficar vazio. Edita os ficheiros de verdade e revê o diff. Se uma correcção já existir, implementa as restantes. Nenhuma mudança fora de robustez, acessibilidade e ciclo de vida é permitida." > /tmp/vibe-code-production.json
          test -s /tmp/vibe-code-production.json
          echo MISTRAL_VIBE_CODE_PRODUCTION=EXECUTED

      - name: Scope + authorial fidelity gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'CHANGED=%s\n' "${changed[*]:-NONE}"
          for f in "${changed[@]}"; do
            case "$f" in
              deploy/atlas-public/authorial-portals.js|deploy/atlas-public/authorial-portals.css) ;;
              *) echo "OUT_OF_SCOPE_CHANGE=$f"; exit 31;;
            esac
          done
          test "${#changed[@]}" -gt 0
          grep -Fq 'Escolhe sem autoridade. Aproxima duas coisas.' deploy/atlas-public/authorial-portals.js
          grep -Fq 'Apanha uma frase pelo rabo. Continua-a.' deploy/atlas-public/authorial-portals.js
          grep -Fq 'somos todos possíveis' deploy/atlas-public/authorial-portals.js
          grep -Fq 'onde arte e afeto são casa e chão' deploy/atlas-public/authorial-portals.js
          grep -Fq 'localStorage' deploy/atlas-public/authorial-portals.js
          if grep -RInE 'MISTRAL_API_KEY|PTSERVIDOR_.*PASSWORD|NEXTCLOUD_.*KEY|client_secret|access_token' deploy/atlas-public/authorial-portals.*; then exit 32; fi
          echo AUTHORIAL_TEXT_LOCK=PASS
          echo SCOPE_LOCK=PASS

      - name: Deterministic post-code tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/ia-milk-public-boundary.test.mjs
          node --check deploy/atlas-public/authorial-portals.js
          for file in deploy/atlas-public/*.js; do node --check "$file"; done
          git diff --check
          grep -Fq '@media(prefers-reduced-motion:reduce)' deploy/atlas-public/authorial-portals.css
          grep -Fq 'focus' deploy/atlas-public/authorial-portals.js
          echo POST_CODE_TESTS=PASS

      - name: Mistral fidelity reviewer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, urllib.request
          diff=subprocess.check_output(['git','diff','--','deploy/atlas-public/authorial-portals.js','deploy/atlas-public/authorial-portals.css'],text=True)
          payload={
            'model':'mistral-medium-latest','temperature':0,
            'response_format':{'type':'json_object'},
            'messages':[
              {'role':'system','content':'És o revisor de fidelidade do Atlas Vivo MILK. Aprova apenas alterações técnicas que preservem integralmente as três mecânicas e textos existentes. Bloqueia invenção, alteração de dramaturgia, genericização, regressão de acessibilidade, fuga de segredo ou alteração de assets. Melhorias permitidas: foco, lifecycle, storage resiliente, clamp de pointer, cleanup, reduced-motion e focus-visible. Responde JSON estrito: pass:boolean, blockers:array, evidence:array.'},
              {'role':'user','content':diff}
            ]
          }
          req=urllib.request.Request('https://api.mistral.ai/v1/chat/completions',data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['MISTRAL_API_KEY'],'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=180) as r: body=json.loads(r.read())
          review=json.loads(body['choices'][0]['message']['content'])
          print('MISTRAL_FIDELITY_REVIEW='+json.dumps(review,ensure_ascii=False))
          if review.get('pass') is not True or review.get('blockers'):
              raise SystemExit('MISTRAL_FIDELITY_BLOCKED')
          print('MISTRAL_FIDELITY_REVIEW=PASS')
          PY

      - name: Commit Code Mistral changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo CODE_MISTRAL_NO_CHANGE=1
            exit 41
          fi
          git config user.name 'Atlas Mistral Code'
          git config user.email 'milk@associacaomilk.pt'
          git add deploy/atlas-public/authorial-portals.js deploy/atlas-public/authorial-portals.css
          git commit -m 'feat(experiences): Mistral Code hardens authorial portal runtime'
          git push origin HEAD:work/copernico-recovery-webapp-20260902
          echo CODE_MISTRAL_COMMIT_PUSHED=1
