name: 16 MILK Mistral Code production

on:
  workflow_dispatch:
  push:
    branches:
      - work/copernico-recovery-webapp-20260902
    paths:
      - .github/workflows/16-mistral-code-experience-production.yml

permissions:
  contents: write

jobs:
  code-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/copernico-recovery-webapp-20260902
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Mistral Vibe Code
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          python -m pip install --disable-pip-version-check --quiet 'mistral-vibe==2.24.5'
          vibe --version

      - name: Execute authorised runtime hardening
        run: |
          set -euo pipefail
          node tests/ia-milk-public-boundary.test.mjs
          node --check deploy/atlas-public/authorial-portals.js
          vibe --trust --max-turns 36 --output json --prompt "EXECUÇÃO AUTORIZADA PELA AUTORA. Lê ops/AUTHORIZATION_RUNTIME_MAINTENANCE_20260902.md e AGENTS.md. Trabalha somente em deploy/atlas-public/authorial-portals.js e deploy/atlas-public/authorial-portals.css. Mantém integralmente textos, dramaturgia, ids, classes, assets e mecânicas existentes. Não inventes curadoria. Faz manutenção técnica real: restaurar foco ao elemento que abriu o dialog; foco inicial só depois de showModal; localStorage resiliente com try/catch; clamp das coordenadas pointer da Galeria; cleanup completo de listeners para fechar/reabrir sem leaks; robustez touch/keyboard; reduced-motion e focus-visible. Edita os ficheiros de verdade. Não toques COPÉRNICO, falARTE, Palavra Ritual, index.html, catálogo, manifestos ou dados." > /tmp/vibe-production.json
          echo VIBE_CODE_EXECUTED=1

      - name: Auto-revert anything outside authorised runtime
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            case "$f" in
              deploy/atlas-public/authorial-portals.js|deploy/atlas-public/authorial-portals.css) ;;
              *) git restore -- "$f" || true ;;
            esac
          done < <(git diff --name-only)
          echo OUT_OF_SCOPE_AUTO_REVERT=PASS

      - name: Test and auto-repair
        run: |
          set -euo pipefail
          if ! node --check deploy/atlas-public/authorial-portals.js || ! node tests/ia-milk-public-boundary.test.mjs || ! git diff --check; then
            vibe --trust --max-turns 20 --output json --prompt "AUTO-REPARO IMEDIATO. Corrige somente authorial-portals.js/css até node --check, public-boundary test e git diff --check passarem. Preserva todo conteúdo autoral e mecânicas." > /tmp/vibe-repair.json || true
          fi
          node --check deploy/atlas-public/authorial-portals.js
          node tests/ia-milk-public-boundary.test.mjs
          git diff --check
          grep -Fq 'Escolhe sem autoridade. Aproxima duas coisas.' deploy/atlas-public/authorial-portals.js
          grep -Fq 'Apanha uma frase pelo rabo. Continua-a.' deploy/atlas-public/authorial-portals.js
          grep -Fq 'somos todos possíveis' deploy/atlas-public/authorial-portals.js
          grep -Fq 'onde arte e afeto são casa e chão' deploy/atlas-public/authorial-portals.js
          echo RUNTIME_TESTS=PASS

      - name: Independent Mistral review
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if git diff --quiet -- deploy/atlas-public/authorial-portals.js deploy/atlas-public/authorial-portals.css; then
            echo NO_SAFE_DELTA_CONTINUE=1
            exit 0
          fi
          python - <<'PY'
          import json, os, subprocess, urllib.request
          diff=subprocess.check_output(['git','diff','--','deploy/atlas-public/authorial-portals.js','deploy/atlas-public/authorial-portals.css'], text=True)
          payload={'model':'mistral-medium-latest','temperature':0,'response_format':{'type':'json_object'},'messages':[{'role':'system','content':'Revê manutenção técnica autorizada do Atlas. Responde JSON com pass e blockers. Bloqueia apenas alteração de texto, mecânica, asset, segredo, sintaxe ou regressão funcional. Melhorias técnicas de foco, storage, listeners, pointer, touch e acessibilidade são autorizadas.'},{'role':'user','content':diff}]}
          req=urllib.request.Request('https://api.mistral.ai/v1/chat/completions',data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['MISTRAL_API_KEY'],'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=180) as r: body=json.loads(r.read())
          review=json.loads(body['choices'][0]['message']['content'])
          print('MISTRAL_REVIEW='+json.dumps(review,ensure_ascii=False))
          if review.get('pass') is not True:
              print('MISTRAL_REVIEW_ADVISORY=REPAIR_REQUIRED')
          else:
              print('MISTRAL_REVIEW=PASS')
          PY

      - name: Commit safe improvement
        run: |
          set -euo pipefail
          if grep -RInE 'MISTRAL_API_KEY|PTSERVIDOR_.*PASSWORD|NEXTCLOUD_.*KEY|client_secret|access_token' deploy/atlas-public/authorial-portals.*; then
            git restore -- deploy/atlas-public/authorial-portals.js deploy/atlas-public/authorial-portals.css
            echo SECRET_PATTERN_AUTO_REVERTED=1
          fi
          if git diff --quiet -- deploy/atlas-public/authorial-portals.js deploy/atlas-public/authorial-portals.css; then
            echo FLOW_CONTINUES_NO_COMMIT=1
            exit 0
          fi
          git config user.name 'Atlas Mistral Code'
          git config user.email 'milk@associacaomilk.pt'
          git add deploy/atlas-public/authorial-portals.js deploy/atlas-public/authorial-portals.css
          git commit -m 'feat(experiences): Mistral Code hardens runtime'
          git push origin HEAD:work/copernico-recovery-webapp-20260902
          echo MISTRAL_CODE_COMMIT_PUSHED=1
