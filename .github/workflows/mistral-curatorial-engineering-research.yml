name: Mistral curatorial engineering research panel

# execution-trigger: 2026-08-17
on:
  push:
    branches:
      - codex/safety-gate-2026-08-10
    paths:
      - "ops/curatorial_engineering_input_2026-08-17.md"
      - "ops/mistral_curatorial_engineering_research.py"
      - ".github/workflows/mistral-curatorial-engineering-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Execute Mistral research + architecture + legal panel
        run: python ops/mistral_curatorial_engineering_research.py
      - name: Upload source-grounded engineering artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atlas-curatorial-engineering-mistral
          path: artifacts/curatorial-engineering
          if-no-files-found: error
          retention-days: 30
