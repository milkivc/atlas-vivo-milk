name: MILK PTServidor private WebApp staging

on:
  workflow_dispatch:
  push:
    branches:
      - work/copernico-recovery-webapp-20260902
    paths:
      - '.github/workflows/ptservidor-private-webapp-staging.yml'

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      PTSERVIDOR_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_FTPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Materialize COPERNICO and public territorial payload
        shell: bash
        run: |
          set -euo pipefail
          test -f deploy/atlas-public/territorios-publicos.json.gz
          test -f deploy/atlas-public/vendor/itowns/itowns.umd.js.gz
          gzip -dc deploy/atlas-public/territorios-publicos.json.gz > deploy/atlas-public/territorios-publicos.json
          gzip -dc deploy/atlas-public/vendor/itowns/itowns.umd.js.gz > deploy/atlas-public/vendor/itowns/itowns.umd.js

      - name: Deterministic internal staging gates
        shell: bash
        run: |
          set -euo pipefail
          node tests/ia-milk-public-boundary.test.mjs
          for f in deploy/atlas-public/*.js; do node --check "$f"; done
          jq -e '.validated == true and .layer == "public" and .projection == "PUBLIC-ONLY"' deploy/atlas-public/territorios-publicos.json >/dev/null
          test "$(sha256sum deploy/atlas-public/vendor/itowns/itowns.umd.js | awk '{print $1}')" = c057f8961908aec71267e4e9770dd7506367e57cecf58cbc3ab8f491903fe288
          test -f specs/curatorial-experience-contract.schema.json
          if grep -RInE 'MISTRAL_API_KEY|PTSERVIDOR_FTPS_PASSWORD|NEXTCLOUD_KEY|client_secret|access_token' deploy/atlas-public --exclude-dir=vendor; then exit 31; fi
          echo 'INTERNAL_STAGING_DETERMINISTIC=PASS'

      - name: Mistral three-agent staging council
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          python - <<'PY'
          import json,os,pathlib,urllib.request
          key=os.environ['MISTRAL_API_KEY']
          files=['AGENTS.md','specs/curatorial-experience-contract.schema.json','deploy/atlas-public/index.html','deploy/atlas-public/atlas.js','deploy/atlas-public/copernico.js','deploy/atlas-public/experience-machine.js','deploy/atlas-public/falarte.js','deploy/atlas-public/palavra-ritual.js','deploy/atlas-public/curadorias.js']
          src='\n\n'.join('FILE '+p+'\n'+pathlib.Path(p).read_text(encoding='utf-8') for p in files if pathlib.Path(p).exists())
          roles={
            'experience_integrity':'Verifica que a WebApp continua experiencial, COPÉRNICO é preservado e nenhuma curadoria é considerada concluída só por descrição/card.',
            'runtime_accessibility':'Verifica teclado/touch/reduced-motion/lifecycle e ausência de regressão evidente.',
            'public_boundary':'Verifica PUBLIC-ONLY, zero segredos, zero Camada Invisível reversível e material NÃO PUBLICAR ausente.'
          }
          failures=[]
          for role,rule in roles.items():
              payload={'model':'mistral-medium-latest','temperature':0,'response_format':{'type':'json_object'},'messages':[{'role':'system','content':f'És {role} do Atlas Vivo MILK. {rule} Responde JSON com pass:boolean, blockers:array, evidence:array.'},{'role':'user','content':src}]}
              req=urllib.request.Request('https://api.mistral.ai/v1/chat/completions',data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=240) as r: body=json.loads(r.read())
              review=json.loads(body['choices'][0]['message']['content'])
              print('MISTRAL_STAGE_REVIEW='+json.dumps({'role':role,**review},ensure_ascii=False))
              if review.get('pass') is not True or review.get('blockers'): failures.append(role)
          if failures: raise SystemExit('MISTRAL_INTERNAL_STAGING_BLOCKED='+','.join(failures))
          print('MISTRAL_INTERNAL_STAGING_COUNCIL=PASS_3')
          PY

      - name: Build deterministic private staging archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,io,os,pathlib,tarfile,json
          root=pathlib.Path('deploy/atlas-public')
          files=sorted(p for p in root.rglob('*') if p.is_file() and not p.name.endswith('.gz'))
          buf=io.BytesIO()
          with tarfile.open(fileobj=buf,mode='w:gz',format=tarfile.PAX_FORMAT) as tf:
              for p in files:
                  info=tf.gettarinfo(str(p),arcname=p.relative_to(root).as_posix())
                  info.uid=info.gid=0; info.uname=info.gname=''; info.mtime=0
                  with p.open('rb') as fh: tf.addfile(info,fh)
          payload=buf.getvalue(); digest=hashlib.sha256(payload).hexdigest()
          pathlib.Path('/tmp/atlas-webapp-internal.tar.gz').write_bytes(payload)
          pathlib.Path('/tmp/atlas-webapp-internal.sha256').write_text(digest+'  atlas-webapp-internal.tar.gz\n',encoding='utf-8')
          receipt={'sha':os.environ['GITHUB_SHA'],'archive_sha256':digest,'files':len(files),'public_only':True,'purpose':'internal_ptservidor_staging'}
          pathlib.Path('/tmp/atlas-webapp-internal-receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2),encoding='utf-8')
          print(f'INTERNAL_ARCHIVE_READY files={len(files)} sha256={digest}')
          PY

      - name: Upload to private PTServidor staging via migration FTPS and verify readback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ftplib,hashlib,io,os,pathlib,ssl
          password=os.environ['PTSERVIDOR_FTPS_PASSWORD'].strip()
          if not password: raise SystemExit('PTSERVIDOR_FTPS_PASSWORD_MISSING')
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=90)
          ftp.connect('troi.ptservidor.net',21); ftp.login('migration@associacaomilk.pt',password); ftp.prot_p()
          dest='ATLAS_WEBAPP_INTERNAL_TESTS/'+os.environ['GITHUB_SHA']
          ftp.cwd('/')
          for part in dest.split('/'):
              try: ftp.mkd(part)
              except ftplib.all_errors: pass
              ftp.cwd(part)
          for local in ('/tmp/atlas-webapp-internal.tar.gz','/tmp/atlas-webapp-internal.sha256','/tmp/atlas-webapp-internal-receipt.json'):
              p=pathlib.Path(local); data=p.read_bytes(); ftp.storbinary('STOR '+p.name,io.BytesIO(data),blocksize=1048576)
              got=bytearray(); ftp.retrbinary('RETR '+p.name,got.extend,blocksize=1048576)
              if hashlib.sha256(bytes(got)).digest()!=hashlib.sha256(data).digest(): raise SystemExit('PRIVATE_STAGE_READBACK_MISMATCH:'+p.name)
          here=ftp.pwd(); ftp.quit()
          print('PTSERVIDOR_PRIVATE_WEBAPP_STAGING=PASS')
          print('PTSERVIDOR_PRIVATE_STAGE_PATH='+here)
          print('PRODUCTION_WRITES=0')
          PY

