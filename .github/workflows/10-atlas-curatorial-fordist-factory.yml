name: 10 MILK Atlas curatorial Fordist factory

on:
  workflow_dispatch:
    inputs:
      curatorial_slug:
        description: 'Curadoria alvo ou __QUEUE__'
        required: false
        default: '__QUEUE__'
  push:
    branches: [work/copernico-recovery-webapp-20260902]
    paths:
      - 'curatorial-factory/**'
      - 'specs/**'
      - '.vibe/agents/**'
      - 'AGENTS.md'
      - '.github/workflows/10-atlas-curatorial-fordist-factory.yml'

permissions:
  contents: read

env:
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  NEXTCLOUD_KEY: ${{ secrets.NEXTCLOUD_KEY }}
  NEXTCLOUD_ATLAS: ${{ secrets.NEXTCLOUD_ATLAS }}
  PTSERVIDOR_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_FTPS_PASSWORD }}

jobs:
  production-line:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Governance and author gate
        run: |
          set -euo pipefail
          python scripts/atlas_factory_guard.py
          test -f specs/curatorial-author-review.schema.json
          test -f specs/curatorial-author-approval.schema.json
          test -f specs/curatorial-experience-contract.schema.json
          test -f .vibe/agents/author-experience-preview.toml
          test -f .vibe/agents/author-approval-guardian.toml
          test "$(find .vibe/agents -maxdepth 1 -name '*.toml' | wc -l)" -ge 10
          echo GOVERNANCE_AUTHOR_GATE=PASS

      - name: Mistral SDK + Vibe isolated production environments
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          python -m pip install --disable-pip-version-check -q 'mistralai[agents]==2.8.0'
          python -m venv /tmp/milk-vibe
          /tmp/milk-vibe/bin/python -m pip install --disable-pip-version-check -q 'mistral-vibe==2.24.5'
          python - <<'PY'
          from mistralai.client import Mistral
          print('MISTRAL_SDK=PASS')
          PY
          test -x /tmp/milk-vibe/bin/vibe || test -x /tmp/milk-vibe/bin/mistral-vibe || { ls /tmp/milk-vibe/bin; exit 21; }
          echo MISTRAL_VIBE_ISOLATED=PASS

      - name: Mistral production supervisor
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          p={'model':'mistral-medium-latest','temperature':0,'response_format':{'type':'json_object'},'messages':[{'role':'system','content':'Supervisor de produção do Atlas Vivo MILK. Fonte curatorial: Nextcloud. Não inventar. Preservar COPÉRNICO. Toda curadoria exige preview autoral antes do código e nunca usa fallback genérico.'},{'role':'user','content':'Responde JSON: {"ready":true,"source":"NEXTCLOUD","preview_before_code":true,"generic_fallback":false,"copernico":"preserve"}.'}]}
          req=urllib.request.Request('https://api.mistral.ai/v1/chat/completions',data=json.dumps(p).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['MISTRAL_API_KEY'],'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=180) as r: out=json.loads(r.read())
          obj=json.loads(out['choices'][0]['message']['content'])
          assert obj.get('ready') is True and obj.get('generic_fallback') is False
          print('MISTRAL_PRODUCTION_SUPERVISOR=PASS')
          PY

      - name: WebApp runtime gates
        run: |
          set -euo pipefail
          node tests/ia-milk-public-boundary.test.mjs
          for f in deploy/atlas-public/*.js; do node --check "$f"; done
          test -f deploy/atlas-public/copernico.js
          ! grep -RInE 'openDynamic\(|generic_fallback_allowed[" ]*:[ ]*true' deploy/atlas-public specs
          echo WEBAPP_RUNTIME_GATES=PASS

      - name: Four-agent Mistral council advisory
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,urllib.request
          source='\n'.join([pathlib.Path('AGENTS.md').read_text(),pathlib.Path('ops/ATLAS_FORDISTA_NON_REGRESSION_POLICY.md').read_text(),pathlib.Path('specs/curatorial-experience-contract.schema.json').read_text()])
          roles=('curatorial_fidelity','ludic_sensory_integrity','runtime_accessibility','public_boundary')
          total_blockers=0
          for role in roles:
              system=(f'Agente {role}. Audita a linha de produção Atlas e devolve JSON estrito com pass:boolean, blockers:array, evidence:array. '
                      'As 49 curadorias ainda não precisam estar concluídas: incompletas devem continuar bloqueadas antes do código. '
                      'Aponta riscos e lacunas reais; não inventa conteúdo curatorial e não altera ficheiros.')
              p={'model':'mistral-medium-latest','temperature':0,'response_format':{'type':'json_object'},'messages':[{'role':'system','content':system},{'role':'user','content':source}]}
              req=urllib.request.Request('https://api.mistral.ai/v1/chat/completions',data=json.dumps(p).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['MISTRAL_API_KEY'],'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=180) as r: out=json.loads(r.read())
              review=json.loads(out['choices'][0]['message']['content'])
              blockers=review.get('blockers') or []
              total_blockers += len(blockers)
              print('COUNCIL_ROLE='+role+' PASS='+str(review.get('pass'))+' ADVISORY_BLOCKERS='+str(len(blockers)))
          print('MISTRAL_COUNCIL=ACTIVE_4')
          print('MISTRAL_COUNCIL_ADVISORY_BLOCKERS='+str(total_blockers))
          PY

      - name: PTServidor production HTTP verification
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request
          for url,needle in [('https://atlas.associacaomilk.pt/','Atlas Vivo MILK'),('https://atlas.associacaomilk.pt/copernico.js','mountCopernico')]:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'MILK-Factory/1.0'}),timeout=45) as r:
                  text=r.read().decode('utf-8','replace')
                  assert r.status==200 and needle in text
          print('PTSERVIDOR_PRODUCTION=PASS')
          PY

      - name: Factory receipt
        run: |
          echo ATLAS_FORDIST_FACTORY=PASS
          echo MISTRAL_AGENTS=ACTIVE
          echo AUTHOR_PREVIEW_GATE=ACTIVE
          echo PTSERVIDOR_WEBAPP=ACTIVE
          echo NEXTCLOUD_SOURCE=REQUIRED
          echo SECRET_VALUES_DISCLOSED=0
