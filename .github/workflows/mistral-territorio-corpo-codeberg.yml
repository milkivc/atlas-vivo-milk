name: MILK Mistral — Território do Corpo → Codeberg

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milk-territorio-corpo-codeberg
  cancel-in-progress: false

jobs:
  hold-for-publication-boundary-review:
    runs-on: ubuntu-latest
    steps:
      - name: Hold public mirror while allowlist is prepared
        run: |
          echo "PUBLIC_CODEBERG_EXPORT_HELD_FOR_ALLOWLIST_REVIEW"
          echo "No Git refs are pushed by this temporary gate."
