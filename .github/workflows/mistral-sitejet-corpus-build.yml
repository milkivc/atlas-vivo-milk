name: MILK Mistral Canonical Opening Fix

on:
  push:
    branches:
      - work/mistral-sitejet-orchestration-20260902
    paths:
      - '.vibe/agents/atlas-opening-fix.toml'
      - '.vibe/prompts/atlas-opening-fix.md'
      - 'docs/agent-input/OPENING_CANONICAL_LOCK.md'
      - '.github/workflows/mistral-sitejet-corpus-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milk-mistral-canonical-opening-fix
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/mistral-sitejet-orchestration-20260902
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Canonical source gate
        shell: bash
        run: |
          set -euo pipefail
          test -f .vibe/agents/atlas-opening-fix.toml
          test -f .vibe/prompts/atlas-opening-fix.md
          test -f docs/agent-input/OPENING_CANONICAL_LOCK.md
          test -f docs/ATLAS_CAMADA_PUBLICA_EXPERIENCIA_CANONICA_20260829.md
          test -f deploy/atlas-public/public-runtime-config.json
          test -f deploy/atlas-public/experience-machine.js
          test -f deploy/atlas-public/index.html
          test -f deploy/atlas-public/atlas.js
          node --check deploy/atlas-public/experience-machine.js
          node --check deploy/atlas-public/atlas.js
          node --test tests/ia-milk-public-boundary.test.mjs
          echo 'CANONICAL_OPENING_SOURCE_GATE=OK'

      - name: PTServidor Sitejet read-only readiness
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${CPANEL_API_TOKEN:-${CPANEL_TOKEN:-}}"
          USER="${CPANEL_USER:-associ16}"
          HOST="${CPANEL_HOST:-troi.ptservidor.net}"
          if [ -z "$TOKEN" ]; then
            echo 'CPANEL_SITEJET_READINESS=BLOCKED_NO_API_TOKEN'
            exit 0
          fi
          echo '::add-mask::'$TOKEN
          STATUS="$(curl -sS --max-time 25 -o /tmp/sitejet-info.json -w '%{http_code}' -H "Authorization: cpanel ${USER}:${TOKEN}" "https://${HOST}:2083/execute/Sitejet/get_all_user_sitejet_info?domain=atlas.associacaomilk.pt" || true)"
          echo "CPANEL_SITEJET_INFO_HTTP=$STATUS"
          test "$STATUS" = "200" || exit 0
          python - <<'PY'
          import json
          d=json.load(open('/tmp/sitejet-info.json',encoding='utf-8'))
          r=d.get('result') or {}
          rows=r.get('data') or []
          print('SITEJET_ATLAS_RECORDS='+str(len(rows) if isinstance(rows,list) else 0))
          print('SITEJET_API_ERRORS='+('YES' if r.get('errors') else 'NO'))
          PY

      - name: Install Mistral Vibe Code
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          python -m pip install --disable-pip-version-check mistral-vibe
          vibe --version
          export VIBE_HOME="$RUNNER_TEMP/vibe-home"
          mkdir -p "$VIBE_HOME/prompts"
          cp .vibe/prompts/*.md "$VIBE_HOME/prompts/"
          echo "VIBE_HOME=$VIBE_HOME" >> "$GITHUB_ENV"

      - name: Mistral Code attempts PRETO SELO TOQUE implementation
        shell: bash
        run: |
          set -u
          set +e
          vibe --trust --agent atlas-opening-fix \
            --prompt "Executa agora exactamente a missão definida no system prompt. Não explores o repositório. Lê apenas OPENING_CANONICAL_LOCK e os quatro ficheiros públicos indicados, implementa, testa e termina." \
            --max-turns 20 --output json > /tmp/mistral-opening.json
          RC=$?
          set -e
          echo "MISTRAL_VIBE_RC=$RC"
          test -s /tmp/mistral-opening.json && echo "MISTRAL_VIBE_OUTPUT_BYTES=$(wc -c < /tmp/mistral-opening.json)" || true
          echo "MISTRAL_VIBE_CHANGED_FILES=$(git diff --name-only | wc -l)"
          exit 0

      - name: Canonical deterministic materializer if Code emitted no delta
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            echo 'OPENING_MATERIALIZER=VIBE_DELTA_PRESENT'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          machine=Path('deploy/atlas-public/experience-machine.js')
          s=machine.read_text(encoding='utf-8')
          s=s.replace("const PUBLIC_STATES = Object.freeze({\n  COSMICOXES: 'cosmicoxes',", "const PUBLIC_STATES = Object.freeze({\n  PRETO: 'preto',\n  SELO: 'selo',\n  COSMICOXES: 'cosmicoxes',", 1)
          s=s.replace("const TRANSITIONS = Object.freeze({\n  [PUBLIC_STATES.COSMICOXES]", "const TRANSITIONS = Object.freeze({\n  [PUBLIC_STATES.PRETO]: new Set(['reveal_seal']),\n  [PUBLIC_STATES.SELO]: new Set(['touch']),\n  [PUBLIC_STATES.COSMICOXES]", 1)
          s=s.replace("const NEXT = Object.freeze({\n  [`${PUBLIC_STATES.COSMICOXES}:gesture`]", "const NEXT = Object.freeze({\n  [`${PUBLIC_STATES.PRETO}:reveal_seal`]: PUBLIC_STATES.SELO,\n  [`${PUBLIC_STATES.SELO}:touch`]: PUBLIC_STATES.COSMICOXES,\n\n  [`${PUBLIC_STATES.COSMICOXES}:gesture`]", 1)
          s=s.replace("  #state = PUBLIC_STATES.COSMICOXES;", "  #state = PUBLIC_STATES.PRETO;", 1)
          machine.write_text(s,encoding='utf-8')

          index=Path('deploy/atlas-public/index.html')
          s=index.read_text(encoding='utf-8')
          old='<body><a class="skip" href="#atlas">Saltar para o Atlas</a><canvas id="cosmos" aria-hidden="true"></canvas>'
          new='<body><a class="skip" href="#atlas">Saltar para o Atlas</a><div id="prelude" class="prelude"><button id="atlasSeal" class="atlas-seal" type="button" aria-label="Entrar no Atlas" hidden><img src="assets/selo-atlas.png" alt=""></button></div><canvas id="cosmos" aria-hidden="true" hidden></canvas>'
          if old not in s: raise SystemExit('INDEX_PRELUDE_ANCHOR_NOT_FOUND')
          s=s.replace(old,new,1)
          old='<main id="atlas"><section id="opening" class="opening" aria-labelledby="opening-title">'
          new='<main id="atlas"><section id="opening" class="opening" aria-labelledby="opening-title" hidden>'
          if old not in s: raise SystemExit('INDEX_OPENING_ANCHOR_NOT_FOUND')
          s=s.replace(old,new,1)
          index.write_text(s,encoding='utf-8')

          atlas=Path('deploy/atlas-public/atlas.js')
          s=atlas.read_text(encoding='utf-8')
          old="const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;\nconst opening = document.querySelector('#opening');"
          new="const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;\nconst prelude = document.querySelector('#prelude');\nconst atlasSeal = document.querySelector('#atlasSeal');\nconst cosmos = document.querySelector('#cosmos');\nconst opening = document.querySelector('#opening');"
          if old not in s: raise SystemExit('ATLAS_CONST_ANCHOR_NOT_FOUND')
          s=s.replace(old,new,1)
          anchor="const wait = ms => new Promise(resolve => setTimeout(resolve, reduced ? 0 : ms));\n\n"
          insert="""const wait = ms => new Promise(resolve => setTimeout(resolve, reduced ? 0 : ms));

async function revealSeal() {
  await wait(520);
  if (!experience.send('reveal_seal')) return;
  atlasSeal.hidden = false;
}

async function activateSeal() {
  if (atlasSeal.disabled || experience.state !== PUBLIC_STATES.SELO) return;
  atlasSeal.disabled = true;
  if (!experience.send('touch')) {
    atlasSeal.disabled = false;
    return;
  }
  prelude.classList.add('leaving');
  await wait(360);
  prelude.hidden = true;
  cosmos.hidden = false;
  opening.hidden = false;
  enter.focus({preventScroll: true});
}

atlasSeal.addEventListener('click', activateSeal);
requestAnimationFrame(() => revealSeal());

"""
          if anchor not in s: raise SystemExit('ATLAS_WAIT_ANCHOR_NOT_FOUND')
          s=s.replace(anchor,insert,1)
          atlas.write_text(s,encoding='utf-8')

          styles=Path('deploy/atlas-public/styles.css')
          s=styles.read_text(encoding='utf-8')
          block="""

/* Limiar canónico da abertura: PRETO → SELO → TOQUE → COSMICOXES. */
.prelude{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#000;transition:opacity .36s ease}
.prelude.leaving{opacity:0;pointer-events:none}
.atlas-seal{width:clamp(76px,14vw,150px);aspect-ratio:1;border:0;padding:0;background:transparent;opacity:.2;cursor:pointer;filter:drop-shadow(0 0 16px #fff2);transition:opacity .35s ease,filter .35s ease,transform .35s ease}
.atlas-seal img{display:block;width:100%;height:100%;object-fit:contain}
.atlas-seal:hover,.atlas-seal:focus-visible{opacity:.72;filter:drop-shadow(0 0 28px #fff5);transform:scale(1.025)}
@media(prefers-reduced-motion:reduce){.prelude,.atlas-seal{transition:none!important}}
"""
          if 'Limiar canónico da abertura: PRETO' not in s:
              s += block
          styles.write_text(s,encoding='utf-8')
          print('OPENING_MATERIALIZER=CANONICAL_FALLBACK_APPLIED')
          PY

      - name: Deterministic opening non-regression gate
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          test -n "$CHANGED" || { echo '::error::No opening delta'; exit 20; }
          while IFS= read -r f; do
            case "$f" in
              deploy/atlas-public/experience-machine.js|deploy/atlas-public/index.html|deploy/atlas-public/atlas.js|deploy/atlas-public/styles.css|tests/*) ;;
              *) echo "::error::Forbidden changed path: $f"; exit 21;;
            esac
          done <<< "$CHANGED"
          COUNT="$(printf '%s\n' "$CHANGED" | sed '/^$/d' | wc -l)"
          test "$COUNT" -le 4 || { echo "::error::Too many changed files: $COUNT"; exit 22; }
          node --check deploy/atlas-public/experience-machine.js
          node --check deploy/atlas-public/atlas.js
          node --test tests/ia-milk-public-boundary.test.mjs
          grep -Fq "PRETO: 'preto'" deploy/atlas-public/experience-machine.js
          grep -Fq "SELO: 'selo'" deploy/atlas-public/experience-machine.js
          grep -Fq "#state = PUBLIC_STATES.PRETO" deploy/atlas-public/experience-machine.js
          grep -Fq 'selo-atlas.png' deploy/atlas-public/index.html
          grep -Fq 'id="atlasSeal"' deploy/atlas-public/index.html
          grep -Fq 'prefers-reduced-motion' deploy/atlas-public/atlas.js
          grep -Fq 'brincar' deploy/atlas-public/experience-machine.js
          grep -Fq 'convite' deploy/atlas-public/experience-machine.js
          grep -Fq 'tentar_a_sorte' deploy/atlas-public/experience-machine.js
          git diff --check
          git diff > /tmp/opening.diff
          test -s /tmp/opening.diff
          echo 'CANONICAL_OPENING_NON_REGRESSION=OK'

      - name: Three independent Mistral evidence reviews
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, urllib.request
          key=os.environ['MISTRAL_API_KEY'].strip()
          diff=pathlib.Path('/tmp/opening.diff').read_text(encoding='utf-8')
          lock=pathlib.Path('docs/agent-input/OPENING_CANONICAL_LOCK.md').read_text(encoding='utf-8')
          roles=[
            ('opening_dramaturgy','Confirma PRETO → SELO → TOQUE antes de COSMICOXES e ausência de onboarding/menu/header visual na entrada.'),
            ('runtime_accessibility','Confirma activação por teclado/pointer/touch, foco utilizável e reduced-motion sem apagar significado.'),
            ('public_boundary','Confirma ausência de dados, segredos, camada não pública, publicação ou conteúdo inventado.')]
          failed=[]
          for role,scope in roles:
              payload={'model':'mistral-medium-latest','temperature':0.0,'response_format':{'type':'json_object'},'messages':[
                {'role':'system','content':f'És o revisor Mistral {role} da MILK. {scope} Só bloqueias com evidência literal no DIFF ligada à fonte. Responde JSON estrito com pass(boolean), blockers(array), checks(array).'},
                {'role':'user','content':'FONTE BLOQUEADA:\n'+lock+'\n\nDIFF EXACTO:\n'+diff}]}
              req=urllib.request.Request('https://api.mistral.ai/v1/chat/completions',data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=240) as r: body=json.loads(r.read())
              review=json.loads(body['choices'][0]['message']['content'])
              print('MISTRAL_OPENING_REVIEW='+json.dumps({'role':role,**review},ensure_ascii=False))
              if review.get('pass') is not True or (review.get('blockers') or []): failed.append(role)
          if failed: raise SystemExit('MISTRAL_OPENING_BLOCKED='+','.join(failed))
          print('MISTRAL_OPENING_REVIEWS=3_OK')
          PY

      - name: Commit validated opening delta to work branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Associação MILK - Mistral Vibe Code'
          git config user.email 'milk@associacaomilk.pt'
          git add deploy/atlas-public tests
          git commit -m 'feat(atlas): materialize canonical preto selo toque opening'
          git push origin HEAD:work/mistral-sitejet-orchestration-20260902
          echo "MISTRAL_OPENING_COMMIT=$(git rev-parse HEAD)"
          echo 'PRODUCTION_PUBLISH=NO'
