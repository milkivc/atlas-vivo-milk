name: Semantic Guard Regression Tests

on:
  push:
    branches:
      - work/semantic-guard-production-20260822
    paths:
      - 'src/guardrails/**'
      - 'tests/test_guarda_costas_semantico_milk.py'
      - '.github/workflows/semantic-guard-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile
        run: python -m py_compile src/guardrails/guarda_costas_semantico_milk.py tests/test_guarda_costas_semantico_milk.py
      - name: Regression suite
        run: pytest -q tests/test_guarda_costas_semantico_milk.py
