name: MILK Curatorial Runtime Audit

on:
  push:
    branches: [work/copernico-recovery-webapp-20260902]
    paths:
      - 'deploy/atlas-public/falarte.js'
      - 'deploy/atlas-public/falarte.css'
      - 'deploy/atlas-public/palavra-ritual.js'
      - 'deploy/atlas-public/palavra-ritual.css'
      - 'deploy/atlas-public/curadorias.js'
      - '.github/workflows/curatorial-runtime-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check deploy/atlas-public/falarte.js
          node --check deploy/atlas-public/palavra-ritual.js
          node --check deploy/atlas-public/curadorias.js
          echo 'CURATORIAL_JS_SYNTAX=PASS'

      - name: Deterministic source, privacy and accessibility gates
        run: |
          set -euo pipefail
          files='deploy/atlas-public/falarte.js deploy/atlas-public/palavra-ritual.js'

          if grep -REn 'https?://|MISTRAL_API_KEY|PTSERVIDOR|contacto_organizador|convite_organizadores_interno|client_secret|access_token' $files; then
            echo '::error::PRIVATE_OR_EXTERNAL_RUNTIME_REFERENCE'
            exit 21
          fi
          echo 'GATE_PUBLIC_BOUNDARY=PASS'

          test "$(grep -c "^    id: '" deploy/atlas-public/falarte.js)" -eq 10
          grep -Fq "id: 'lugar-escondido'" deploy/atlas-public/falarte.js
          grep -Fq "id: 'remetente-ausente'" deploy/atlas-public/falarte.js
          echo 'GATE_FALARTE_10_MECHANICS=PASS'

          grep -Fq 'persistableFieldIds' deploy/atlas-public/falarte.js
          grep -Fq "field.type !== 'file'" deploy/atlas-public/falarte.js
          grep -Fq 'sanitizeDraft' deploy/atlas-public/falarte.js
          grep -Fq 'localStorage' deploy/atlas-public/falarte.js
          echo 'GATE_FALARTE_TEXT_DRAFT_FILE_EXCLUSION=PASS'

          grep -Fiq 'não envia a carta ao espaço, a destinatário ou pela rede' deploy/atlas-public/falarte.js
          grep -Fiq 'não existe envio externo activo' deploy/atlas-public/falarte.js
          echo 'GATE_REMETENTE_LOCAL_ONLY=PASS'

          grep -Fq 'ArrowLeft' deploy/atlas-public/falarte.js
          grep -Fq 'ArrowRight' deploy/atlas-public/falarte.js
          grep -Fq "event.key === 'Home'" deploy/atlas-public/falarte.js
          grep -Fq "event.key === 'End'" deploy/atlas-public/falarte.js
          grep -Fq "aria-live" deploy/atlas-public/falarte.js
          echo 'GATE_FALARTE_KEYBOARD_STATUS=PASS'

          grep -Fq 'data-original-word' deploy/atlas-public/palavra-ritual.js || grep -Fq 'dataset.originalWord' deploy/atlas-public/palavra-ritual.js
          grep -Fq 'preserveOriginalWord' deploy/atlas-public/palavra-ritual.js
          grep -Fq 'textContent' deploy/atlas-public/palavra-ritual.js
          grep -Fq 'ArrowLeft' deploy/atlas-public/palavra-ritual.js
          grep -Fq 'ArrowRight' deploy/atlas-public/palavra-ritual.js
          grep -Fq 'ArrowUp' deploy/atlas-public/palavra-ritual.js
          grep -Fq 'ArrowDown' deploy/atlas-public/palavra-ritual.js
          grep -Fq 'aria-live' deploy/atlas-public/palavra-ritual.js
          grep -Fq 'nada escrito aqui é guardado ou enviado' deploy/atlas-public/palavra-ritual.js
          ! grep -Fq 'localStorage' deploy/atlas-public/palavra-ritual.js
          ! grep -Fq 'sessionStorage' deploy/atlas-public/palavra-ritual.js
          echo 'GATE_PALAVRA_WORD_INVARIANT_PRIVACY=PASS'

          grep -Fq 'openFalarte' deploy/atlas-public/curadorias.js
          grep -Fq 'openPalavraRitual' deploy/atlas-public/curadorias.js
          grep -Fq "item.id === 'falarte'" deploy/atlas-public/curadorias.js
          grep -Fq "item.id === 'palavra-ritual'" deploy/atlas-public/curadorias.js
          echo 'GATE_CURATORIAL_BINDINGS=PASS'

          echo 'CURATORIAL_DETERMINISTIC_GATES=PASS'

      - name: Three-agent Mistral evidence council
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          python - <<'PY'
          import json, os, pathlib, urllib.request
          key = os.environ['MISTRAL_API_KEY'].strip()
          paths = [
              'deploy/atlas-public/falarte.js',
              'deploy/atlas-public/falarte.css',
              'deploy/atlas-public/palavra-ritual.js',
              'deploy/atlas-public/palavra-ritual.css',
              'deploy/atlas-public/curadorias.js',
          ]
          code = '\n\n'.join(f'FILE {p}\n' + pathlib.Path(p).read_text(encoding='utf-8') for p in paths)
          source = '''BINDING CONTRACT. FALArte has exactly ten documented mechanics. Textual drafts MAY be stored in localStorage on the user's device. File inputs, file names, blobs, paths and file metadata MUST NOT be persisted. There is no network submission endpoint. Remetente Ausente is a symbolic local visual transformation and explicitly does not send to space, a recipient or the network. Palavra Ritual MUST store/transmit no user text and MUST preserve each original word literally while changing only visual/spatial state. Keyboard operation, status announcements and reduced motion are required. Public code must not expose private/internal material.'''
          roles = {
              'source_fidelity': 'Check literal correspondence to the binding contract and the ten distinct mechanics.',
              'accessibility_privacy': 'Check keyboard/status/reduced-motion and distinguish permitted textual localStorage drafts from forbidden file persistence or network transmission.',
              'experience_quality': 'Check distinct experiential grammar, explicit local-only Remetente Ausente, and literal word-preservation invariant in Palavra Ritual.'
          }
          reviews=[]
          for role, rule in roles.items():
              payload={
                  'model':'mistral-medium-latest',
                  'temperature':0.0,
                  'response_format':{'type':'json_object'},
                  'messages':[
                      {'role':'system','content':f'You are MILK auditor {role}. {rule} Return strict JSON with pass:boolean, blockers:array, evidence:array, tests:array. A blocker is advisory evidence only; never invent behaviour not shown by literal code.'},
                      {'role':'user','content':source+'\n\nCANDIDATE CODE\n'+code}
                  ]
              }
              req=urllib.request.Request('https://api.mistral.ai/v1/chat/completions', data=json.dumps(payload).encode(), method='POST', headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})
              with urllib.request.urlopen(req, timeout=240) as response:
                  body=json.loads(response.read())
              review=json.loads(body['choices'][0]['message']['content'])
              reviews.append({'role':role,**review})
              print('MISTRAL_CURATORIAL_AUDIT='+json.dumps({'role':role,**review},ensure_ascii=False))
          print('MISTRAL_CURATORIAL_COUNCIL_EXECUTED=3')
          print('MISTRAL_ADVISORY_BLOCKERS='+json.dumps({r['role']:r.get('blockers',[]) for r in reviews},ensure_ascii=False))
          PY

      - name: Final authority
        run: |
          set -euo pipefail
          echo 'CURATORIAL_RUNTIME_AUDIT=PASS'
          echo 'AUTHORITY=DETERMINISTIC_GATES_WITH_MISTRAL_ADVISORY_EVIDENCE'
