name: 21 Atlas dedicated FTPS read-only probe

on:
  workflow_dispatch:
  push:
    branches: [work/copernico-recovery-webapp-20260902]
    paths:
      - '.github/workflows/21-atlas-ftps-credential-readonly-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ATLAS_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_ATLAS_FTPS_PASSWORD }}
    steps:
      - name: Authenticate dedicated Atlas FTPS account without writes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ATLAS_FTPS_PASSWORD"
          python - <<'PY'
          import ftplib, os, ssl
          pwd=os.environ['ATLAS_FTPS_PASSWORD']
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=60)
          ftp.connect('troi.ptservidor.net', 21)
          ftp.login('atlas@associacaomilk.pt', pwd)
          ftp.prot_p()
          print('ATLAS_FTPS_AUTH=PASS')
          print('ATLAS_FTPS_PWD='+ftp.pwd())
          try:
              names=ftp.nlst()
              print('ATLAS_FTPS_READ=PASS')
              print('ATLAS_FTPS_VISIBLE_ENTRIES='+str(len(names)))
          except Exception as exc:
              print('ATLAS_FTPS_READ=LIMITED:'+type(exc).__name__)
          ftp.quit()
          PY
