name: MILK Vibe Code — Atlas P0 guarded build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/milk-curadorias-ia-webapp-20260821
    paths:
      - '.vibe/agents/atlas-build-p0.toml'
      - '.vibe/prompts/atlas-build-p0.md'
      - '.github/workflows/mistral-vibe-code-atlas-p0.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: milk-vibe-code-atlas-p0
  cancel-in-progress: false

jobs:
  build-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      PTSERVIDOR_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_FTPS_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: codex/milk-curadorias-ia-webapp-20260821

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baseline and invariants
        run: |
          set -euo pipefail
          cp deploy/atlas-public/app.js /tmp/app-before.js
          (cd deploy/atlas-public && sha256sum -c manifest.sha256)
          node --check deploy/atlas-public/app.js
          python - <<'PY'
          import json, pathlib
          c=json.loads(pathlib.Path('deploy/atlas-public/catalogo-curatorial.json').read_text(encoding='utf-8'))
          assert len(c['entradas']) == 49
          assert [x['ordem'] for x in c['entradas']] == list(range(1,50))
          PY

      - name: Install Mistral Vibe Code
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check mistral-vibe
          vibe --version

      - name: Vibe Code constructs the P0 candidate
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          vibe --trust \
            --prompt "Lê AGENTS.md, .vibe/prompts/atlas-build-p0.md e deploy/atlas-public/app.js. Implementa exactamente as duas melhorias técnicas definidas no prompt do projecto. Altera SOMENTE deploy/atlas-public/app.js. Não alteres texto curatorial, D, BOOK_FACES, motores, catálogo, HTML, CSS ou assets. Não publiques, não cries PR, não faças commit." \
            --max-turns 18 --output json > /tmp/vibe-p0-output.json
          test -s /tmp/vibe-p0-output.json

      - name: Deterministic hard gates
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "deploy/atlas-public/app.js" || { echo "::error::Forbidden changed files: $changed"; exit 20; }
          node --check deploy/atlas-public/app.js
          git diff --unified=0 -- deploy/atlas-public/app.js > /tmp/atlas-p0.diff
          test -s /tmp/atlas-p0.diff
          echo "P0_DIFF_BYTES=$(wc -c < /tmp/atlas-p0.diff)"
          cat /tmp/atlas-p0.diff
          grep -Fq 'document.hidden' deploy/atlas-public/app.js
          grep -Fq 'visibilitychange' deploy/atlas-public/app.js
          grep -Eq '\.close\(' deploy/atlas-public/app.js
          for text in 'Inventário do Meu Mundo' 'Catástrofe Produtiva' 'O Ponto de Kusama' 'O Corpo que Percebe' 'Escutar o Silêncio' 'O Rizoma Interior' 'O Cubo Interior'; do
            grep -Fq "$text" deploy/atlas-public/app.js
          done
          if grep -E '^[+-].*(Inventário do Meu Mundo|Catástrofe Produtiva|O Ponto de Kusama|O Corpo que Percebe|Escutar o Silêncio|O Rizoma Interior|O Cubo Interior|BOOK_FACES|const D=)' /tmp/atlas-p0.diff; then
            echo '::error::Curatorial invariant touched'; exit 22
          fi

      - name: Three Mistral agents review exact delta with evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, urllib.request
          key=os.environ['MISTRAL_API_KEY'].strip()
          diff=pathlib.Path('/tmp/atlas-p0.diff').read_text(encoding='utf-8')
          app=pathlib.Path('deploy/atlas-public/app.js').read_text(encoding='utf-8')
          roles=[
            ('regression_guard','Bloqueia mudança curatorial, dados, rede, armazenamento ou alteração funcional dos sete motores.'),
            ('browser_runtime','Analisa apenas lifecycle RAF/Page Visibility e AudioContext. Procura corridas reais, impossibilidade de retomar, loops duplicados e close/recreate inválidos. Cosmos e stopMedia têm lifecycles diferentes; não exijas que stopMedia pare o Cosmos.'),
            ('accessibility_performance','Confirma redução de trabalho em background sem contrariar o botão manual de movimento nem degradar a experiência.')
          ]
          reviews=[]
          evidence_rule=(
            'REGRAS DE EVIDÊNCIA: cada blocker deve citar literalmente uma linha ADICIONADA do diff que o prova. '
            'Não declares ausente uma guarda que esteja visível no código. Em JavaScript, uma callback RAF executa até ao fim sem outro evento intercalar: '
            'zerar o ID no início da callback que acabou de disparar e agendar o próximo RAF no fim é um padrão válido quando a função de agendamento impede novo RAF se o ID já for não-zero. '
            'Não inventes requisitos fora do objectivo autorizado. Se não houver prova concreta numa linha adicionada, não é blocker.'
          )
          for role,instruction in roles:
              payload={'model':'mistral-medium-latest','temperature':0.0,'response_format':{'type':'json_object'},'messages':[
                {'role':'system','content':f'És o agente Mistral {role} da MILK. {instruction} {evidence_rule} Responde JSON estrito com pass(boolean), blockers(array), regressions(array), tests(array).'},
                {'role':'user','content':'Avalia o candidato P0. Primeiro o diff exacto; depois o app.js completo para contexto. Só as linhas + e - do diff são alterações.\n\nDIFF:\n'+diff+'\n\nAPP.JS COMPLETO:\n'+app}
              ]}
              req=urllib.request.Request('https://api.mistral.ai/v1/chat/completions',data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=240) as r: body=json.loads(r.read())
              review=json.loads(body['choices'][0]['message']['content']); review['role']=role; reviews.append(review)
          pathlib.Path('/tmp/p0-reviews.json').write_text(json.dumps(reviews,ensure_ascii=False,indent=2),encoding='utf-8')
          failed=[]
          for r in reviews:
              print('MISTRAL_P0_REVIEW='+json.dumps(r,ensure_ascii=False))
              blockers=r.get('blockers') or []
              if r.get('pass') is not True or blockers: failed.append(r['role'])
          if failed: raise SystemExit('MISTRAL_P0_REVIEW_BLOCKED='+','.join(failed))
          print('MISTRAL_P0_REVIEWS_OK=3')
          PY

      - name: Update manifest deterministically and revalidate package
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib
          root=pathlib.Path('deploy/atlas-public')
          h=hashlib.sha256((root/'app.js').read_bytes()).hexdigest()
          p=root/'manifest.sha256'
          lines=[]
          for line in p.read_text(encoding='utf-8').splitlines():
              if line.rstrip().endswith('  app.js'): line=f'{h}  app.js'
              lines.append(line)
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          (cd deploy/atlas-public && sha256sum -c manifest.sha256)
          node --check deploy/atlas-public/app.js
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "deploy/atlas-public/app.js deploy/atlas-public/manifest.sha256 "

      - name: Commit validated candidate to the existing work branch only
        run: |
          set -euo pipefail
          git config user.name 'Associação MILK - Mistral Vibe Code'
          git config user.email 'milk@associacaomilk.pt'
          git add deploy/atlas-public/app.js deploy/atlas-public/manifest.sha256
          git commit -m 'perf(atlas): pause Cosmos offscreen and release audio context'
          git push origin HEAD:codex/milk-curadorias-ia-webapp-20260821
          echo "P0_COMMIT=$(git rev-parse HEAD)"

      - name: Store review receipt privately on PTServidor
        run: |
          set -euo pipefail
          python - <<'PY'
          import ftplib, hashlib, io, json, os, ssl, tarfile, urllib.request, subprocess
          pwd=os.environ.get('PTSERVIDOR_FTPS_PASSWORD','').strip(); run=os.environ['RUN_ID']
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          meta={'run':run,'commit':commit,'publication':False,'branch':'codex/milk-curadorias-ia-webapp-20260821','reviews_passed':3,'changed_files':['deploy/atlas-public/app.js','deploy/atlas-public/manifest.sha256']}
          b=io.BytesIO()
          with tarfile.open(fileobj=b,mode='w:gz') as tf:
              for source,arc in [('/tmp/atlas-p0.diff','atlas-p0.diff'),('/tmp/p0-reviews.json','mistral-reviews.json'),('/tmp/vibe-p0-output.json','vibe-output.json')]: tf.add(source,arcname=arc)
              raw=json.dumps(meta,sort_keys=True).encode(); info=tarfile.TarInfo('receipt.json'); info.size=len(raw); tf.addfile(info,io.BytesIO(raw))
          data=b.getvalue(); sha=hashlib.sha256(data).hexdigest(); name=f'atlas-p0-verified-{run}.tar.gz'
          ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=120)
          ftp.connect('troi.ptservidor.net',21); ftp.login('migration@associacaomilk.pt',pwd); ftp.prot_p()
          for part in ('atlas-vibe-code-analysis','p0-verified',run):
              try: ftp.mkd(part)
              except ftplib.all_errors: pass
              ftp.cwd(part)
          ftp.storbinary('STOR '+name,io.BytesIO(data),blocksize=1048576)
          back=bytearray(); ftp.retrbinary('RETR '+name,back.extend,blocksize=1048576); ftp.quit()
          if hashlib.sha256(back).hexdigest()!=sha: raise RuntimeError('P0_RECEIPT_READBACK_MISMATCH')
          msg=f'MILK_VIBE_CODE_P0_COMMITTED run={run} commit={commit} reviews=3 package_hashes=ok storage=private_ftps publication=no main_site_writes=0'
          print(msg)
          req=urllib.request.Request(f'https://api.github.com/repos/{os.environ["REPO"]}/issues/35/comments',data=json.dumps({'body':msg}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
          urllib.request.urlopen(req,timeout=30).read()
          PY
