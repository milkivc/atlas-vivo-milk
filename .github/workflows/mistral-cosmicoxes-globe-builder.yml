name: MILK Mistral COSMICOXES to Black Globe Builder

on:
  workflow_dispatch:
  push:
    branches:
      - work/mistral-sitejet-orchestration-20260902
    paths:
      - 'docs/agent-input/COSMICOXES_GLOBE_CANONICAL_LOCK.md'
      - '.github/workflows/mistral-cosmicoxes-globe-builder.yml'

permissions:
  contents: write

concurrency:
  group: milk-mistral-cosmicoxes-globe-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      PTSERVIDOR_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_FTPS_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/mistral-sitejet-orchestration-20260902
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Canonical preflight and protected baseline
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          test -f docs/agent-input/COSMICOXES_GLOBE_CANONICAL_LOCK.md
          test -f docs/ATLAS_CAMADA_PUBLICA_EXPERIENCIA_CANONICA_20260829.md
          for f in deploy/atlas-public/app.js deploy/atlas-public/atlas.js deploy/atlas-public/experience-machine.js deploy/atlas-public/index.html deploy/atlas-public/styles.css; do test -f "$f"; done
          node --check deploy/atlas-public/app.js
          node --check deploy/atlas-public/atlas.js
          node --check deploy/atlas-public/experience-machine.js
          node --test tests/ia-milk-public-boundary.test.mjs
          sha256sum deploy/atlas-public/catalogo-curatorial.json deploy/atlas-public/curadorias.js deploy/atlas-public/book.css deploy/atlas-public/public-runtime-config.json > /tmp/protected.before
          echo 'COSMIC_PREFLIGHT=OK'

      - name: PTServidor FTPS read-only continuity check
        run: |
          set -euo pipefail
          if [ -z "${PTSERVIDOR_FTPS_PASSWORD:-}" ]; then
            echo 'PTSERVIDOR_FTPS_ROUTE=SKIPPED_NO_SECRET'
            exit 0
          fi
          python - <<'PY'
          import ftplib, os, ssl
          try:
              ftp=ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=40)
              ftp.connect('troi.ptservidor.net',21)
              ftp.login('migration@associacaomilk.pt',os.environ['PTSERVIDOR_FTPS_PASSWORD'])
              ftp.prot_p(); ftp.pwd(); ftp.nlst()[:5]; ftp.quit()
              print('PTSERVIDOR_FTPS_ROUTE=OK_READONLY')
          except Exception as exc:
              print('PTSERVIDOR_FTPS_ROUTE=UNAVAILABLE:'+type(exc).__name__)
          PY

      - name: Install Mistral Vibe Code
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check mistral-vibe
          vibe --version

      - name: Mistral Code builds canonical cosmic sequence
        run: |
          set -u
          set +e
          vibe --trust --prompt "Lê primeiro docs/agent-input/COSMICOXES_GLOBE_CANONICAL_LOCK.md e docs/ATLAS_CAMADA_PUBLICA_EXPERIENCIA_CANONICA_20260829.md. Depois trabalha SOMENTE em deploy/atlas-public/app.js, atlas.js, experience-machine.js, index.html e styles.css. Implementa de verdade COSMICOXES reactivo → PALAVRAS CÓSMICAS exclusivamente de COSMIC_WORDS_SEED → SEGUNDO GESTO NO PRÓPRIO CAMPO → DISSOLUÇÃO → GLOBO NEGRO. Tens de corrigir a orquestração em atlas.js: o botão enterAtlas NÃO pode continuar a comprimir toda esta sequência e territory_ready NÃO pode disparar automaticamente. Quando chegar a GLOBE, pára aí porque ainda não existem MILKs territoriais materializadas. app.js deve renderizar/reagir ao estado sem tracking nem persistência. O segundo gesto deve funcionar por pointer/touch e teclado equivalente. O globo negro deve ser táctil/rotativo, com controlo explícito de movimento e reduced-motion. Não inventes conteúdo, coordenadas, festas, curadorias ou texto autoral. Não alteres catálogo, Livro Cubo, assets, scripts, workflows nem produção. Testa e termina com alterações reais." --max-turns 32 --output json > /tmp/vibe-cosmic-build.json
          echo "MISTRAL_COSMIC_BUILD_RC=$?"
          set -e
          git diff --name-only

      - name: Mistral Code completes orchestration if first delta is partial
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only)"
          if printf '%s\n' "$CHANGED" | grep -Fxq 'deploy/atlas-public/app.js' && printf '%s\n' "$CHANGED" | grep -Fxq 'deploy/atlas-public/atlas.js'; then
            echo 'MISTRAL_COMPLETION_PASS=NOT_NEEDED'
            exit 0
          fi
          echo 'MISTRAL_COMPLETION_PASS=REQUIRED'
          set +e
          vibe --trust --prompt "A primeira passagem ficou parcial. NÃO pares na análise. O diff tem de incluir app.js E atlas.js. Corrige explicitamente o fluxo antigo em atlas.js: remove a compressão automática do botão enterTerritory; após TOQUE, o campo COSMICOXES recebe o primeiro gesto e entra em COSMIC_WORDS; o segundo gesto acontece no próprio campo e envia continue para WORLD_GESTURE; depois dissolve; depois chega a GLOBE. NÃO envies territory_ready automaticamente e NÃO mostres territory/topbar como substituto do globo. Em app.js, o canvas reage a pointer/touch/velocidade/pausa, materializa as palavras fornecidas por atlas.js sem inventar novas e muda para renderização de globo negro quando o estado for GLOBE. Inclui teclado equivalente e controlo de rotação. Mantém os pontos territoriais bloqueados. Trabalha só nos cinco ficheiros públicos permitidos." --max-turns 30 --output json > /tmp/vibe-cosmic-completion.json
          RC=$?
          set -e
          echo "MISTRAL_COMPLETION_RC=$RC"
          CHANGED="$(git diff --name-only)"
          printf '%s\n' "$CHANGED" | grep -Fxq 'deploy/atlas-public/app.js' || { echo '::error::app.js not implemented'; exit 25; }
          printf '%s\n' "$CHANGED" | grep -Fxq 'deploy/atlas-public/atlas.js' || { echo '::error::atlas.js orchestration not implemented'; exit 26; }

      - name: Hard canonical and non-regression gate
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          while IFS= read -r f; do
            case "$f" in
              deploy/atlas-public/app.js|deploy/atlas-public/atlas.js|deploy/atlas-public/experience-machine.js|deploy/atlas-public/index.html|deploy/atlas-public/styles.css) ;;
              *) echo "::error::Forbidden changed path: $f"; exit 31;;
            esac
          done <<< "$CHANGED"
          sha256sum -c /tmp/protected.before
          node --check deploy/atlas-public/app.js
          node --check deploy/atlas-public/atlas.js
          node --check deploy/atlas-public/experience-machine.js
          node --test tests/ia-milk-public-boundary.test.mjs
          python - <<'PY'
          from pathlib import Path
          app=Path('deploy/atlas-public/app.js').read_text(encoding='utf-8')
          atlas=Path('deploy/atlas-public/atlas.js').read_text(encoding='utf-8')
          machine=Path('deploy/atlas-public/experience-machine.js').read_text(encoding='utf-8')
          checks={
            'STATE_COSMIC_WORDS': "COSMIC_WORDS: 'cosmic_words'" in machine,
            'STATE_WORLD_GESTURE': "WORLD_GESTURE: 'world_gesture'" in machine,
            'STATE_DISSOLVE': "DISSOLVE: 'dissolve'" in machine,
            'STATE_GLOBE': "GLOBE: 'globe'" in machine,
            'SEED_USED': 'COSMIC_WORDS_SEED' in atlas,
            'APP_POINTER': 'pointer' in app.lower(),
            'KEYBOARD_EQUIVALENT': ('keydown' in app.lower() or 'keydown' in atlas.lower()),
            'REDUCED_MOTION': 'prefers-reduced-motion' in atlas,
            'TERRITORIAL_BLOCK': 'blocked-until-materialized' in atlas,
            'NO_OLD_BUTTON_COMPRESSION': "enter.addEventListener('click', enterTerritory)" not in atlas,
            'NO_AUTOMATIC_TERRITORY_READY': "experience.send('territory_ready')" not in atlas,
            'GLOBE_RUNTIME': ('PUBLIC_STATES.GLOBE' in atlas or 'globe' in app.lower()),
          }
          for name,ok in checks.items(): print(name+'='+('OK' if ok else 'FAIL'))
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('COSMIC_HARD_GATE_FAILED='+','.join(bad))
          PY
          git diff --check
          git diff > /tmp/cosmic-globe.diff
          test -s /tmp/cosmic-globe.diff
          if grep -E '^\+.*https?://' /tmp/cosmic-globe.diff; then echo '::error::External URL introduced'; exit 32; fi
          if grep -E '^\+.*(localStorage|sessionStorage|indexedDB)' /tmp/cosmic-globe.diff; then echo '::error::New tracking/storage introduced'; exit 33; fi
          echo 'COSMIC_HARD_GATE=OK'

      - name: First four-agent Mistral council
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, urllib.request
          key=os.environ['MISTRAL_API_KEY'].strip(); diff=pathlib.Path('/tmp/cosmic-globe.diff').read_text(encoding='utf-8'); lock=pathlib.Path('docs/agent-input/COSMICOXES_GLOBE_CANONICAL_LOCK.md').read_text(encoding='utf-8')
          context=''.join('\n### '+p+'\n'+pathlib.Path(p).read_text(encoding='utf-8') for p in ['deploy/atlas-public/app.js','deploy/atlas-public/atlas.js','deploy/atlas-public/experience-machine.js','deploy/atlas-public/index.html','deploy/atlas-public/styles.css'])
          roles=[('cosmic_dramaturgy','sequência, segundo gesto e descoberta'),('runtime_performance','RAF, pointer/touch, lifecycle e desempenho'),('accessibility_motion','teclado, foco, controlo de rotação e reduced-motion'),('public_boundary','território fictício, tracking, rede, camada não pública e publicação')]
          reviews=[]; failed=[]
          rule='Consulta o código final antes de afirmar ausência. Só bloqueia defeito real com trecho literal e regra explícita do lock. Não inventes requisitos. JSON estrito com pass, blockers, checks.'
          for role,scope in roles:
              payload={'model':'mistral-medium-latest','temperature':0.0,'response_format':{'type':'json_object'},'messages':[{'role':'system','content':f'És {role} da MILK; revê {scope}. {rule}'},{'role':'user','content':'LOCK:\n'+lock+'\nDIFF:\n'+diff+'\nCÓDIGO FINAL:\n'+context}]}
              req=urllib.request.Request('https://api.mistral.ai/v1/chat/completions',data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=240) as r: body=json.loads(r.read())
              review=json.loads(body['choices'][0]['message']['content']); review['role']=role; reviews.append(review); print('MISTRAL_COSMIC_REVIEW='+json.dumps(review,ensure_ascii=False))
              if review.get('pass') is not True or review.get('blockers'): failed.append(role)
          pathlib.Path('/tmp/mistral-cosmic-reviews.json').write_text(json.dumps(reviews,ensure_ascii=False,indent=2),encoding='utf-8')
          pathlib.Path('/tmp/council.failed').write_text(','.join(failed),encoding='utf-8')
          print('MISTRAL_FIRST_COUNCIL_BLOCKERS='+(','.join(failed) if failed else 'NONE'))
          PY

      - name: Mistral Code repairs council blockers if any
        run: |
          set -euo pipefail
          FAILED="$(cat /tmp/council.failed)"
          if [ -z "$FAILED" ]; then echo 'MISTRAL_COUNCIL_REPAIR=NOT_NEEDED'; exit 0; fi
          REPORT="$(cat /tmp/mistral-cosmic-reviews.json)"
          set +e
          vibe --trust --prompt "Quatro agentes Mistral auditaram o incremento COSMICOXES/GLOBE. Corrige SOMENTE blockers reais que estejam sustentados por evidência literal e pelo lock. Não aceites requisitos inventados. Não alteres dados, catálogo, curadorias, assets, scripts, workflows ou produção. Mantém territory_ready bloqueado. Relatório: $REPORT" --max-turns 22 --output json > /tmp/vibe-council-repair.json
          RC=$?
          set -e
          echo "MISTRAL_COUNCIL_REPAIR_RC=$RC"
          node --check deploy/atlas-public/app.js
          node --check deploy/atlas-public/atlas.js
          node --check deploy/atlas-public/experience-machine.js
          node --test tests/ia-milk-public-boundary.test.mjs
          sha256sum -c /tmp/protected.before
          git diff --check
          git diff > /tmp/cosmic-globe.diff

      - name: Final four-agent Mistral council
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, urllib.request
          key=os.environ['MISTRAL_API_KEY'].strip(); diff=pathlib.Path('/tmp/cosmic-globe.diff').read_text(encoding='utf-8'); lock=pathlib.Path('docs/agent-input/COSMICOXES_GLOBE_CANONICAL_LOCK.md').read_text(encoding='utf-8')
          context=''.join('\n### '+p+'\n'+pathlib.Path(p).read_text(encoding='utf-8') for p in ['deploy/atlas-public/app.js','deploy/atlas-public/atlas.js','deploy/atlas-public/experience-machine.js','deploy/atlas-public/index.html','deploy/atlas-public/styles.css'])
          roles=[('cosmic_dramaturgy','sequência, segundo gesto e descoberta'),('runtime_performance','RAF, pointer/touch, lifecycle e desempenho'),('accessibility_motion','teclado, foco, controlo de rotação e reduced-motion'),('public_boundary','território fictício, tracking, rede, camada não pública e publicação')]
          failed=[]
          rule='Consulta o código final antes de afirmar ausência. Só bloqueia defeito real com trecho literal e regra explícita do lock. Não inventes requisitos. JSON estrito com pass, blockers, checks.'
          for role,scope in roles:
              payload={'model':'mistral-medium-latest','temperature':0.0,'response_format':{'type':'json_object'},'messages':[{'role':'system','content':f'És {role} da MILK; revê {scope}. {rule}'},{'role':'user','content':'LOCK:\n'+lock+'\nDIFF:\n'+diff+'\nCÓDIGO FINAL:\n'+context}]}
              req=urllib.request.Request('https://api.mistral.ai/v1/chat/completions',data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=240) as r: body=json.loads(r.read())
              review=json.loads(body['choices'][0]['message']['content']); print('MISTRAL_FINAL_COSMIC_REVIEW='+json.dumps({'role':role,**review},ensure_ascii=False))
              if review.get('pass') is not True or review.get('blockers'): failed.append(role)
          if failed: raise SystemExit('MISTRAL_FINAL_COSMIC_BLOCKERS='+','.join(failed))
          print('MISTRAL_FINAL_COSMIC_COUNCIL=4_OK')
          PY

      - name: Commit validated cosmic sequence to work branch only
        run: |
          set -euo pipefail
          git config user.name 'Associação MILK - Mistral Vibe Code'
          git config user.email 'milk@associacaomilk.pt'
          git add deploy/atlas-public/app.js deploy/atlas-public/atlas.js deploy/atlas-public/experience-machine.js deploy/atlas-public/index.html deploy/atlas-public/styles.css
          git commit -m 'feat(atlas): materialize cosmic words gesture dissolve black globe'
          git push origin HEAD:work/mistral-sitejet-orchestration-20260902
          echo "MISTRAL_COSMIC_COMMIT=$(git rev-parse HEAD)"
          echo 'PRODUCTION_PUBLISH=NO'
