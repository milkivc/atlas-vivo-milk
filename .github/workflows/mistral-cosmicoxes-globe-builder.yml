name: MILK Mistral COSMICOXES to Black Globe Builder

on:
  workflow_dispatch:
  push:
    branches:
      - work/mistral-sitejet-orchestration-20260902
    paths:
      - 'docs/agent-input/COSMICOXES_GLOBE_CANONICAL_LOCK.md'
      - '.github/workflows/mistral-cosmicoxes-globe-builder.yml'

permissions:
  contents: write

concurrency:
  group: milk-mistral-cosmicoxes-globe-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      PTSERVIDOR_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_FTPS_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/mistral-sitejet-orchestration-20260902
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Canonical preflight and protected baseline
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          test -f docs/agent-input/COSMICOXES_GLOBE_CANONICAL_LOCK.md
          test -f docs/ATLAS_CAMADA_PUBLICA_EXPERIENCIA_CANONICA_20260829.md
          for f in deploy/atlas-public/app.js deploy/atlas-public/atlas.js deploy/atlas-public/experience-machine.js deploy/atlas-public/index.html deploy/atlas-public/styles.css; do test -f "$f"; done
          node --check deploy/atlas-public/app.js
          node --check deploy/atlas-public/atlas.js
          node --check deploy/atlas-public/experience-machine.js
          node --test tests/ia-milk-public-boundary.test.mjs
          sha256sum deploy/atlas-public/catalogo-curatorial.json deploy/atlas-public/curadorias.js deploy/atlas-public/book.css deploy/atlas-public/public-runtime-config.json > /tmp/protected.before
          echo 'COSMIC_PREFLIGHT=OK'

      - name: PTServidor FTPS read-only continuity check
        run: |
          set -euo pipefail
          if [ -z "${PTSERVIDOR_FTPS_PASSWORD:-}" ]; then
            echo 'PTSERVIDOR_FTPS_ROUTE=SKIPPED_NO_SECRET'
            exit 0
          fi
          python - <<'PY'
          import ftplib, os, ssl
          try:
              ftp=ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=40)
              ftp.connect('troi.ptservidor.net',21)
              ftp.login('migration@associacaomilk.pt',os.environ['PTSERVIDOR_FTPS_PASSWORD'])
              ftp.prot_p(); ftp.pwd(); ftp.nlst()[:5]; ftp.quit()
              print('PTSERVIDOR_FTPS_ROUTE=OK_READONLY')
          except Exception as exc:
              print('PTSERVIDOR_FTPS_ROUTE=UNAVAILABLE:'+type(exc).__name__)
          PY

      - name: Install Mistral Vibe Code
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check mistral-vibe
          vibe --version

      - name: Mistral Code builds canonical cosmic sequence
        run: |
          set -u
          set +e
          vibe --trust --prompt "Lê primeiro docs/agent-input/COSMICOXES_GLOBE_CANONICAL_LOCK.md e docs/ATLAS_CAMADA_PUBLICA_EXPERIENCIA_CANONICA_20260829.md, depois inspecciona SOMENTE deploy/atlas-public/app.js, atlas.js, experience-machine.js, index.html e styles.css. Implementa o próximo incremento canónico real: COSMICOXES reactivo → PALAVRAS CÓSMICAS usando exclusivamente COSMIC_WORDS_SEED → segundo gesto no próprio campo, não botão continuar → DISSOLUÇÃO → GLOBO NEGRO táctil/rotativo com teclado, controlo de movimento e reduced-motion. Mantém MILKs territoriais bloqueadas e invisíveis. Não alteres catálogo, curadorias, Livro Cubo, assets, dados, scripts, workflows ou produção. Não inventes texto, território ou conteúdo. Testa sintaxe e boundary. Faz alterações reais apenas nos cinco ficheiros públicos permitidos e termina." --max-turns 26 --output json > /tmp/vibe-cosmic-build.json
          echo "MISTRAL_COSMIC_BUILD_RC=$?"
          set -e
          echo "MISTRAL_COSMIC_CHANGED=$(git diff --name-only | wc -l)"

      - name: Mistral Code second attempt only if no delta
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            echo 'MISTRAL_SECOND_ATTEMPT=NOT_NEEDED'
            exit 0
          fi
          set +e
          vibe --trust --prompt "A primeira passagem não produziu delta. Executa agora a implementação, não apenas análise. Lê o lock COSMICOXES_GLOBE_CANONICAL_LOCK.md. O código existente já tem a máquina com COSMIC_WORDS, WORLD_GESTURE, DISSOLVE e GLOBE, mas atlas.js actualmente comprime tudo no botão enterTerritory e app.js tem um céu não reactivo. Corrige isso nos ficheiros públicos permitidos. O segundo gesto deve nascer do canvas/campo e ter equivalente por teclado. Materializa globo negro sem dados territoriais fictícios. Não cries ficheiros nem dependências externas." --max-turns 24 --output json > /tmp/vibe-cosmic-build-second.json
          RC=$?
          set -e
          echo "MISTRAL_SECOND_ATTEMPT_RC=$RC"
          test -n "$(git diff --name-only)" || { echo '::error::Mistral Code produced no implementation delta'; exit 24; }

      - name: Hard canonical and non-regression gate
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only)"
          echo "$CHANGED"
          test -n "$CHANGED"
          while IFS= read -r f; do
            case "$f" in
              deploy/atlas-public/app.js|deploy/atlas-public/atlas.js|deploy/atlas-public/experience-machine.js|deploy/atlas-public/index.html|deploy/atlas-public/styles.css) ;;
              *) echo "::error::Forbidden changed path: $f"; exit 31;;
            esac
          done <<< "$CHANGED"
          sha256sum -c /tmp/protected.before
          node --check deploy/atlas-public/app.js
          node --check deploy/atlas-public/atlas.js
          node --check deploy/atlas-public/experience-machine.js
          node --test tests/ia-milk-public-boundary.test.mjs
          grep -Fq "COSMIC_WORDS: 'cosmic_words'" deploy/atlas-public/experience-machine.js
          grep -Fq "WORLD_GESTURE: 'world_gesture'" deploy/atlas-public/experience-machine.js
          grep -Fq "DISSOLVE: 'dissolve'" deploy/atlas-public/experience-machine.js
          grep -Fq "GLOBE: 'globe'" deploy/atlas-public/experience-machine.js
          grep -Fq 'COSMIC_WORDS_SEED' deploy/atlas-public/atlas.js
          grep -Eq 'pointer(move|down)|PointerEvent|pointer' deploy/atlas-public/app.js deploy/atlas-public/atlas.js
          grep -Eq 'keydown|KeyboardEvent' deploy/atlas-public/app.js deploy/atlas-public/atlas.js
          grep -Fq 'prefers-reduced-motion' deploy/atlas-public/atlas.js
          grep -Fq "blocked-until-materialized" deploy/atlas-public/atlas.js
          git diff --check
          git diff > /tmp/cosmic-globe.diff
          test -s /tmp/cosmic-globe.diff
          if grep -E '^\+.*https?://' /tmp/cosmic-globe.diff; then echo '::error::External URL introduced'; exit 32; fi
          if grep -E '^\+.*(localStorage|sessionStorage|indexedDB)' /tmp/cosmic-globe.diff; then echo '::error::New tracking/storage in cosmic sequence'; exit 33; fi
          echo 'COSMIC_HARD_GATE=OK'

      - name: Four independent Mistral agents review evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, urllib.request
          key=os.environ['MISTRAL_API_KEY'].strip()
          diff=pathlib.Path('/tmp/cosmic-globe.diff').read_text(encoding='utf-8')
          lock=pathlib.Path('docs/agent-input/COSMICOXES_GLOBE_CANONICAL_LOCK.md').read_text(encoding='utf-8')
          files=[]
          for p in ['deploy/atlas-public/app.js','deploy/atlas-public/atlas.js','deploy/atlas-public/experience-machine.js','deploy/atlas-public/index.html','deploy/atlas-public/styles.css']:
              files.append('\n### '+p+'\n'+pathlib.Path(p).read_text(encoding='utf-8'))
          context=''.join(files)
          roles=[
            ('cosmic_dramaturgy','Verifica a sequência COSMICOXES → PALAVRAS CÓSMICAS → SEGUNDO GESTO → DISSOLUÇÃO → GLOBO NEGRO e que o segundo gesto não é um botão continuar.'),
            ('runtime_performance','Verifica RAF, pointer/touch, resize, loops, desempenho, lifecycle e ausência de regressões técnicas evidentes.'),
            ('accessibility_motion','Verifica teclado equivalente, foco, controlo de rotação, reduced-motion e que acessibilidade preserva significado.'),
            ('public_boundary','Verifica ausência de território fictício, tracking, storage novo, rede externa, Camada Invisível, publicação ou conteúdo inventado.')]
          failed=[]; reviews=[]
          evidence_rule=('Só bloqueies defeito real demonstrável. Antes de afirmar que algo falta, consulta o CÓDIGO FINAL fornecido. '
                         'Cada blocker deve citar uma linha/trecho literal do DIFF ou do código final e ligar a uma regra explícita do LOCK. '
                         'Não inventes requisitos adicionais. Responde JSON estrito: pass(boolean), blockers(array), checks(array).')
          for role,scope in roles:
              payload={'model':'mistral-medium-latest','temperature':0.0,'response_format':{'type':'json_object'},'messages':[
                {'role':'system','content':f'És o agente Mistral {role} da Associação MILK. {scope} {evidence_rule}'},
                {'role':'user','content':'LOCK CANÓNICO:\n'+lock+'\n\nDIFF EXACTO:\n'+diff+'\n\nCÓDIGO FINAL PARA VERIFICAÇÃO:\n'+context}]}
              req=urllib.request.Request('https://api.mistral.ai/v1/chat/completions',data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=240) as r: body=json.loads(r.read())
              review=json.loads(body['choices'][0]['message']['content']); review['role']=role; reviews.append(review)
              print('MISTRAL_COSMIC_REVIEW='+json.dumps(review,ensure_ascii=False))
              if review.get('pass') is not True or (review.get('blockers') or []): failed.append(role)
          pathlib.Path('/tmp/mistral-cosmic-reviews.json').write_text(json.dumps(reviews,ensure_ascii=False,indent=2),encoding='utf-8')
          if failed: raise SystemExit('MISTRAL_COSMIC_BLOCKERS='+','.join(failed))
          print('MISTRAL_COSMIC_COUNCIL=4_OK')
          PY

      - name: Commit validated cosmic sequence to work branch only
        run: |
          set -euo pipefail
          git config user.name 'Associação MILK - Mistral Vibe Code'
          git config user.email 'milk@associacaomilk.pt'
          git add deploy/atlas-public/app.js deploy/atlas-public/atlas.js deploy/atlas-public/experience-machine.js deploy/atlas-public/index.html deploy/atlas-public/styles.css
          git commit -m 'feat(atlas): materialize cosmic words gesture dissolve black globe'
          git push origin HEAD:work/mistral-sitejet-orchestration-20260902
          echo "MISTRAL_COSMIC_COMMIT=$(git rev-parse HEAD)"
          echo 'PRODUCTION_PUBLISH=NO'
