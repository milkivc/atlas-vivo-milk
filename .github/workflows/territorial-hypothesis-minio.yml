name: MILK Territorial Hypothesis — MinIO sovereign preservation

on:
  push:
    branches:
      - 'work/territorial-hypothesis-engine-20260823'
    paths:
      - 'src/territorial-reader/**'
      - 'metadata/territorial-reader/**'
      - 'docs/territorial-reader/**'
      - 'ops/build_territorial_hypothesis_release.sh'
      - '.github/workflows/territorial-hypothesis-minio.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: milk-territorial-hypothesis-minio
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deterministic release validation
        run: |
          set -euo pipefail
          node --test src/territorial-reader/tests/*.test.js
          jq -e '."@id" and (."milk:classes"|length <= 16) and (."milk:relations"|length <= 16)' metadata/territorial-reader/atlas-territorial-minimal-ontology.jsonld >/dev/null
          grep -q '^version: 2.1.0$' metadata/territorial-reader/CITATION.cff
          jq -e '.version == "2.1.0"' metadata/territorial-reader/codemeta.json >/dev/null
          jq -e '.metadata.version == "2.1.0"' metadata/territorial-reader/zenodo-software.json >/dev/null

      - name: Mistral semantic release audit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          python - <<'PY'
          import json, os, pathlib, urllib.request
          meta=json.loads(pathlib.Path('metadata/territorial-reader/zenodo-software.json').read_text())
          onto=json.loads(pathlib.Path('metadata/territorial-reader/atlas-territorial-minimal-ontology.jsonld').read_text())
          prompt={
            'model':'mistral-small-latest','temperature':0,
            'messages':[
              {'role':'system','content':'És o auditor semântico Mistral da MILK. Não decides publicação. Verifica apenas coerência interna de versão, título, ontologia mínima, proveniência e validação humana. Responde exactamente RELEASE_SEMANTICS_OK se coerente; caso contrário RELEASE_SEMANTICS_BLOCKED.'},
              {'role':'user','content':json.dumps({'metadata':meta,'ontology':onto},ensure_ascii=False)}
            ]}
          req=urllib.request.Request('https://api.mistral.ai/v1/chat/completions',data=json.dumps(prompt).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['MISTRAL_API_KEY'],'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=90) as r: ans=json.loads(r.read())['choices'][0]['message']['content'].strip()
          if ans != 'RELEASE_SEMANTICS_OK': raise SystemExit('MISTRAL_SEMANTIC_AUDIT_BLOCKED')
          print('MISTRAL_SEMANTIC_AUDIT_OK')
          PY

      - name: Build reproducible release
        id: pack
        run: |
          set -euo pipefail
          chmod +x ops/build_territorial_hypothesis_release.sh
          OUT_DIR="$RUNNER_TEMP/release" ops/build_territorial_hypothesis_release.sh
          file="$RUNNER_TEMP/release/atlas-vivo-milk-territorial-hypothesis-engine-2.1.0.zip"
          sha=$(sha256sum "$file" | awk '{print $1}')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Install MinIO client
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://dl.min.io/client/mc/release/linux-amd64/mc -o "$RUNNER_TEMP/mc"
          chmod +x "$RUNNER_TEMP/mc"

      - name: Upload content-addressed object to MinIO and verify
        id: minio
        shell: bash
        env:
          RELEASE_FILE: ${{ steps.pack.outputs.file }}
          RELEASE_SHA: ${{ steps.pack.outputs.sha }}
        run: |
          set -euo pipefail
          access="${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-}}"
          secret="${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-}}"
          bucket="${MINIO_BUCKET:-atlas-vivo-milk}"
          missing=()
          [ -n "$MINIO_ENDPOINT" ] || missing+=(MINIO_ENDPOINT)
          [ -n "$access" ] || missing+=(MINIO_ACCESS_KEY)
          [ -n "$secret" ] || missing+=(MINIO_SECRET_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "MINIO_CONFIG_MISSING=${missing[*]}" >&2
            exit 41
          fi
          "$RUNNER_TEMP/mc" alias set milk-minio "$MINIO_ENDPOINT" "$access" "$secret" >/dev/null
          "$RUNNER_TEMP/mc" mb --ignore-existing --with-lock "milk-minio/$bucket" >/dev/null 2>&1 || "$RUNNER_TEMP/mc" mb --ignore-existing "milk-minio/$bucket" >/dev/null
          "$RUNNER_TEMP/mc" version enable "milk-minio/$bucket" >/dev/null
          key="releases/territorial-hypothesis-engine/2.1.0/sha256/$RELEASE_SHA/$(basename "$RELEASE_FILE")"
          "$RUNNER_TEMP/mc" cp --attr "sha256=$RELEASE_SHA;release=2.1.0;component=territorial-hypothesis-engine" "$RELEASE_FILE" "milk-minio/$bucket/$key" >/dev/null
          "$RUNNER_TEMP/mc" cp "milk-minio/$bucket/$key" "$RUNNER_TEMP/verify.zip" >/dev/null
          test "$RELEASE_SHA" = "$(sha256sum "$RUNNER_TEMP/verify.zip" | awk '{print $1}')"
          stat_json=$("$RUNNER_TEMP/mc" stat --json "milk-minio/$bucket/$key")
          version_id=$(printf '%s' "$stat_json" | jq -r '.versionID // .versionId // "none"')
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Factual MinIO receipt
        if: always()
        shell: bash
        env:
          SHA: ${{ steps.pack.outputs.sha }}
          BUCKET: ${{ steps.minio.outputs.bucket }}
          KEY: ${{ steps.minio.outputs.key }}
          VERSION_ID: ${{ steps.minio.outputs.version_id }}
        run: |
          set -euo pipefail
          if [ '${{ job.status }}' = 'success' ]; then
            body="TERRITORIAL_MINIO_PRESERVED run=$RUN_ID release=2.1.0 sha256=$SHA bucket=$BUCKET object=$KEY version_id=${VERSION_ID:-none} verified=1 public_access_set=0 master_writes=0 secret_values_disclosed=0 mistral_semantic_gate=passed"
          else
            body="TERRITORIAL_MINIO_BLOCKED run=$RUN_ID release=2.1.0 sha256=${SHA:-not_built} action_required=configure_or_verify_minio_credentials_endpoint_bucket master_writes=0 secret_values_disclosed=0"
          fi
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "https://api.github.com/repos/$REPO/issues/35/comments" -d "$(jq -n --arg body "$body" '{body:$body}')" >/dev/null
