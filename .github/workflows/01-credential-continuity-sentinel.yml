name: 01 MILK credential continuity sentinel

on:
  push:
    branches:
      - work/copernico-recovery-webapp-20260902
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: atlas-credential-continuity-sentinel
  cancel-in-progress: true

env:
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  NEXTCLOUD_ATLAS: ${{ secrets.NEXTCLOUD_ATLAS }}
  NEXTCLOUD_KEY: ${{ secrets.NEXTCLOUD_KEY }}
  PTSERVIDOR_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_FTPS_PASSWORD }}
  PTSERVIDOR_ATLAS_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_ATLAS_FTPS_PASSWORD }}
  PTSERVIDOR_FTP_WEBDAV: ${{ secrets.PTSERVIDOR_FTP_WEBDAV }}
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}

jobs:
  sentinel:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Presence + identity isolation — fail closed
        id: presence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          required=[
            'MISTRAL_API_KEY',
            'NEXTCLOUD_ATLAS',
            'NEXTCLOUD_KEY',
            'PTSERVIDOR_FTPS_PASSWORD',
            'PTSERVIDOR_ATLAS_FTPS_PASSWORD',
            'PTSERVIDOR_FTP_WEBDAV',
          ]
          missing=[x for x in required if not os.environ.get(x,'').strip()]
          state={'missing':missing,'isolation_ok':True}
          if not missing:
              state['isolation_ok']=os.environ['PTSERVIDOR_FTPS_PASSWORD'] != os.environ['PTSERVIDOR_ATLAS_FTPS_PASSWORD']
          pathlib.Path('/tmp/credential-presence.json').write_text(json.dumps(state),encoding='utf-8')
          for name in required:
              print('CREDENTIAL_PRESENCE '+name+'='+('MISSING' if name in missing else 'PRESENT'))
          print('SECRET_VALUES_DISCLOSED=0')
          if missing:
              raise SystemExit('CREDENTIAL_LOSS_DETECTED:'+','.join(missing))
          if not state['isolation_ok']:
              raise SystemExit('CREDENTIAL_IDENTITY_COLLISION_DETECTED')
          print('CREDENTIAL_PRESENCE_LOCK=PASS')
          print('ATLAS_MIGRATION_IDENTITY_ISOLATION=PASS')
          PY

      - name: Mistral authentication continuity — read only
        id: mistral
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          req=urllib.request.Request(
            'https://api.mistral.ai/v1/models',
            headers={'Authorization':'Bearer '+os.environ['MISTRAL_API_KEY'],'Accept':'application/json'}
          )
          with urllib.request.urlopen(req,timeout=45) as r:
              payload=json.loads(r.read())
          count=len(payload.get('data',[]))
          if count < 1: raise SystemExit('MISTRAL_AUTH_CONTINUITY_EMPTY_MODEL_LIST')
          print('MISTRAL_AUTH_CONTINUITY=PASS')
          print('MISTRAL_MODELS_VISIBLE='+str(count))
          print('MISTRAL_SECRET_DISCLOSED=0')
          PY

      - name: PTServidor FTPS identity continuity — read only
        id: ftps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ftplib, os, ssl
          accounts=[
            ('migration@associacaomilk.pt','PTSERVIDOR_FTPS_PASSWORD','MIGRATION'),
            ('atlas@associacaomilk.pt','PTSERVIDOR_ATLAS_FTPS_PASSWORD','ATLAS'),
          ]
          for username,secret_name,label in accounts:
              ftp=ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=45)
              ftp.connect('troi.ptservidor.net',21)
              ftp.login(username,os.environ[secret_name].strip())
              ftp.prot_p()
              ftp.pwd()
              entries=ftp.nlst()
              ftp.quit()
              print(f'PTSERVIDOR_{label}_FTPS_AUTH=PASS')
              print(f'PTSERVIDOR_{label}_VISIBLE_ENTRIES_COUNT={len(entries)}')
          print('PTSERVIDOR_FTPS_WRITES=0')
          print('PTSERVIDOR_SECRET_VALUES_DISCLOSED=0')
          PY

      - name: Nextcloud credential usability — read only, degraded is persistent alert
        id: nextcloud
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os, urllib.error, urllib.parse, urllib.request
          atlas=os.environ.get('NEXTCLOUD_ATLAS','').strip()
          user=atlas if atlas and not atlas.startswith('http') else 'admin'
          base=atlas if atlas.startswith('http') else 'https://associacaomilk.pt/nextcloud'
          password=os.environ['NEXTCLOUD_KEY'].strip()
          url=base.rstrip('/')+'/remote.php/dav/files/'+urllib.parse.quote(user,safe='')+'/'
          auth=base64.b64encode(f'{user}:{password}'.encode()).decode()
          body=b'<?xml version="1.0"?><d:propfind xmlns:d="DAV:"><d:prop><d:resourcetype/></d:prop></d:propfind>'
          req=urllib.request.Request(url,data=body,method='PROPFIND',headers={
            'Authorization':'Basic '+auth,'Depth':'0','Content-Type':'application/xml; charset=utf-8'
          })
          try:
              with urllib.request.urlopen(req,timeout=45) as r:
                  status=r.status
          except urllib.error.HTTPError as e:
              status=e.code
          print('NEXTCLOUD_WEBDAV_STATUS='+str(status))
          print('NEXTCLOUD_WRITES=0')
          print('NEXTCLOUD_SECRET_VALUES_DISCLOSED=0')
          if status not in (200,207):
              raise SystemExit('NEXTCLOUD_CREDENTIAL_USABILITY_DEGRADED_HTTP_'+str(status))
          print('NEXTCLOUD_CREDENTIAL_USABILITY=PASS')
          PY

      - name: Persistent credential alert — one issue, never secret values
        if: failure() || steps.nextcloud.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']
          title='[CREDENTIAL SENTINEL] Atlas credential continuity requires action'
          nextcloud='${{ steps.nextcloud.outcome }}'
          presence='${{ steps.presence.outcome }}'
          mistral='${{ steps.mistral.outcome }}'
          ftps='${{ steps.ftps.outcome }}'
          body=(
            'Automated fail-closed credential sentinel detected a continuity condition.\n\n'
            f'- presence/isolation: {presence}\n'
            f'- Mistral auth: {mistral}\n'
            f'- PTServidor FTPS identities: {ftps}\n'
            f'- Nextcloud WebDAV auth: {nextcloud}\n\n'
            'No secret values were logged, committed, sent to agents, or included in this issue. '
            'Check the system-specific recovery index in ops/critical-credentials-registry.yml.\n\n'
            f'Run: {os.environ.get("GITHUB_SERVER_URL","https://github.com")}/{repo}/actions/runs/{os.environ.get("GITHUB_RUN_ID","")}'
          )
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          q=urllib.parse.quote(f'repo:{repo} is:issue is:open in:title "[CREDENTIAL SENTINEL]"')
          req=urllib.request.Request('https://api.github.com/search/issues?q='+q,headers=headers)
          with urllib.request.urlopen(req,timeout=45) as r:
              found=json.loads(r.read()).get('items',[])
          if found:
              number=found[0]['number']
              url=f'https://api.github.com/repos/{repo}/issues/{number}/comments'
              data={'body':body}
          else:
              url=f'https://api.github.com/repos/{repo}/issues'
              data={'title':title,'body':body}
          req=urllib.request.Request(url,data=json.dumps(data).encode(),method='POST',headers=headers)
          with urllib.request.urlopen(req,timeout=45) as r: r.read()
          print('CREDENTIAL_PERSISTENT_ALERT=RECORDED')
          print('SECRET_VALUES_IN_ALERT=0')
          PY

      - name: Continuity receipt
        if: always()
        shell: bash
        run: |
          echo 'CREDENTIAL_SENTINEL_EXECUTED=1'
          echo 'SECRET_VALUES_DISCLOSED=0'
          echo 'AUTOMATED_SECRET_ROTATION=FORBIDDEN'
          echo 'AUTOMATED_SECRET_DELETION=FORBIDDEN'
          echo 'CREDENTIAL_SUBSTITUTION_BY_AGENT=FORBIDDEN'
