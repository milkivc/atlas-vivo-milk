name: MILK — gate de identidades ORCID e Zenodo
on:
  workflow_dispatch:
  push:
    branches: [work/atlas-total-retomada-20260827]
    paths: [metadata/identities.json, .github/workflows/zenodo-orcid-blindado.yml]
permissions:
  contents: read
jobs:
  validate-identities:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical separation
        run: |
          set -euo pipefail
          jq -e '.entities.associacaoMilk.type == "Organization" and .entities.associacaoMilk.orcid == null and .entities.eduardoMauer.orcid == "https://orcid.org/0009-0007-6892-6570" and .repositories.canonical.defaultBranch == "main"' metadata/identities.json >/dev/null
      - name: Read public profiles without external writes
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H 'Accept: application/json' https://codeberg.org/api/v1/repos/associacaomilk/atlas-vivo-milk | jq -e '.default_branch == "main"' >/dev/null
          for orcid in 0009-0007-6892-6570 0009-0009-1781-4020; do curl --fail --silent --show-error -H 'Accept: application/json' "https://pub.orcid.org/v3.0/$orcid/record" | jq -e --arg o "$orcid" '."orcid-identifier".path == $o' >/dev/null; done
          curl --fail --silent --show-error -H 'Accept: application/json' https://zenodo.org/api/records/22064108 | jq -e '.doi == "10.5281/zenodo.22064108"' >/dev/null
          echo 'MILK_IDENTITY_GATE_OK external_writes=0 zenodo_authorship_changed=0'
