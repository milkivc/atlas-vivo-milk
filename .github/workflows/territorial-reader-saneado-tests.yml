name: MILK Territorial Reader — saneamento e hypothesis engine

on:
  push:
    branches:
      - 'work/territorial-reader-saneado-20260822'
      - 'work/territorial-hypothesis-engine-20260823'
    paths:
      - 'src/territorial-reader/**'
      - '.github/workflows/territorial-reader-saneado-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check every territorial-reader JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          find src/territorial-reader -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Run deterministic anti-fabrication and hypothesis tests
        shell: bash
        run: |
          set -euo pipefail
          node --test src/territorial-reader/tests/*.test.js

      - name: Audit residual simulated data markers
        id: residue
        shell: bash
        run: |
          set -euo pipefail
          grep -RniE 'mock(Freguesias|Atas|Associacoes)|dados mock|simular dados|adicionar dados mock|fallback.*mock' src/territorial-reader \
            --exclude='territorial-reader.test.js' --exclude='hypothesis-engine.test.js' > "$RUNNER_TEMP/residue.txt" || true
          count=$(wc -l < "$RUNNER_TEMP/residue.txt" | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/residue.txt" || true
          test "$count" = 0

      - name: Verify official territorial source remains reachable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 \
            --output /dev/null \
            'https://www.dgterritorio.gov.pt/atividades/cartografia/cartografia-tematica/caop'

      - name: Verify no common plaintext secret material is present
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re
          root = pathlib.Path('src/territorial-reader')
          rx = re.compile(r'''(?ix)\b(?:api[_-]?key|password|secret|token)\b\s*[:=]\s*["']?[A-Za-z0-9._-]{16,}''')
          findings=[]
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.js','.json','.md','.txt','.yml','.yaml'}:
                  continue
              try: text=path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              if rx.search(text): findings.append(str(path))
          if findings:
              print('Possible plaintext secret material:', *findings, sep='\n- ')
              raise SystemExit(1)
          PY

      - name: Publish factual receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          conclusion='${{ job.status }}'
          body="TERRITORIAL_HYPOTHESIS_ENGINE_TEST run=${GITHUB_RUN_ID} conclusion=${conclusion} branch=${GITHUB_REF_NAME} master_writes=0 mock_runtime_allowed=0 open_world=yes human_gate=required"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' \
            "https://api.github.com/repos/$GH_REPOSITORY/issues/35/comments" \
            -d "$(jq -n --arg body "$body" '{body:$body}')" >/dev/null
