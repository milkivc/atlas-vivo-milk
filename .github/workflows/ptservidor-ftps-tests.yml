name: PTServidor FTPS safety tests

on:
  push:
    branches: [codex/safety-gate-2026-08-10]
    paths:
      - 'integrations/ptservidor/**'
      - '.github/workflows/ptservidor-ftps-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        working-directory: integrations/ptservidor
        run: python -m unittest -v test_ftp_transport.py
