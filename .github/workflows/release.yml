name: Release & Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get release version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate version format
        run: |
          if [[ ! "${{ steps.version.outputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Update metadata version
        run: |
          jq --arg ver "${{ steps.version.outputs.version }}" '.version = $ver' metadata.json > metadata.tmp.json
          mv metadata.tmp.json metadata.json

      - name: Validate updated metadata
        uses: actions/setup-node@v4
        with:
          node-version: '22'
        run: |
          npm install -g ajv-cli
          ajv validate -s .github/schemas/metadata-schema.json -d metadata.json --spec=draft7

      - name: Commit updated metadata
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add metadata.json
          git commit -m "chore: update version to ${{ steps.version.outputs.version }} [skip ci]" || true
          git push || true

  generate-doi:
    name: Generate DOI via Zenodo
    runs-on: ubuntu-latest
    needs: validate-release
    outputs:
      doi: ${{ steps.publish.outputs.doi }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get release info
        id: release
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Require Zenodo token
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          if [ -z "$ZENODO_TOKEN" ]; then
            echo "ZENODO_TOKEN ausente; publicação automática bloqueada."
            exit 1
          fi

      - name: Create Zenodo deposit
        id: zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          set -euo pipefail
          DEPOSIT_RESPONSE=$(curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $ZENODO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "${{ github.event.repository.name }} - ${{ steps.release.outputs.version }}" \
              --arg description "${{ github.event.repository.description || 'Atlas Vivo MILK' }} - Release ${{ steps.release.outputs.version }}" \
              --arg version "${{ steps.release.outputs.version }}" \
              --arg publication_date "$(date +%Y-%m-%d)" \
              '{metadata:{title:$title,description:$description,upload_type:"software",license:"EUPL-1.2",version:$version,publication_date:$publication_date,creators:[{name:"Eduardo Maurício Vieira Cabral e Araujo",orcid:"0009-0007-6892-6570"}],keywords:["Atlas Vivo MILK","cultura","património","soberania digital","interoperabilidade","Portugal"],notes:"Release automatizada a partir do repositório Atlas Vivo MILK"}}')" \
            https://zenodo.org/api/deposit/depositions)

          DEPOSIT_ID=$(echo "$DEPOSIT_RESPONSE" | jq -r '.id // empty')
          if [ -z "$DEPOSIT_ID" ]; then
            echo "Zenodo não devolveu deposition id."
            exit 1
          fi
          echo "deposit_id=$DEPOSIT_ID" >> $GITHUB_OUTPUT
          echo "DEPOSIT_ID=$DEPOSIT_ID" >> $GITHUB_ENV

      - name: Upload files to Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' FILE; do
            echo "Uploading $FILE..."
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $ZENODO_TOKEN" \
              -F "file=@$FILE" \
              "https://zenodo.org/api/deposit/depositions/$DEPOSIT_ID/files" >/dev/null
          done < <(find . -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.json" -o -name "*.gs" -o -name "*.md" -o -name "*.cff" \) ! -path "./.git/*" ! -path "./.github/*" ! -path "./node_modules/*" -print0)

      - name: Publish deposit
        id: publish
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          set -euo pipefail
          PUBLISH_RESPONSE=$(curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $ZENODO_TOKEN" \
            -H "Content-Type: application/json" \
            "https://zenodo.org/api/deposit/depositions/$DEPOSIT_ID/actions/publish")

          DOI=$(echo "$PUBLISH_RESPONSE" | jq -r '.metadata.doi // empty')
          if [ -z "$DOI" ]; then
            echo "Zenodo publicou sem DOI verificável na resposta."
            exit 1
          fi
          echo "doi=$DOI" >> $GITHUB_OUTPUT
          echo "DOI=$DOI" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Release ${{ steps.release.outputs.version }}
          body: |
            ## Atlas Vivo MILK — ${{ steps.release.outputs.version }}

            **Autor:** Eduardo Maurício Vieira Cabral e Araujo — Eduardo Mauer  
            **ORCID:** 0009-0007-6892-6570  
            **Gestão institucional:** Associação MILK — Movimento de Intervenções e Linguagens Kulturais e Arte

            ### DOI
            ${{ env.DOI }}

            ### Proveniência
            - código e metadados do release
            - licença EUPL-1.2 para a distribuição identificada
            - cadeia autoral e institucional preservada
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-orcid:
    name: Sync with ORCID
    runs-on: ubuntu-latest
    needs: generate-doi
    steps:
      - name: Notify Eduardo Mauer ORCID
        env:
          ORCID_TOKEN: ${{ secrets.ORCID_TOKEN }}
          DOI: ${{ needs.generate-doi.outputs.doi }}
          VERSION: ${{ needs.generate-doi.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$ORCID_TOKEN" ] || [ -z "$DOI" ]; then
            echo "ORCID sync não executado: token ou DOI ausente."
            exit 0
          fi

          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $ORCID_TOKEN" \
            -H "Content-Type: application/vnd.orcid+json" \
            -d "$(jq -n \
              --arg title "Atlas Vivo MILK - $VERSION" \
              --arg doi "$DOI" \
              --arg url "${{ github.event.repository.html_url }}/releases/tag/${{ github.ref_name }}" \
              '{"title":{"title":{"value":$title}},"type":"software","external-ids":{"external-id":[{"external-id-type":"doi","external-id-value":$doi,"external-id-relationship":"self"}]},"url":{"value":$url}}')" \
            https://api.orcid.org/v3.0/0009-0007-6892-6570/work >/dev/null

  notify:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [generate-doi, sync-orcid]
    if: always()
    steps:
      - name: Release status
        run: |
          echo "Release: ${{ github.ref }}"
          echo "Zenodo job: ${{ needs.generate-doi.result }}"
          echo "ORCID job: ${{ needs.sync-orcid.result }}"
