name: Mistral official Drive to PTServidor migration

on:
  push:
    branches: [codex/safety-gate-2026-08-10]
    paths:
      - 'ops/mistral_official_migration.py'
      - '.github/workflows/mistral-official-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/safety-gate-2026-08-10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute official Mistral migration canary and first batch
        run: python ops/mistral_official_migration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-official-migration-receipt
          path: artifacts/migration-official/receipt.json
          if-no-files-found: error
