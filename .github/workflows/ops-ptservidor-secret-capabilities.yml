name: MILK PTServidor secret capability probe

on:
  push:
    branches: ['ops/ftps-fallback-probe-20260822']
    paths: ['.github/workflows/ops-ptservidor-secret-capabilities.yml']

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      PTSERVIDOR_CPANEL_TOKEN: ${{ secrets.PTSERVIDOR_CPANEL_TOKEN }}
      CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
      PTSERVIDOR_PASSWORD: ${{ secrets.PTSERVIDOR_PASSWORD }}
      PTSERVIDOR_CPANEL_PASSWORD: ${{ secrets.PTSERVIDOR_CPANEL_PASSWORD }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      PTSERVIDOR_FTP_PASSWORD: ${{ secrets.PTSERVIDOR_FTP_PASSWORD }}
      MIGRATION_FTP_PASSWORD: ${{ secrets.MIGRATION_FTP_PASSWORD }}
      PTSERVIDOR_FTPS_PASSWORD: ${{ secrets.PTSERVIDOR_FTPS_PASSWORD }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      PTSERVIDOR_SFTP_PASSWORD: ${{ secrets.PTSERVIDOR_SFTP_PASSWORD }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      PTSERVIDOR_SSH_PASSWORD: ${{ secrets.PTSERVIDOR_SSH_PASSWORD }}
      PTSERVIDOR_SSH_PRIVATE_KEY: ${{ secrets.PTSERVIDOR_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      NEXTCLOUD_KEY: ${{ secrets.NEXTCLOUD_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Probe only presence and safe protocol capability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, ftplib, json, os, ssl, urllib.request
          names=['CPANEL_API_TOKEN','CPANEL_TOKEN','PTSERVIDOR_CPANEL_TOKEN','CPANEL_PASSWORD','PTSERVIDOR_PASSWORD','PTSERVIDOR_CPANEL_PASSWORD','FTP_PASSWORD','PTSERVIDOR_FTP_PASSWORD','MIGRATION_FTP_PASSWORD','PTSERVIDOR_FTPS_PASSWORD','SFTP_PASSWORD','PTSERVIDOR_SFTP_PASSWORD','SSH_PASSWORD','PTSERVIDOR_SSH_PASSWORD','PTSERVIDOR_SSH_PRIVATE_KEY','SSH_PRIVATE_KEY','NEXTCLOUD_KEY']
          present={n:bool(os.environ.get(n,'').strip()) for n in names}
          tests=[]
          # Test all password-like values against cPanel BasicAuth and FTPS, but never print values.
          for n in ['CPANEL_PASSWORD','PTSERVIDOR_PASSWORD','PTSERVIDOR_CPANEL_PASSWORD','FTP_PASSWORD','PTSERVIDOR_FTP_PASSWORD','MIGRATION_FTP_PASSWORD','PTSERVIDOR_FTPS_PASSWORD','SFTP_PASSWORD','PTSERVIDOR_SFTP_PASSWORD','SSH_PASSWORD','PTSERVIDOR_SSH_PASSWORD','NEXTCLOUD_KEY']:
              val=os.environ.get(n,'').strip()
              if not val: continue
              # cPanel BasicAuth read-only probe
              cpanel=False; cpanel_err=''
              try:
                  token=base64.b64encode(('associ16:'+val).encode()).decode()
                  req=urllib.request.Request('https://troi.ptservidor.net:2083/execute/DomainInfo/list_domains',headers={'Authorization':'Basic '+token,'Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      obj=json.loads(r.read())
                  cpanel=bool((obj.get('result') or {}).get('status')==1 or obj.get('status')==1)
              except Exception as exc: cpanel_err=type(exc).__name__
              ftps=False; ftps_user=''; ftps_err=''
              for user in ('migration@associacaomilk.pt','associ16'):
                  try:
                      f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=20);f.connect('troi.ptservidor.net',21);f.login(user,val);f.prot_p();f.quit();ftps=True;ftps_user=user;break
                  except Exception as exc: ftps_err=type(exc).__name__
              tests.append({'secret_name':n,'cpanel_basic_ok':cpanel,'cpanel_error':cpanel_err,'ftps_ok':ftps,'ftps_user':ftps_user,'ftps_error':ftps_err})
          # API token aliases read-only probe
          for n in ['CPANEL_API_TOKEN','CPANEL_TOKEN','PTSERVIDOR_CPANEL_TOKEN']:
              val=os.environ.get(n,'').strip()
              if not val: continue
              ok=False; err=''
              try:
                  req=urllib.request.Request('https://troi.ptservidor.net:2083/execute/DomainInfo/list_domains',headers={'Authorization':'cpanel associ16:'+val,'Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=20) as r: obj=json.loads(r.read())
                  ok=bool((obj.get('result') or {}).get('status')==1 or obj.get('status')==1)
              except Exception as exc: err=type(exc).__name__
              tests.append({'secret_name':n,'cpanel_token_ok':ok,'cpanel_error':err})
          safe_presence=','.join(f'{k}={"yes" if v else "no"}' for k,v in present.items())
          safe_tests=';'.join(','.join(f'{k}={v}' for k,v in t.items()) for t in tests)
          body=f"MILK_PTSERVIDOR_SECRET_CAPABILITIES run={os.environ['RUN_ID']} presence={safe_presence} tests={safe_tests or 'none'} values_disclosed=0 filenames_disclosed=0"
          print(body)
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/issues/35/comments",data=json.dumps({'body':body}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
          urllib.request.urlopen(req,timeout=30).read()
          PY
