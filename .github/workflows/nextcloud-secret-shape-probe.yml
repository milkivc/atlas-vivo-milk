name: MILK — Nextcloud secret shape probe

on:
  push:
    branches: [work/atlas-total-retomada-20260827]
    paths: ['.github/workflows/nextcloud-secret-shape-probe.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      NEXTCLOUD_KEY: ${{ secrets.NEXTCLOUD_KEY }}
      PTSERVIDOR_FTP_WEBDAV: ${{ secrets.PTSERVIDOR_FTP_WEBDAV }}
      NEXTCLOUD_BASE_URL: ${{ secrets.NEXTCLOUD_BASE_URL }}
      NEXTCLOUD_USER: ${{ secrets.NEXTCLOUD_USER }}
      NEXTCLOUD_APP_PASSWORD: ${{ secrets.NEXTCLOUD_APP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Classify secret shapes without disclosure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, urllib.parse, urllib.request

          def classify(value):
              value=(value or '').strip()
              if not value:
                  return 'empty'
              if value.startswith('[') and re.search(r'(?im)^\s*type\s*=\s*webdav\s*$', value):
                  return 'rclone_webdav_ini'
              try:
                  obj=json.loads(value)
                  if isinstance(obj,dict):
                      keys={str(k).lower() for k in obj}
                      if keys & {'base_url','url','user','username','app_password','password'}:
                          return 'json_connection_object'
                      return 'json_object_other'
              except Exception:
                  pass
              pairs={}
              for line in value.splitlines():
                  if '=' in line:
                      k,_=line.split('=',1); pairs.add(k.strip().upper())
              if pairs & {'NEXTCLOUD_BASE_URL','BASE_URL','URL','NEXTCLOUD_USER','USER','USERNAME','NEXTCLOUD_APP_PASSWORD','APP_PASSWORD','PASSWORD'}:
                  return 'key_value_connection_object'
              candidate=value if '://' in value else ('https://'+value if '@' in value else '')
              if candidate:
                  try:
                      p=urllib.parse.urlsplit(candidate)
                      if p.hostname and (p.username or p.password):
                          return 'url_with_userinfo'
                      if p.hostname:
                          return 'url_without_userinfo'
                  except Exception:
                      pass
              return 'opaque_single_value'

          body=(
              f"NEXTCLOUD_SECRET_SHAPE run={os.environ['RUN_ID']} "
              f"nextcloud_key={classify(os.environ.get('NEXTCLOUD_KEY'))} "
              f"ptservidor_ftp_webdav={classify(os.environ.get('PTSERVIDOR_FTP_WEBDAV'))} "
              f"base_url_secret={'present' if os.environ.get('NEXTCLOUD_BASE_URL') else 'empty'} "
              f"user_secret={'present' if os.environ.get('NEXTCLOUD_USER') else 'empty'} "
              f"app_password_secret={'present' if os.environ.get('NEXTCLOUD_APP_PASSWORD') else 'empty'} "
              "secret_values_disclosed=0"
          )
          print(body)
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/issues/35/comments",
              data=json.dumps({'body':body}).encode(), method='POST',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=45) as r: r.read()
          PY
