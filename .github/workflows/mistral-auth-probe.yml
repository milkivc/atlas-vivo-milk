name: Mistral read-only authentication probe

on:
  push:
    branches:
      - codex/safety-gate-2026-08-10
    paths:
      - ".github/workflows/mistral-auth-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - name: Probe Mistral safely
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          key = os.environ.get('MISTRAL_API_KEY','')
          report = {
              'key_present': bool(key),
              'auth_ok': False,
              'models_access': False,
              'agents_access': False,
              'connectors_access': False,
              'models_count': None,
              'agents_count': None,
              'connectors_count': None,
              'errors': {},
          }
          if not key:
              report['errors']['credential'] = 'MISTRAL_API_KEY_MISSING'
              print(json.dumps(report, sort_keys=True))
              raise SystemExit(2)
          headers = {'Authorization': 'Bearer ' + key, 'Accept': 'application/json'}
          endpoints = {
              'models': 'https://api.mistral.ai/v1/models',
              'agents': 'https://api.mistral.ai/v1/agents/pages',
              'connectors': 'https://api.mistral.ai/v1/connectors?page_size=100',
          }
          for name, url in endpoints.items():
              try:
                  req = urllib.request.Request(url, headers=headers, method='GET')
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = json.loads(r.read().decode('utf-8'))
                  report[name + '_access'] = True
                  report['auth_ok'] = True
                  if name == 'models':
                      items = body.get('data', body if isinstance(body, list) else [])
                  elif name == 'agents':
                      items = body.get('data', [])
                  else:
                      items = body.get('items', [])
                  report[name + '_count'] = len(items)
              except urllib.error.HTTPError as e:
                  report['errors'][name] = 'HTTP_' + str(e.code)
              except Exception as e:
                  report['errors'][name] = type(e).__name__
          print(json.dumps(report, sort_keys=True))
          if not report['auth_ok']:
              raise SystemExit(3)
          PY
