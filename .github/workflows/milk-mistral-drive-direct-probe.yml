name: MILK Mistral Drive direct probe

on:
  push:
    branches: [ops/ftps-fallback-probe-20260822]
    paths:
      - '.github/workflows/milk-mistral-drive-direct-probe.yml'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Search and download one file without disclosure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request, urllib.error

          api='https://api.mistral.ai/v1/connectors/google_drive_mcp/tools'
          headers={'Authorization':'Bearer '+os.environ['MISTRAL_API_KEY'],'Content-Type':'application/json','Accept':'application/json'}
          def call(tool,args):
              req=urllib.request.Request(f'{api}/{tool}/call',data=json.dumps({'arguments':args}).encode(),method='POST',headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=90) as r:
                      return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try: payload=json.loads(e.read().decode())
                  except Exception: payload={'error_type':type(e).__name__}
                  return e.code,payload

          status,res=call('search_files',{'query':"owner = 'me'",'page_size':5})
          if status != 200:
              msg=f'MILK_MISTRAL_DRIVE_DIRECT_PROBE run={os.environ["RUN_ID"]} search_http={status} success=false values_disclosed=0'
          else:
              # Tool output is MCP content; parse text payload if JSON encoded.
              content=res.get('content',[]) if isinstance(res,dict) else []
              texts=[x.get('text','') for x in content if isinstance(x,dict) and isinstance(x.get('text'),str)]
              joined='\n'.join(texts)
              parsed=None
              for t in texts:
                  try:
                      candidate=json.loads(t)
                      if isinstance(candidate,(dict,list)):
                          parsed=candidate; break
                  except Exception: pass
              def collect_files(obj):
                  if isinstance(obj,list):
                      return [x for x in obj if isinstance(x,dict) and ('id' in x or 'file_id' in x)]
                  if isinstance(obj,dict):
                      for k in ('files','items','results','data'):
                          if isinstance(obj.get(k),list): return [x for x in obj[k] if isinstance(x,dict)]
                  return []
              files=collect_files(parsed)
              if not files:
                  # Best-effort inspect JSON fragments without logging them.
                  try:
                      fallback=json.loads(joined)
                      files=collect_files(fallback)
                  except Exception: pass
              chosen=None
              for f in files:
                  fid=f.get('id') or f.get('file_id')
                  mt=f.get('mimeType') or f.get('mime_type') or ''
                  if fid and not str(mt).startswith('application/vnd.google-apps.'):
                      chosen=(str(fid),str(mt)); break
              if not chosen:
                  msg=(f'MILK_MISTRAL_DRIVE_DIRECT_PROBE run={os.environ["RUN_ID"]} search_http=200 '
                       f'files_parsed={len(files)} downloadable_found=false success=false values_disclosed=0')
              else:
                  dstatus,dres=call('download_file_content',{'file_id':chosen[0]})
                  decoded=b''
                  if dstatus==200 and isinstance(dres,dict):
                      for item in dres.get('content',[]):
                          if not isinstance(item,dict): continue
                          txt=item.get('text')
                          if isinstance(txt,str):
                              candidates=[txt]
                              try:
                                  j=json.loads(txt)
                                  if isinstance(j,dict):
                                      candidates += [str(j.get(k,'')) for k in ('base64_content','content','data')]
                              except Exception: pass
                              for c in candidates:
                                  try:
                                      b=base64.b64decode(c,validate=True)
                                      if b: decoded=b; break
                                  except Exception: pass
                          if decoded: break
                  msg=(f'MILK_MISTRAL_DRIVE_DIRECT_PROBE run={os.environ["RUN_ID"]} search_http=200 files_parsed={len(files)} '
                       f'download_http={dstatus} decoded_bytes={len(decoded)} sha256_present={str(bool(decoded)).lower()} '
                       f'success={str(bool(decoded)).lower()} values_disclosed=0')
          print(msg,flush=True)
          req=urllib.request.Request(f'https://api.github.com/repos/{os.environ["REPO"]}/issues/35/comments',data=json.dumps({'body':msg}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as r:r.read()
          if 'success=true' not in msg: raise SystemExit(2)
          PY
