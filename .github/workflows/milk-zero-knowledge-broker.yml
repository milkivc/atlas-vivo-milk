name: MILK Zero-Knowledge Credential Broker

on:
  workflow_dispatch:
  push:
    branches:
      - work/integral-resolution-mistral-20260825
    paths:
      - '.github/workflows/milk-zero-knowledge-broker.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: milk-zero-knowledge-broker
  cancel-in-progress: false

jobs:
  broker-and-resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install connector runtime
        run: python -m pip install --quiet mistralai==2.9.3

      - name: Retrieve current PTServidor FTPS credential without model exposure
        id: broker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,ftplib,json,os,pathlib,re,ssl,urllib.request
          from mistralai.client import Mistral

          KEY=os.environ.get('MISTRAL_API_KEY','').strip()
          OUT=pathlib.Path(os.environ['GITHUB_OUTPUT'])
          TMP=pathlib.Path(os.environ['RUNNER_TEMP'])/'milk-ftps-password'
          REPO=os.environ['REPO']; GH=os.environ['GH_TOKEN']; RUN_ID=os.environ['RUN_ID']

          def receipt(message):
              print(message,flush=True)
              req=urllib.request.Request(
                  f'https://api.github.com/repos/{REPO}/issues/35/comments',
                  data=json.dumps({'body':message}).encode(),method='POST',
                  headers={'Authorization':'Bearer '+GH,'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=45) as r:r.read()

          def dump(value):
              if hasattr(value,'model_dump'):return value.model_dump(by_alias=True)
              if isinstance(value,(dict,list,str,int,float,bool)) or value is None:return value
              try:return dict(value)
              except Exception:return str(value)

          def raw_strings(value):
              value=dump(value)
              if isinstance(value,str):
                  yield value
              elif isinstance(value,dict):
                  for nested in value.values():yield from raw_strings(nested)
              elif isinstance(value,list):
                  for nested in value:yield from raw_strings(nested)

          def candidate_texts(value):
              for s in raw_strings(value):
                  yield s
                  t=s.strip()
                  if len(t) >= 16 and re.fullmatch(r'[A-Za-z0-9_-]+',t):
                      try:
                          decoded=base64.urlsafe_b64decode(t+'='*((4-len(t)%4)%4)).decode('utf-8','ignore')
                          if decoded:yield decoded
                      except Exception:pass
                  if t.startswith('{') or t.startswith('['):
                      try:
                          nested=json.loads(t)
                          yield from candidate_texts(nested)
                      except Exception:pass

          def find_thread_ids(value):
              value=dump(value);found=[]
              def walk(v):
                  if isinstance(v,dict):
                      for k,x in v.items():
                          if str(k).lower() in ('threadid','thread_id') and isinstance(x,str) and x:found.append(x)
                          walk(x)
                  elif isinstance(v,list):
                      for x in v:walk(x)
              walk(value)
              return list(dict.fromkeys(found))

          def extract_password_from_text(text):
              patterns=[
                  r'(?is)\bA\s+password\s+é\s*(.+?)(?=\s+Sem\s+outro\s+assunto|\r?\n|$)',
                  r'(?is)\bpassword\s*:\s*([^\r\n]+)',
              ]
              for pattern in patterns:
                  m=re.search(pattern,text)
                  if not m:continue
                  value=m.group(1).strip().strip('`"\'')
                  if 6 <= len(value) <= 128 and all(c not in value for c in '\r\n'):
                      return value
              return None

          def extract_password(value):
              for text in candidate_texts(value):
                  found=extract_password_from_text(text)
                  if found:return found
              return None

          if not KEY:
              receipt(f'MILK_ZERO_KNOWLEDGE_BROKER run={RUN_ID} state=blocked cause=MISTRAL_API_KEY_MISSING secrets_disclosed=0 model_secret_exposure=0')
              with OUT.open('a') as fh:fh.write('ok=no\n')
              raise SystemExit(0)

          password=None;connector_state='unavailable';threads_checked=0
          try:
              with Mistral(api_key=KEY) as client:
                  candidates=['1a02a62ca0e3cfa7']
                  try:
                      sr=client.beta.connectors.call_tool(
                          tool_name='search_threads',connector_id_or_name='gmail',
                          arguments={'query':'from:suporte@ptservidor.pt "882572" after:2026/08/22 -in:spam -in:trash','pageSize':10,'includeTrash':False})
                      connector_state='search_threads_ok'
                      password=extract_password(sr)
                      candidates+=find_thread_ids(sr)
                  except Exception:
                      connector_state='search_threads_failed_direct_id_fallback'

                  if not password:
                      for thread_id in list(dict.fromkeys(candidates))[:12]:
                          try:
                              tr=client.beta.connectors.call_tool(
                                  tool_name='get_thread',connector_id_or_name='gmail',
                                  arguments={'threadId':thread_id,'messageFormat':'full'})
                              threads_checked+=1
                              password=extract_password(tr)
                              if password:
                                  connector_state='get_thread_decoded_ok'
                                  break
                          except Exception:
                              continue
          except Exception:
              connector_state='auth_or_connector_unavailable'

          if not password:
              receipt(f'MILK_ZERO_KNOWLEDGE_BROKER run={RUN_ID} state=blocked gmail_connector={connector_state} threads_checked={threads_checked} credential_found=0 secrets_disclosed=0 model_secret_exposure=0 source_writes=0')
              with OUT.open('a') as fh:fh.write('ok=no\n')
              raise SystemExit(0)

          # Mask before transport authentication. Never send credential to chat/completions, agents, repository or artifacts.
          print('::add-mask::'+password)

          ftp=None
          try:
              ftp=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
              ftp.connect('troi.ptservidor.net',21,timeout=45)
              ftp.login('migration@associacaomilk.pt',password)
              ftp.prot_p();ftp.voidcmd('TYPE I')
              try:ftp.quit()
              except Exception:pass
          except Exception:
              try:
                  if ftp:ftp.close()
              except Exception:pass
              receipt(f'MILK_ZERO_KNOWLEDGE_BROKER run={RUN_ID} state=blocked gmail_connector={connector_state} credential_found=1 ftps_auth=failed secrets_disclosed=0 model_secret_exposure=0 source_writes=0')
              with OUT.open('a') as fh:fh.write('ok=no\n')
              raise SystemExit(0)

          TMP.write_text(password,encoding='utf-8');TMP.chmod(0o600)
          with OUT.open('a') as fh:
              fh.write('ok=yes\n');fh.write(f'passfile={TMP}\n')
          receipt(f'MILK_ZERO_KNOWLEDGE_BROKER run={RUN_ID} state=ready gmail_connector={connector_state} credential_found=1 ftps_auth=ok secrets_disclosed=0 model_secret_exposure=0 persistence=ephemeral_0600 source_writes=0')
          PY

      - name: Resume preservative Drive migration from existing receipts
        if: steps.broker.outputs.ok == 'yes'
        shell: bash
        env:
          MILK_FTPS_PASSWORD_FILE: ${{ steps.broker.outputs.passfile }}
        run: |
          set -euo pipefail
          trap 'shred -u "$MILK_FTPS_PASSWORD_FILE" 2>/dev/null || rm -f "$MILK_FTPS_PASSWORD_FILE"' EXIT
          git show 9247b3831d2f8203a8d5c1a6bf8d173155edd64b:ops/milk_drive_mistral_to_ftps.py > "$RUNNER_TEMP/milk_drive_mistral_to_ftps.py"
          python "$RUNNER_TEMP/milk_drive_mistral_to_ftps.py"

      - name: Record broker-only status when migration could not start
        if: steps.broker.outputs.ok != 'yes'
        shell: bash
        run: echo 'Credential broker completed without secret disclosure; no migration process was started by this run.'
