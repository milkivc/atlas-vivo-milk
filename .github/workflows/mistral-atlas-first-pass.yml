name: Atlas Mistral first safeguarded pass

on:
  push:
    branches:
      - codex/safety-gate-2026-08-10
    paths:
      - ".github/workflows/mistral-atlas-first-pass.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - name: Execute canonical recovery and experiential engineering
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, time, urllib.request, urllib.error
          raw=os.environ.get('MISTRAL_API_KEY','').strip()
          if raw.startswith('MISTRAL_API_KEY='): raw=raw.split('=',1)[1].strip().strip('"').strip("'")
          key=''.join(raw.split())
          if not key: raise SystemExit('MISTRAL_API_KEY missing')
          H={'Authorization':'Bearer '+key,'Accept':'application/json','Content-Type':'application/json'}
          BASE='https://api.mistral.ai'

          def req(method,path,payload=None,retries=2):
              data=None if payload is None else json.dumps(payload,ensure_ascii=False).encode('utf-8')
              for attempt in range(retries):
                  try:
                      r=urllib.request.Request(BASE+path,headers=H,data=data,method=method)
                      with urllib.request.urlopen(r,timeout=240) as x: return json.loads(x.read().decode('utf-8'))
                  except urllib.error.HTTPError as e:
                      err=e.read().decode('utf-8','ignore')[:1200]
                      err=re.sub(r'[A-Za-z0-9_\-]{30,}','[OPAQUE_REDACTED]',err)
                      print('MISTRAL_HTTP_ERROR',e.code,err)
                      if e.code>=500 and attempt<retries-1: time.sleep(2); continue
                      raise

          def output_text(obj):
              parts=[]
              def walk(x):
                  if isinstance(x,dict):
                      if x.get('type')=='message.output':
                          c=x.get('content')
                          if isinstance(c,str): parts.append(c)
                          elif isinstance(c,list):
                              for z in c:
                                  if isinstance(z,dict) and isinstance(z.get('text'),str): parts.append(z['text'])
                      for v in x.values(): walk(v)
                  elif isinstance(x,list):
                      for v in x: walk(v)
              walk(obj)
              s='\n'.join(parts)
              s=re.sub(r'https?://\S+','[URL_REDACTED]',s)
              s=re.sub(r'[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}','[EMAIL_REDACTED]',s)
              return s[:20000]

          models=req('GET','/v1/models')
          model_ids={m.get('id') for m in models.get('data',[]) if isinstance(m,dict)}
          target='mistral-medium-latest' if 'mistral-medium-latest' in model_ids else ('mistral-small-latest' if 'mistral-small-latest' in model_ids else None)
          if not target: raise SystemExit('no supported active Mistral model found')

          listed=req('GET','/v1/agents/pages')
          agents={a.get('name'):a for a in listed.get('data',[]) if isinstance(a,dict)}
          reader=agents.get('ler o drive') or agents.get('MILK Drive Curator — Read Only')
          engineer=agents.get('Arquiteto do Ecossistema') or agents.get('MILK Research Decoder — Web App')
          if not reader or not engineer:
              print(json.dumps({'state':'BLOCKED_AGENT_SELECTION','available':sorted(agents.keys())},ensure_ascii=False)); raise SystemExit(2)

          patched=[]
          for a in (reader,engineer):
              if a.get('model') not in model_ids:
                  a=req('PATCH','/v1/agents/'+a['id'],{'model':target})
                  patched.append(a.get('name'))
                  if a.get('name')==reader.get('name'): reader=a
                  if a.get('name')==engineer.get('name'): engineer=a

          scope=('RECORTE AUTORAL FECHADO: Livro Cubo + 7 dinâmicas; Festival Dado 100Lado; A Casa que Não Existe; Propostas/Dinâmicas Espetaculares; '
                 '6 + 12 Juntas somente com fonte exacta; F01-F20 das festas; curadorias toponímicas; falARTE; simpliCIDADE; ARTÉRIA/ARTE-RIA conforme fonte; brincadeiras; gírias; '
                 'trava-línguas; seres folclóricos; festas; SESC estrutura e criação; Dinâmicas para o Atlas Cultural Português; Lidoterapia conforme fonte; Palavra Ritual; Curadoria do Inesperado; '
                 'Poesia Marginal; apenas curadoria de Curadoria cultural para cidades inteligentes Atlas, excluindo smart-cities; convites das festas; Histórias absurdas de Portugal; 138 lendas; '
                 'travesseiros para pedras e balões em territórios abandonados somente com fonte exacta; O Mesmo Lugar Não Existe distinto de A Casa que Não Existe; somente Dispositivo Doblado.pdf.')
          rules=('Fonte original por nome/conteúdo prevalece; LOTE/conexões/saneamento/consolidação/catálogos derivados não são autoridade e ficam intocados; excluir 104; Drive READ-ONLY; '
                 'preservar voz/autoria/grafia/humor/sarcasmo; C1 sem inventar; tecnologia adapta-se à curadoria; forma nasce do fenómeno; encontro, silêncio, espera, ausência, recusa e não-evento podem ser arte; '
                 'falARTE faz-se arte; sem lógica de mercado ou produto obrigatório; COSMICOXES distinto de Cosmic Flow; Mistral Zero Learning sem fine-tuning/dataset/library/memória oculta.')

          rp='EXECUTE recuperação autoral + reescrita C1 no Google Drive somente leitura. '+scope+' '+rules+' Priorize Sheets F01-F20, festa-dinâmica-convite, 138 lendas, fontes originais, Dispositivo Doblado.pdf, travesseiros para pedras e balões em territórios abandonados. Produza matriz operacional source-grounded com nome exacto, fonte, prova, C1, relações, condição fenomenológica, consequências digitais/territoriais e lacunas. Não escreva no Drive.'
          rb=req('POST','/v1/conversations',{'agent_id':reader['id'],'inputs':rp,'store':False})
          recovered=output_text(rb)
          if not recovered: raise SystemExit('reader returned empty output')

          ep='EXECUTE engenharia computacional experiencial apenas sobre esta matriz. '+scope+' '+rules+' Não descreva: derive mecanismo executável, inclusive nada acontecer. Preserve F01-F20, convites, lendas e território; remova 104 do fluxo canónico. Gere PATCH_READY JSON com source_anchor, estados, eventos, contratos, dados, API/UI events, testes e mudanças mínimas no código existente. Se não vir o código, marque TARGET_CODE_LOOKUP_REQUIRED. MATRIZ: '+recovered[:17000]
          eb=req('POST','/v1/conversations',{'agent_id':engineer['id'],'inputs':ep,'store':False})
          engineered=output_text(eb)
          if not engineered: raise SystemExit('engineer returned empty output')

          print('ATLAS_MISTRAL_EXECUTION_BEGIN')
          print(json.dumps({'state':'RECOVERY_C1_ENGINEERING_EXECUTED','patched_agents':patched,'reader':reader.get('name'),'engineer':engineer.get('name'),'recovery':recovered,'engineering':engineered,'drive_writes':0,'libraries_created':0,'fine_tuning_started':0},ensure_ascii=False,indent=2))
          print('ATLAS_MISTRAL_EXECUTION_END')
          PY
