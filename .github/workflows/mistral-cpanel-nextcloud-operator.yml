name: MILK cPanel deterministic control plane

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Operation to execute. Discovery is read-only."
        required: true
        default: discover
        type: choice
        options:
          - discover
          - ensure_nextcloud_domain
      approval_sha256:
        description: "For write actions only: exact SHA-256 of the canonical change plan emitted by a prior discovery run."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: milk-cpanel-control-plane
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      PTSERVIDOR_CPANEL_TOKEN: ${{ secrets.PTSERVIDOR_CPANEL_TOKEN }}
      ACTION: ${{ inputs.action }}
      APPROVAL_SHA256: ${{ inputs.approval_sha256 }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Discover cPanel or execute one approved change plan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          USER = "associ16"
          HOST = "troi.ptservidor.net"
          PROTECTED_DOMAIN = "associacaomilk.pt"
          NEXTCLOUD_DOMAIN = "nuvem.associacaomilk.pt"
          NEXTCLOUD_DOCROOT = "nuvem.associacaomilk.pt"
          ACTION = (os.environ.get("ACTION") or "discover").strip()
          APPROVAL = (os.environ.get("APPROVAL_SHA256") or "").strip().lower()
          TOKEN = (
              os.environ.get("CPANEL_API_TOKEN", "").strip()
              or os.environ.get("CPANEL_TOKEN", "").strip()
              or os.environ.get("PTSERVIDOR_CPANEL_TOKEN", "").strip()
          )

          def emit(kind, **fields):
              print(json.dumps({"event": kind, **fields}, ensure_ascii=False, sort_keys=True), flush=True)

          if not TOKEN:
              emit(
                  "MILK_CPANEL_BLOCKED",
                  cause="CPANEL_API_TOKEN_MISSING",
                  accepted_secret_names=["CPANEL_API_TOKEN", "CPANEL_TOKEN", "PTSERVIDOR_CPANEL_TOKEN"],
                  credential_type="cPanel API token",
                  endpoint=f"https://{HOST}:2083/execute/Module/function",
              )
              raise SystemExit(2)

          def uapi(module, function, params=None):
              query = urllib.parse.urlencode(params or {}, doseq=True)
              url = f"https://{HOST}:2083/execute/{module}/{function}"
              if query:
                  url += "?" + query
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"cpanel {USER}:{TOKEN}",
                      "Accept": "application/json",
                      "User-Agent": "MILK-cPanel-Control-Plane/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      payload = json.loads(response.read())
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")[:500]
                  raise RuntimeError(f"HTTP_{exc.code}:{body}") from exc
              result = payload.get("result") if isinstance(payload, dict) else None
              if not isinstance(result, dict):
                  raise RuntimeError("UAPI_RESPONSE_MISSING_RESULT")
              if int(result.get("status", 0)) != 1:
                  errors = result.get("errors") or ["unknown"]
                  raise RuntimeError(f"UAPI_{module}_{function}_FAILED:{str(errors[0])[:300]}")
              return result.get("data")

          # Canonical, immutable-by-value change plan. A write run is accepted only
          # when the caller supplies the exact hash emitted by a prior discovery run.
          change_plan = {
              "schema": "milk.cpanel.change-plan.v1",
              "action": "ensure_nextcloud_domain",
              "host": HOST,
              "cpanel_user": USER,
              "protected_domain": PROTECTED_DOMAIN,
              "target_domain": NEXTCLOUD_DOMAIN,
              "root_domain": PROTECTED_DOMAIN,
              "docroot": NEXTCLOUD_DOCROOT,
              "invariants": [
                  "do_not_modify_associacaomilk_pt",
                  "do_not_delete_existing_domains",
                  "idempotent_create_only_if_absent",
                  "verify_after_write",
              ],
          }
          canonical_plan = json.dumps(change_plan, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()
          plan_sha = hashlib.sha256(canonical_plan).hexdigest()
          emit("MILK_CPANEL_CHANGE_PLAN", sha256=plan_sha, plan=change_plan)

          # Read-only discovery. Each endpoint is isolated so one unavailable cPanel
          # feature never blocks the rest of the inventory.
          probes = [
              ("server", "Variables", "get_server_information", None),
              ("account", "Variables", "get_user_information", None),
              ("domains", "DomainInfo", "list_domains", {"hide_temporary_domains": 0}),
              ("features", "Features", "list_features", None),
              ("quota", "Quota", "get_quota_info", None),
              ("resources", "ResourceUsage", "get_usages", None),
              ("ssl_domains", "WebVhosts", "list_ssl_capable_domains", None),
              ("tokens", "Tokens", "list", None),
          ]
          inventory = {}
          for label, module, function, params in probes:
              try:
                  inventory[label] = {"status": "PASS", "data": uapi(module, function, params)}
              except Exception as exc:
                  inventory[label] = {"status": "BLOCKED", "reason": str(exc)[:500]}
          emit("MILK_CPANEL_DISCOVERY", inventory=inventory, source_writes=0)

          if ACTION == "discover":
              emit("MILK_CPANEL_COMPLETE", action=ACTION, writes=0, plan_sha256=plan_sha)
              raise SystemExit(0)

          if ACTION != "ensure_nextcloud_domain":
              emit("MILK_CPANEL_BLOCKED", cause="UNKNOWN_ACTION", action=ACTION)
              raise SystemExit(3)

          if APPROVAL != plan_sha:
              emit(
                  "MILK_CPANEL_BLOCKED",
                  cause="APPROVAL_HASH_MISMATCH",
                  action=ACTION,
                  expected_plan_sha256=plan_sha,
                  supplied=(APPROVAL or None),
              )
              raise SystemExit(4)

          domains = uapi("DomainInfo", "list_domains", {"hide_temporary_domains": 0})
          serialized = json.dumps(domains, ensure_ascii=False)
          if PROTECTED_DOMAIN not in serialized:
              emit("MILK_CPANEL_BLOCKED", cause="PROTECTED_ROOT_DOMAIN_NOT_FOUND")
              raise SystemExit(5)

          if NEXTCLOUD_DOMAIN in serialized:
              emit(
                  "MILK_CPANEL_COMPLETE",
                  action=ACTION,
                  state="already_exists",
                  target=NEXTCLOUD_DOMAIN,
                  protected_domain_untouched=True,
                  plan_sha256=plan_sha,
              )
              raise SystemExit(0)

          uapi(
              "SubDomain",
              "addsubdomain",
              {
                  "domain": "nuvem",
                  "rootdomain": PROTECTED_DOMAIN,
                  "dir": NEXTCLOUD_DOCROOT,
                  "disallowdot": 1,
                  "canoff": 0,
              },
          )
          verified = uapi("DomainInfo", "list_domains", {"hide_temporary_domains": 0})
          if NEXTCLOUD_DOMAIN not in json.dumps(verified, ensure_ascii=False):
              emit("MILK_CPANEL_FAILED", cause="WRITE_NOT_VISIBLE_AFTER_VERIFY", target=NEXTCLOUD_DOMAIN)
              raise SystemExit(6)

          emit(
              "MILK_CPANEL_COMPLETE",
              action=ACTION,
              state="created_and_verified",
              target=NEXTCLOUD_DOMAIN,
              protected_domain_untouched=True,
              plan_sha256=plan_sha,
          )
          PY
