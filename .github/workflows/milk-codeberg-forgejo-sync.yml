name: MILK — sincronização Codeberg Forgejo
on:
  push:
    branches: [work/atlas-total-retomada-20260827]
    paths: [.github/workflows/milk-codeberg-forgejo-sync.yml]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: milk-codeberg-forgejo-atlas-total
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TARGET_BRANCH: work/atlas-total-retomada-20260827
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward validated branch to institutional Forgejo
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CODEBERG_TOKEN"
          credentials="$RUNNER_TEMP/codeberg-credentials"
          trap 'rm -f "$credentials"' EXIT
          printf 'protocol=https\nhost=codeberg.org\nusername=associacaomilk\npassword=%s\n\n' "$CODEBERG_TOKEN" | git -c credential.helper="store --file=$credentials" credential approve
          chmod 600 "$credentials"
          git remote add codeberg https://codeberg.org/associacaomilk/atlas-vivo-milk.git
          if git ls-remote --exit-code codeberg "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags codeberg "$TARGET_BRANCH"
            git merge-base --is-ancestor FETCH_HEAD HEAD
          fi
          git -c credential.helper="store --file=$credentials" push codeberg HEAD:"refs/heads/$TARGET_BRANCH"
          git -c credential.helper="store --file=$credentials" fetch --no-tags codeberg "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          echo "CODEBERG_FORGEJO_SYNC_VERIFIED branch=$TARGET_BRANCH sha=$(git rev-parse HEAD) force_push=0"
      - name: Publish factual receipt
        if: always()
        shell: bash
        run: |
          body="MILK_CODEBERG_FORGEJO_SYNC run=$GITHUB_RUN_ID conclusion=${{ job.status }} branch=$TARGET_BRANCH commit=$GITHUB_SHA force_push=0 master_writes=0 secret_values_disclosed=0"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "https://api.github.com/repos/$REPO/issues/35/comments" -d "$(jq -n --arg body "$body" '{body:$body}')" >/dev/null
