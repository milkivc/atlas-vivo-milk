name: MILK Mistral falARTE production port v2

on:
  push:
    branches: [work/copernico-recovery-webapp-20260902]
    paths: ['.github/workflows/mistral-falarte-production-port-v2.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milk-mistral-falarte-production-port-v2
  cancel-in-progress: false

jobs:
  build-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      BRANCH: work/copernico-recovery-webapp-20260902
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/copernico-recovery-webapp-20260902
          fetch-depth: 1

      - name: Install Mistral Vibe Code
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          python -m pip install --disable-pip-version-check mistral-vibe==2.24.5
          vibe --version

      - name: Mistral Agent — source-grounded falARTE contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .mistral-private
          printf '.mistral-private/\n' >> .git/info/exclude
          python - <<'PY'
          import asyncio, json, os, pathlib, re
          from mistralai.client import Mistral

          client = Mistral(api_key=os.environ['MISTRAL_API_KEY'])
          source_contract = {
            'canonical_source':'PUBLICO_TERRITORIAL__CURADORIA_NOS_FALARTE_RESIDUAL',
            'device':'falARTE / NÓS territorial',
            'mechanics':[
              {'id':'lugar-escondido','title':'O lugar escondido'},
              {'id':'trinta-dias','title':'30 dias, o mesmo lugar'},
              {'id':'antigo-novo','title':'O mais antigo e o mais novo'},
              {'id':'embalagem-conta','title':'A embalagem conta'},
              {'id':'som-local','title':'O som que só existe aqui'},
              {'id':'ainda-resiste','title':'O que ainda resiste'},
              {'id':'palavras-desapareceram','title':'Palavras que desapareceram'},
              {'id':'nao-apagado','title':'O que ainda não foi apagado'},
              {'id':'so-memoria','title':'Só existe na tua memória'},
              {'id':'remetente-ausente','title':'Remetente Ausente'}
            ],
            'submission':{
              'real_same_origin_intake':True,
              'human_review_before_publication':True,
              'state':'PENDENTE_CURADORIA',
              'minimum_age':13,
              'authorship':['nome_real','nome_inventado','anonimo'],
              'publication':['integral','trechos','nao_publicar'],
              'separate_public_consent':True,
              'withdrawal_request':True,
              'territorial_context':True
            },
            'privacy':{
              'preserve_received_original':True,
              'no_auto_publication':True,
              'no_ip_or_user_agent_storage':True,
              'no_telemetry':True,
              'no_biometrics':True,
              'files_never_in_localStorage':True
            },
            'cosmic_flow':{
              'five_fragment_response_is_visual_only':True,
              'remetente_ausente_only_after_successful_intake':True,
              'never_claim_physical_space_launch':True
            },
            'server':{
              'platform':'PTServidor cPanel PHP',
              'submit_endpoint':'/api/curadoria/falarte/submit.php',
              'withdraw_endpoint':'/api/curadoria/falarte/withdraw.php',
              'private_storage_outside_document_root':True,
              'fail_closed_if_private_storage_unavailable':True
            }
          }

          existing = ''
          for p in ['deploy/atlas-public/falarte.js','deploy/atlas-public/falarte.css','deploy/atlas-public/curadorias.js','deploy/atlas-public/catalogo-curatorial.json','deploy/atlas-public/index.html']:
            q = pathlib.Path(p)
            if q.exists():
              existing += '\nFILE '+p+'\n'+q.read_text(encoding='utf-8')[:35000]

          def extract_text(resp):
            parts=[]
            for o in getattr(resp,'outputs',[]) or []:
              if getattr(o,'type',None) != 'message.output':
                continue
              c=getattr(o,'content','')
              if isinstance(c,str):
                parts.append(c)
              else:
                for x in c or []:
                  t=getattr(x,'text',None)
                  if t: parts.append(t)
            return '\n'.join(parts).strip()

          def parse_json_payload(text):
            if not text:
              raise ValueError('EMPTY_AGENT_RESPONSE')
            cleaned=text.strip()
            cleaned=re.sub(r'^```(?:json)?\s*','',cleaned,flags=re.I)
            cleaned=re.sub(r'\s*```$','',cleaned)
            try:
              return json.loads(cleaned)
            except json.JSONDecodeError:
              start=cleaned.find('{'); end=cleaned.rfind('}')
              if start < 0 or end <= start: raise
              return json.loads(cleaned[start:end+1])

          async def main():
            agent=await client.beta.agents.create_async(
              name='MILK falARTE Production Architect v2',
              description='Produces a conservative executable plan for the canonical falARTE WebApp runtime.',
              model='mistral-medium-latest',
              instructions=(
                'Use only the supplied contract and current code. Preserve all ten mechanics as distinct authored experiences. '
                'Do not invent curatorial content. Design a same-origin PHP intake for PTServidor with originals outside webroot, '
                'human review, separate public consent, safe withdrawal request, no telemetry and accessibility. '
                'Return one JSON object only; markdown fences are unnecessary.'
              ),
              tools=[{'type':'code_interpreter'}],
              completion_args={'temperature':0.0}
            )
            try:
              resp=await client.beta.conversations.start_async(
                agent_id=agent.id,
                inputs=[{'role':'user','content':'SOURCE CONTRACT:\n'+json.dumps(source_contract,ensure_ascii=False)+'\n\nCURRENT CODE:\n'+existing}],
                timeout_ms=240000
              )
              raw=extract_text(resp)
              obj=parse_json_payload(raw)
              required=['runtime_changes','server_contract','security_invariants','accessibility_tests','source_fidelity_tests']
              missing=[k for k in required if k not in obj]
              if missing:
                raise RuntimeError('MISSING_PLAN_KEYS:'+','.join(missing))
              pathlib.Path('.mistral-private/falarte-plan.json').write_text(json.dumps(obj,ensure_ascii=False,indent=2),encoding='utf-8')
              print('MISTRAL_FALARTE_ARCHITECT_V2=PASS')
            finally:
              await client.beta.agents.delete_async(agent_id=agent.id)

          asyncio.run(main())
          PY

      - name: Mistral Vibe Code — implement real falARTE intake
        shell: bash
        run: |
          set -euo pipefail
          vibe --agent auto-approve --trust --max-turns 40 --output json --prompt "ATLAS VIVO MILK — FALARTE PRODUÇÃO v2. Lê .mistral-private/falarte-plan.json e o runtime deploy/atlas-public/falarte.js, falarte.css, curadorias.js, catalogo-curatorial.json e index.html. Porta as dez mecânicas existentes sem as fundir num formulário genérico. Mantém os IDs existentes: lugar-escondido, trinta-dias, antigo-novo, embalagem-conta, som-local, ainda-resiste, palavras-desapareceram, nao-apagado, so-memoria, remetente-ausente. Implementa envio REAL same-origin para /api/curadoria/falarte/submit.php. Cria PHP seguro em deploy/atlas-public/api/curadoria/falarte/. Exige 13+, consentimento curatorial, autoria nome_real/nome_inventado/anonimo e escopo integral/trechos/nao_publicar; se integral ou trechos, exige consentimento público separado. Aceita apenas mechanic_id permitido. Usa finfo, limites de tamanho, nomes aleatórios e move_uploaded_file. Nunca usa nome original para paths. Armazena originais e metadata fora de DOCUMENT_ROOT; se não conseguir criar/escrever storage privado, responde erro e não aceita. Estado inicial PENDENTE_CURADORIA. Não guarda IP, user-agent, cookies nem telemetria. Gera receipt_id e withdrawal_code aleatórios; guarda apenas hash do withdrawal_code. Cria withdraw.php que recebe receipt_id+withdrawal_code e apenas marca RETIRADA_SOLICITADA de forma auditável, sem publicar nem apagar automaticamente. Frontend mantém receipt/withdrawal code apenas localmente; ficheiros jamais entram em localStorage. Remetente Ausente mostra Cosmic Flow/partículas apenas após HTTP 2xx e não afirma lançamento físico/espacial. A fragmentação em cinco é só resposta visual; o original recebido permanece intacto. Mantém teclado, touch, aria-live, foco, reduced-motion e feedback de erro/sucesso. Sem bibliotecas externas, API keys ou trackers. Marca apenas falarte como implementado_especifico no catálogo se a integração estiver completa. Não alteres outras curadorias e não faças commit. No fim executa node --check e php -l." > .mistral-private/vibe.json
          git status --porcelain -uall

      - name: Deterministic falARTE production gates
        shell: bash
        run: |
          set -euo pipefail
          node --check deploy/atlas-public/falarte.js
          php -l deploy/atlas-public/api/curadoria/falarte/submit.php
          php -l deploy/atlas-public/api/curadoria/falarte/withdraw.php
          for s in lugar-escondido trinta-dias antigo-novo embalagem-conta som-local ainda-resiste palavras-desapareceram nao-apagado so-memoria remetente-ausente; do
            grep -Fq "$s" deploy/atlas-public/falarte.js || { echo "::error::MISSING_MECHANIC:$s"; exit 20; }
          done
          grep -Fq '/api/curadoria/falarte/submit.php' deploy/atlas-public/falarte.js
          grep -Fq '/api/curadoria/falarte/withdraw.php' deploy/atlas-public/falarte.js
          grep -Eq 'FormData|multipart' deploy/atlas-public/falarte.js
          grep -Fq 'PENDENTE_CURADORIA' deploy/atlas-public/api/curadoria/falarte/submit.php
          grep -Fq 'RETIRADA_SOLICITADA' deploy/atlas-public/api/curadoria/falarte/withdraw.php
          grep -Eq 'nome_real|nome_inventado|anonimo' deploy/atlas-public/api/curadoria/falarte/submit.php
          grep -Eq 'integral|trechos|nao_publicar' deploy/atlas-public/api/curadoria/falarte/submit.php
          grep -Eq 'finfo|finfo_file' deploy/atlas-public/api/curadoria/falarte/submit.php
          grep -Eq 'move_uploaded_file' deploy/atlas-public/api/curadoria/falarte/submit.php
          grep -Eq 'random_bytes|bin2hex' deploy/atlas-public/api/curadoria/falarte/submit.php deploy/atlas-public/api/curadoria/falarte/withdraw.php
          grep -Eiq 'hash|password_hash|hash_hmac' deploy/atlas-public/api/curadoria/falarte/submit.php deploy/atlas-public/api/curadoria/falarte/withdraw.php
          grep -Eq 'DOCUMENT_ROOT|document_root' deploy/atlas-public/api/curadoria/falarte/submit.php
          ! grep -Eiq 'REMOTE_ADDR|HTTP_USER_AGENT|analytics|telemetry' deploy/atlas-public/api/curadoria/falarte/submit.php deploy/atlas-public/api/curadoria/falarte/withdraw.php deploy/atlas-public/falarte.js
          grep -Eq 'aria-live|role=.status.|role.*status' deploy/atlas-public/falarte.js
          grep -Eq 'prefers-reduced-motion|reducedMotion' deploy/atlas-public/falarte.js deploy/atlas-public/falarte.css
          python - <<'PY'
          import json
          d=json.load(open('deploy/atlas-public/catalogo-curatorial.json',encoding='utf-8'))
          r=next(x for x in d['entradas'] if x['id']=='falarte')
          assert r['estado']=='implementado_especifico', r
          print('FALARTE_CATALOG_GATE=PASS')
          PY
          git diff --check
          mapfile -t changed < <(git status --porcelain -uall | awk '{print $2}' | sort -u)
          test ${#changed[@]} -gt 0
          for f in "${changed[@]}"; do
            case "$f" in
              deploy/atlas-public/falarte.js|deploy/atlas-public/falarte.css|deploy/atlas-public/catalogo-curatorial.json|deploy/atlas-public/curadorias.js|deploy/atlas-public/index.html|deploy/atlas-public/api/curadoria/falarte/*) ;;
              *) echo "::error::OUTSIDE_FALARTE_BOUNDARY:$f"; exit 21;;
            esac
          done
          echo 'FALARTE_DETERMINISTIC_GATES_V2=PASS'

      - name: Mistral review council — fidelity security experience
        shell: bash
        run: |
          set -euo pipefail
          git diff > .mistral-private/candidate.diff
          python - <<'PY'
          import asyncio,json,os,pathlib,re
          from mistralai.client import Mistral
          client=Mistral(api_key=os.environ['MISTRAL_API_KEY'])
          plan=pathlib.Path('.mistral-private/falarte-plan.json').read_text(encoding='utf-8')
          diff=pathlib.Path('.mistral-private/candidate.diff').read_text(encoding='utf-8')

          def extract(resp):
            out=[]
            for o in getattr(resp,'outputs',[]) or []:
              if getattr(o,'type',None)=='message.output':
                c=getattr(o,'content','')
                if isinstance(c,str): out.append(c)
                else:
                  for x in c or []:
                    t=getattr(x,'text',None)
                    if t: out.append(t)
            s='\n'.join(out).strip()
            s=re.sub(r'^```(?:json)?\s*','',s,flags=re.I); s=re.sub(r'\s*```$','',s)
            try: return json.loads(s)
            except json.JSONDecodeError:
              a=s.find('{'); b=s.rfind('}')
              if a<0 or b<=a: raise
              return json.loads(s[a:b+1])

          roles=[
            ('falARTE Source Fidelity','Block if any of the ten mechanics is lost, merged, renamed incompatibly, or if intake/publication/Cosmic Flow contradict the plan.'),
            ('falARTE Intake Security','Block path traversal, executable/public upload storage, weak MIME validation, automatic publication, under-13 intake, network logging, missing consent choices, plaintext withdrawal code at rest, or non-auditable withdrawal.'),
            ('falARTE Experience','Block if result becomes a generic catalogue/form instead of ten distinct participatory experiences, or if accessibility/reduced-motion/touch/keyboard is degraded.')
          ]

          async def one(name,instructions):
            a=await client.beta.agents.create_async(name='MILK '+name+' v2',description=instructions,model='mistral-medium-latest',instructions=instructions+' Return JSON object with pass, blockers, evidence, tests.',tools=[{'type':'code_interpreter'}],completion_args={'temperature':0.0})
            try:
              r=await client.beta.conversations.start_async(agent_id=a.id,inputs=[{'role':'user','content':'PLAN:\n'+plan+'\n\nDIFF:\n'+diff}],timeout_ms=180000)
              obj=extract(r)
              ok=bool(obj.get('pass')) and not obj.get('blockers')
              print('MISTRAL_REVIEW_'+name.upper().replace(' ','_')+'='+('PASS' if ok else 'BLOCK'))
              if not ok: raise RuntimeError(name+': '+json.dumps(obj.get('blockers'),ensure_ascii=False))
            finally:
              await client.beta.agents.delete_async(agent_id=a.id)

          async def main():
            for role in roles: await one(*role)
          asyncio.run(main())
          PY
          echo 'MISTRAL_FALARTE_REVIEW_COUNCIL_V2=PASS'

      - name: Commit validated falARTE production runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Associação MILK - Mistral Vibe Code'
          git config user.email 'milk@associacaomilk.pt'
          git add deploy/atlas-public
          git diff --cached --quiet && { echo '::error::NO_FALARTE_DELTA'; exit 50; }
          git diff --cached --check
          git commit -m 'feat(webapp): activate canonical falARTE intake runtime'
          git push origin HEAD:$BRANCH
          echo "MISTRAL_FALARTE_COMMIT=$(git rev-parse HEAD)"
          echo 'MISTRAL_FALARTE_PRODUCTION_V2=VALIDATED'
