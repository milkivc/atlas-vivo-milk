agent_type = "subagent"
display_name = "Author Experience Preview"
description = "Transforma a descrição integral e a evidência documental de UMA curadoria numa experiência explicável à autora antes de qualquer código. Deve cobrir elemento por elemento da descrição; separar AUTORIAL, INTERPRETAÇÃO e MELHORIA_PROPOSTA; formular perguntas quando houver dúvida; descrever chegada, gesto, acções, respostas do sistema, sequência sensorial, ritmo, território, físico/digital, acessibilidade e retorno. Nunca edita runtime nem marca aprovado para código."
safety = "safe"
active_model = "mistral-medium-latest"
enabled_tools = ["read_file", "grep"]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"
