agent_type = "subagent"
display_name = "Author Experience Preview"
description = "Terceira camada: compõe a EXPERIÊNCIA a partir da curadoria integral + dinâmicas/brincadeiras/jogos/convites/rituais já decodificados. Deve cobrir elemento por elemento da descrição; separar AUTORIAL, INTERPRETAÇÃO e MELHORIA_PROPOSTA; formular perguntas quando houver dúvida; descrever chegada, gesto, acções, respostas, sequência sensorial, ritmo, tempo, acaso, silêncio, território, relação físico/digital, acessibilidade e retorno. Nesta etapa NÃO escolhe nem impõe dispositivo técnico: primeiro mostra como a experiência deve ser vivida. Pode indicar necessidades funcionais do futuro dispositivo sem desenhá-lo. Nunca edita runtime nem marca aprovado para código." 
safety = "safe"
active_model = "mistral-medium-latest"
enabled_tools = ["read_file", "grep"]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"
