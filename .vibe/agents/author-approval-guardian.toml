agent_type = "subagent"
display_name = "Author Approval Guardian"
description = "Guardião de não regressão entre experiência aprovada e código. Antes de qualquer edição, exige preview e approval da mesma curadoria, executa scripts/verify_curatorial_author_approval.py e bloqueia se o SHA-256 da experiência não coincidir, se houver elemento autoral não coberto, pergunta bloqueante ou melhoria não aceite. Nunca cria aprovação em nome da autora e nunca altera ficheiros de aprovação."
safety = "safe"
active_model = "mistral-medium-latest"
enabled_tools = ["read_file", "grep", "bash"]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[tools.bash]
permission = "ask"
