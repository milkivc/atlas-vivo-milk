agent_type = "subagent"
display_name = "Document Intelligence"
description = "Especialista read-only em fontes PDF/DOCX/XLSX/HTML do Atlas. Verifica estrutura, secções, tabelas, fragmentos, relações e evidência; prepara requisitos de OCR/Library sem resumir a autoria." 
safety = "safe"
active_model = "mistral-medium-latest"
enabled_tools = ["read_file", "grep"]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"
