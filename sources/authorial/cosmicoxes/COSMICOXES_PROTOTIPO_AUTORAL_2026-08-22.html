<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CosmicoXes - Atlas Vivo MILK</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* Universo Negro */
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #texto-poetico {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0); /* Invisível de início */
            z-index: 2;
            text-align: center;
            pointer-events: none;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            transition: color 2s ease;
        }
    </style>
    <!-- Importação da biblioteca Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="texto-poetico">
        Somos todos possíveis, somos cósmicos.<br>
        Vens iluminar esse mundo connosco?
    </div>

    <script>
        // 1. Configuração da Cena 3D
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 50;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // 2. Criação do Sistema de Partículas (CosmicoXes)
        const particleCount = 3000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const lifetimes = new Float32Array(particleCount);
        const velocities = [];

        // Inicializar partículas escondidas
        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = 9999;
            positions[i * 3 + 1] = 9999;
            positions[i * 3 + 2] = 0;
            lifetimes[i] = 0;
            velocities.push(new THREE.Vector3(0, 0, 0));
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('lifetime', new THREE.BufferAttribute(lifetimes, 1));

        // Shader que dá brilho, tamanho dinâmico e transparência às partículas
        const material = new THREE.ShaderMaterial({
            uniforms: {
                color: { value: new THREE.Color(0x44aaff) } // Cor base das partículas (Azul Cósmico)
            },
            vertexShader: `
                attribute float lifetime;
                varying float vLifetime;
                void main() {
                    vLifetime = lifetime;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    // O tamanho da partícula reage ao tempo de vida e à distância da câmara
                    gl_PointSize = (30.0 * lifetime) * (100.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform vec3 color;
                varying float vLifetime;
                void main() {
                    if (vLifetime <= 0.0) discard;
                    
                    // Desenhar partículas circulares e suaves
                    float dist = length(gl_PointCoord - vec2(0.5));
                    if (dist > 0.5) discard;
                    
                    float alpha = (0.5 - dist) * 2.0 * vLifetime;
                    gl_FragColor = vec4(color, alpha);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending, // Gera o efeito luminoso/mágico
            depthWrite: false
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // 3. Captura do Dedo/Cursor para Gerar Partículas
        let activeIndex = 0;
        let isInteracting = false;
        const textoPoetico = document.getElementById('texto-poetico');

        function spawnParticlesAt(x, y) {
            isInteracting = true;
            textoPoetico.style.color = "rgba(255, 255, 255, 0.9)"; // Revela o texto quando toca

            // Mapear coordenadas do ecrã para o espaço 3D do Three.js
            const vec = new THREE.Vector3(
                (x / window.innerWidth) * 2 - 1,
                -(y / window.innerHeight) * 2 + 1,
                0.5
            );
            vec.unproject(camera);
            const dir = vec.sub(camera.position).normalize();
            const distance = -camera.position.z / dir.z;
            const pos = camera.position.clone().add(dir.multiplyScalar(distance));

            // Nascer várias partículas por cada movimento
            for (let i = 0; i < 10; i++) {
                let idx = activeIndex % particleCount;
                
                // Dispersão inicial ao redor do dedo
                positions[idx * 3] = pos.x + (Math.random() - 0.5) * 2;
                positions[idx * 3 + 1] = pos.y + (Math.random() - 0.5) * 2;
                positions[idx * 3 + 2] = pos.z + (Math.random() - 0.5) * 2;
                
                // Velocidade inicial (física de expansão)
                velocities[idx].set(
                    (Math.random() - 0.5) * 0.8,
                    (Math.random() - 0.5) * 0.8,
                    (Math.random() - 0.5) * 0.8
                );
                
                lifetimes[idx] = 1.0; // Vida máxima ao nascer
                activeIndex++;
            }
        }

        // Suporte para rato
        window.addEventListener('mousemove', (e) => spawnParticlesAt(e.clientX, e.clientY));
        
        // Suporte perfeito para toque no telemóvel (dedo do utilizador)
        window.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Impede scroll do ecrã
            spawnParticlesAt(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        window.addEventListener('touchstart', (e) => {
            spawnParticlesAt(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        // 4. Ciclo de Animação (O Fluxo Cósmico)
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            // Atualizar física de cada partícula cósmica
            for (let i = 0; i < particleCount; i++) {
                if (lifetimes[i] > 0) {
                    positions[i * 3] += velocities[i].x;
                    positions[i * 3 + 1] += velocities[i].y;
                    positions[i * 3 + 2] += velocities[i].z;
                    
                    // Simulação do "Curl Noise" (As partículas giram e fluem organicamente como fumo cósmico)
                    velocities[i].x += Math.sin(positions[i * 3 + 1] * 0.5) * 0.02;
                    velocities[i].y += Math.cos(positions[i * 3] * 0.5) * 0.02;

                    // Desvanecer a partícula gradualmente
                    lifetimes[i] -= dt * 0.4; 
                    if (lifetimes[i] < 0) lifetimes[i] = 0;
                }
            }

            // Avisar a GPU que as posições mudaram
            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.lifetime.needsUpdate = true;

            // Rotação suave de toda a galáxia
            particles.rotation.y += 0.001;

            renderer.render(scene, camera);
        }

        animate();

        // Lidar com o redimensionamento do ecrã
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
