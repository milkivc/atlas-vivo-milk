rules:
  - never_log_secret_values
  - never_commit_secret_values
  - never_send_secret_values_to_Mistral_or_other_agents
  - never_rotate_delete_or_overwrite_credentials_from_automation
  - every_critical_workflow_runs_credential_presence_and_identity_isolation_gate_first
  - active_critical_missing_blocks_factory_before_code_or_deploy
  - active_degraded_missing_blocks_factory_before_code_or_deploy
  - authentication_failure_blocks_dependent_station_and_raises_persistent_alert
  - migration_and_atlas_FTPS_secret_values_must_never_be_equal
  - credentials_must_have_external_recovery_index_and_last_verification_state
  - new_credentials_must_be_registered_before_first_use
  - email_delivered_credentials_are_indexed_by_persistent_system_specific_Gmail_label
  - credential_monitor_runs_hourly_and_on_every_work_branch_push
  - no_agent_may_create_guess_infer_or_substitute_a_missing_credential
  - secret_values_must_never_be_copied_into_repository_artifacts_logs_or_issue_bodies
